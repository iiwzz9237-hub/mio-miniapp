<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Mio Point</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0b3d91;
  --card:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.10);
  --gold:#f4cf77;
  --text:#f5f5f7;
  --dim:#b6c8e8;
  --danger:#ff8585;
  --success:#93d8ba;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box}

html{
  min-height:100%;
  background:var(--bg);
  color-scheme:dark;
}

body{
  margin:0;
  min-height:100vh;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  background:var(--bg);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 85% 0%,rgba(64,156,255,.45),transparent 45%),
    radial-gradient(ellipse at 0% 70%,rgba(0,105,255,.30),transparent 50%),
    radial-gradient(ellipse at 50% 100%,rgba(0,47,120,.55),transparent 58%),
    linear-gradient(165deg,#1479e9 0%,#0b4fb3 38%,#082e74 72%,#061f52 100%);
}

button,input{font-family:inherit}

button{
  color:inherit;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

button:disabled{opacity:.55;cursor:not-allowed}

button:focus-visible,input:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:4px;
}

.app{
  position:relative;
  z-index:1;
  max-width:480px;
  margin:auto;
  padding:20px 20px 44px;
  animation:fade-in .65s var(--ease) backwards;
}

/* ===== Top bar ===== */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:4px 0 12px;
}

.brand{
  flex:1;
  min-width:0;
  text-align:center;
  font-size:12px;
  font-weight:600;
  line-height:1.9;
  color:#eef5ff;
  overflow-wrap:anywhere;
}

.icon-btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 44px;
  width:44px;
  height:44px;
  padding:0;
  border:1px solid rgba(255,255,255,.16);
  border-radius:15px;
  background:rgba(4,35,90,.36);
  color:#edf5ff;
  transition:transform .2s var(--ease),background .2s ease;
}

.icon{
  display:block;
  flex-shrink:0;
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.refresh-btn .icon{
  transform-box:view-box;
  transform-origin:50% 50%;
}

.refresh-btn.spinning .icon{animation:spin .85s linear infinite}

.bell-dot{
  position:absolute;
  top:8px;
  left:9px;
  display:none;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 3px #0b3d91;
}

.bell-dot.show{display:block;animation:pop-in .4s var(--ease) backwards}

/* ===== Title ===== */

.title-row{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  margin:24px 0 28px;
}

.title{
  margin:0;
  text-align:center;
  font-size:clamp(24px,7vw,34px);
  font-weight:800;
  letter-spacing:-.8px;
}

.back-arrow{position:absolute;right:0;display:none}

.view-active .title-row{padding-inline:49px}
.view-active .title{font-size:clamp(19px,5.8vw,28px);line-height:1.6}

/* ===== Balance ===== */

.balance-card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:32px 20px 36px;
  margin-bottom:22px;
  text-align:center;
  border:1px solid rgba(255,255,255,.17);
  border-radius:28px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(105,189,255,.24),transparent 75%),
    linear-gradient(135deg,rgba(7,55,133,.88),rgba(4,29,78,.88));
  box-shadow:0 18px 44px rgba(0,18,60,.26),inset 0 1px 0 rgba(255,255,255,.08);
  animation:rise .7s .04s var(--ease) backwards;
}

.balance-card::before{
  content:"";
  position:absolute;
  inset:0 18% auto;
  height:1px;
  background:linear-gradient(90deg,transparent,#8dcbff,transparent);
  pointer-events:none;
}

.balance-card::after{
  content:"";
  position:absolute;
  z-index:-1;
  left:-95px;
  bottom:-105px;
  width:170px;
  height:170px;
  border:1px solid rgba(122,195,255,.11);
  border-radius:50%;
  box-shadow:0 0 0 22px rgba(88,170,255,.045),0 0 0 44px rgba(88,170,255,.025);
  pointer-events:none;
}

.balance-label{margin-bottom:18px;font-size:13px;color:#dbeaff}

.balance-value{
  display:inline-block;
  max-width:100%;
  direction:ltr;
  font-size:clamp(30px,9vw,46px);
  font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1.3;
  letter-spacing:-1.5px;
  color:#f6d58a;
  overflow-wrap:anywhere;
}

.balance-unit{margin-inline-start:6px;font-size:17px;font-weight:700;color:#f1d289}

/* ===== Menu ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-bottom:22px;
}

.menu-btn{
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:13px;
  min-width:0;
  min-height:132px;
  padding:22px 10px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(12,71,164,.68),rgba(5,39,101,.62));
  text-align:center;
  font-size:14px;
  font-weight:600;
  line-height:1.7;
  transition:transform .25s var(--ease),border-color .25s ease,box-shadow .25s ease;
  animation:rise .65s var(--delay,.1s) var(--ease) backwards;
}

.menu-btn:nth-child(1){--delay:.10s}
.menu-btn:nth-child(2){--delay:.16s}
.menu-btn:nth-child(3){--delay:.22s}
.menu-btn:nth-child(4){--delay:.28s}
.menu-btn:nth-child(5){--delay:.34s}

.menu-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:46px;
  height:46px;
  border-radius:16px;
  background:rgba(255,255,255,.10);
  color:#d6edff;
  transition:transform .3s var(--ease);
}

#btnInvite .menu-icon{background:rgba(141,174,246,.16);color:#d8e7ff}
#btnBankWithdraw .menu-icon{background:rgba(136,213,181,.14);color:#a8ead0}
#btnDaily .menu-icon{background:rgba(192,156,238,.14);color:#dbc6f7}

.menu-btn.game-menu{
  grid-column:1/-1;
  flex-direction:row;
  justify-content:flex-start;
  gap:16px;
  min-height:106px;
  padding:20px;
  border-color:rgba(176,133,255,.23);
  background:
    radial-gradient(ellipse at 0% 50%,rgba(128,87,221,.18),transparent 70%),
    linear-gradient(135deg,rgba(17,69,153,.92),rgba(7,39,104,.92));
  text-align:right;
}

.game-menu .menu-icon{
  width:54px;
  height:54px;
  flex-shrink:0;
  font-size:30px;
  background:rgba(176,133,255,.10);
}

.menu-copy{flex:1;min-width:0}
.menu-copy strong{display:block;font-size:16px}
.menu-copy small{display:block;margin-top:5px;color:var(--dim);font-size:12px;font-weight:400}
.game-menu>.icon{color:#c9d9ff}

/* ===== Panel / fields ===== */

.panel{
  min-height:140px;
  padding:25px 21px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(7,57,139,.72),rgba(4,34,88,.68));
}

#homeSection>.panel{animation:rise .65s .4s var(--ease) backwards}

.panel h2{margin:0 0 12px;font-size:19px}
.panel p{margin:0 0 10px;color:var(--dim);font-size:14px;line-height:2}
.muted-center{text-align:center;padding:10px 0 4px}
.panel b{color:#e9ecf2}
.gold-text{color:var(--gold)!important}

.link-box{
  display:flex;
  align-items:center;
  gap:8px;
  margin:14px 0 18px;
  padding:12px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:17px;
  background:rgba(2,25,68,.35);
}

.link-box>span{
  flex:1;
  min-width:0;
  overflow-x:auto;
  direction:ltr;
  text-align:left;
  white-space:nowrap;
  font-size:13px;
}

.field-label{display:block;margin-top:14px;color:#eef4ff;font-size:13px}

.id-input{
  width:100%;
  margin:10px 0 6px;
  padding:16px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:17px;
  background:rgba(2,25,68,.38);
  color:var(--text);
  direction:ltr;
  text-align:left;
  font-size:16px;
  transition:border-color .2s,box-shadow .2s;
}

.id-input::placeholder{color:rgba(255,255,255,.45)}

.id-input:focus{
  outline:none;
  border-color:rgba(125,195,255,.72);
  box-shadow:0 0 0 4px rgba(80,164,255,.14);
}

.field-error{min-height:20px;margin-bottom:6px;color:var(--danger);font-size:12px;line-height:1.8}

/* ===== Buttons ===== */

.primary-btn,.ghost-btn,.copy-btn{
  position:relative;
  overflow:hidden;
  border:none;
  font-weight:700;
  transition:transform .2s var(--ease),opacity .2s,background .2s;
}

.primary-btn{
  width:100%;
  margin-top:10px;
  padding:16px;
  border-radius:17px;
  background:linear-gradient(115deg,#f6d98f,#e8bd5e);
  color:#252014;
  font-size:15px;
  font-weight:800;
}

.ghost-btn{
  width:100%;
  margin-top:10px;
  padding:14px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:17px;
  background:rgba(4,32,84,.35);
  color:#c8d7ef;
  font-size:14px;
}

.copy-btn{
  flex-shrink:0;
  padding:9px 14px;
  border-radius:11px;
  background:linear-gradient(115deg,#f6d98f,#e8bd5e);
  color:#252014;
  font-size:12px;
  white-space:nowrap;
}

.copy-btn.copied{background:#92d7ad;color:#143322}

.primary-btn.rgb-btn{
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:64px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(110deg,#ff356f,#a855f7 22%,#4f6cff 44%,#06b6d4 65%,#22c55e 82%,#ff356f);
  background-size:350% 350%;
  color:#fff;
  box-shadow:0 8px 25px rgba(109,80,230,.20);
  animation:rgb-flow 7s ease-in-out infinite;
}

.rgb-btn .btn-label{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:112px;
  padding:7px 20px;
  border:1px solid rgba(255,255,255,.20);
  border-radius:11px;
  background:#111625;
  color:#fff;
  font-size:15px;
  font-weight:800;
  line-height:1.6;
  pointer-events:none;
}

.btn-label .icon{width:18px;height:18px;stroke-width:2.2}

.menu-btn:active,.primary-btn:active,.ghost-btn:active,.copy-btn:active,.icon-btn:active{
  transform:scale(.965);
}

.spinner{
  width:38px;
  height:38px;
  margin:8px auto 16px;
  border:2px solid rgba(244,207,119,.12);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .9s linear infinite;
}

.result-icon{text-align:center;font-size:42px;margin:4px 0 18px;animation:pop-in .6s var(--ease) backwards}
.toggle-row{margin:16px 0 12px;padding:14px 16px;border:1px solid rgba(255,255,255,.13);border-radius:17px;background:rgba(2,25,68,.35)}
.status-text{color:var(--success);font-size:15px;font-weight:700}

/* ===== Game ===== */

.game-intro{text-align:center}

.game-badge{
  display:inline-block;
  padding:5px 12px;
  margin-bottom:12px;
  border:1px solid rgba(183,147,255,.18);
  border-radius:999px;
  background:rgba(183,147,255,.07);
  color:#d5befb;
  font-size:11px;
}

.slot-machine{
  position:relative;
  display:block;
  width:100%;
  margin:12px 0 18px;
  padding:20px 12px 16px;
  overflow:hidden;
  border:1px solid rgba(219,180,255,.30);
  border-radius:25px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(188,95,251,.22),transparent 70%),
    linear-gradient(145deg,#282039,#151422);
  box-shadow:0 16px 35px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .2s var(--ease),border-color .2s;
}

.slot-machine:disabled{opacity:1}

.slot-machine:not(:disabled):active{transform:scale(.985)}

.slot-heading{
  display:block;
  margin-bottom:18px;
  direction:ltr;
  color:#eedcfc;
  font-size:14px;
  font-weight:800;
  letter-spacing:3px;
}

.reels{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  direction:ltr;
}

.reel{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  height:104px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.13);
  border-radius:17px;
  background:linear-gradient(#101019,#282337 48%,#101019);
  box-shadow:inset 0 9px 18px rgba(0,0,0,.35);
}

.reel::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  pointer-events:none;
}

.reel-symbol{
  display:block;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:clamp(36px,11vw,54px);
  line-height:1;
}

.reel.rolling .reel-symbol{animation:reel-shake .13s linear infinite}

.slot-footer{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:17px;
  color:#afa3c8;
  font-size:11px;
}

.slot-light{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#dcbafa;
  box-shadow:0 0 8px rgba(220,186,250,.45);
}

.game-result{
  padding:15px;
  margin:14px 0;
  border:1px solid rgba(244,207,119,.18);
  border-radius:18px;
  background:rgba(244,207,119,.045);
  text-align:center;
  animation:rise .4s var(--ease) backwards;
}

.game-result small{display:block;color:var(--dim);font-size:11px}
.game-result strong{display:block;margin:7px 0;font-size:25px;color:var(--gold)}
.game-result p{font-size:12px;margin:0}

.game-status{
  min-height:54px;
  margin:14px 0 4px;
  text-align:center;
  color:var(--dim);
  font-size:12px;
  line-height:1.9;
}

.game-status b{
  display:block;
  direction:ltr;
  color:#ded1fa;
  font-variant-numeric:tabular-nums;
  font-size:20px;
}

.prize-table{
  width:100%;
  margin-top:22px;
  border-collapse:collapse;
  text-align:center;
  font-size:12px;
}

.prize-table caption{
  padding-bottom:10px;
  text-align:right;
  color:#d5d9e2;
  font-size:13px;
  font-weight:700;
}

.prize-table th,.prize-table td{
  padding:11px 4px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.prize-table th{color:var(--dim);font-size:11px;font-weight:500}
.prize-table td:first-child{font-size:21px}
.game-note{margin-top:14px!important;font-size:11px!important}

/* ===== Skeleton ===== */

.skel{
  border-radius:28px;
  background:linear-gradient(100deg,rgba(255,255,255,.055) 30%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.055) 70%);
  background-size:220% 100%;
  animation:shimmer 1.8s ease-in-out infinite;
}

.skel-card{height:176px;margin-bottom:22px}
.skel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.skel-btn{height:132px;border-radius:22px}
.skel-game{height:106px;grid-column:1/-1;border-radius:22px}
.skel-panel{height:140px}

/* ===== Notifications ===== */

.sheet-overlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 76px) 16px 20px;
  background:rgba(2,22,60,.70);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .25s,visibility .25s;
}

.sheet-overlay.show{opacity:1;visibility:visible;pointer-events:auto}

.sheet{
  width:min(420px,100%);
  max-height:70vh;
  max-height:70dvh;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:18px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:26px;
  background:linear-gradient(145deg,#0d4da8,#082c69);
  box-shadow:0 30px 90px rgba(0,0,0,.4);
  transform:translateY(-14px) scale(.975);
  transition:transform .35s var(--ease);
}

.sheet-overlay.show .sheet{transform:translateY(0) scale(1)}
.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet h3{margin:0;font-size:16px}
.close-btn{width:34px;height:34px;flex-basis:34px;border-radius:11px}

.notif-item{
  margin-bottom:8px;
  padding:12px 14px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  background:rgba(255,255,255,.06);
  font-size:14px;
  line-height:1.9;
  overflow-wrap:anywhere;
  animation:rise .4s var(--ease) backwards;
}

.notif-item.success{border-inline-start:3px solid var(--success)}
.notif-item.fail{border-inline-start:3px solid var(--danger)}
.notif-item .t{margin-top:5px;direction:ltr;text-align:right;color:var(--dim);font-size:11px}
.notif-empty{padding:24px 0;text-align:center;color:var(--dim);font-size:14px}

/* ===== Toast / animations ===== */

.toast{
  position:fixed;
  z-index:100;
  bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  left:50%;
  width:max-content;
  max-width:calc(100vw - 40px);
  padding:12px 18px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:15px;
  background:#0a3a83;
  color:var(--text);
  box-shadow:0 12px 36px rgba(0,0,0,.3);
  text-align:center;
  font-size:13px;
  line-height:1.9;
  opacity:0;
  visibility:hidden;
  transform:translate(-50%,14px);
  pointer-events:none;
  transition:opacity .25s,transform .3s var(--ease),visibility .25s;
}

.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:ripple-out .6s var(--ease) forwards}
.anim-in-right{animation:forward-in .4s var(--ease) backwards}
.anim-in-left{animation:back-in .4s var(--ease) backwards}
.anim-pop{animation:rise .35s var(--ease) backwards}

@media(hover:hover) and (pointer:fine){
  .menu-btn:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.24);box-shadow:0 12px 28px rgba(0,0,0,.16)}
  .menu-btn:hover .menu-icon{transform:translateY(-2px) rotate(-5deg)}
  .primary-btn:not(:disabled):hover{transform:translateY(-2px)}
  .icon-btn:hover,.ghost-btn:hover{background:rgba(255,255,255,.10)}
}

@media(max-width:360px){
  .app{padding-inline:14px}
  .brand{font-size:11px}
  .menu-btn{font-size:13px;padding-inline:7px}
  .panel{padding-inline:16px}
  .reel{height:88px}
  .menu-btn.game-menu{padding:16px;gap:12px}
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes rgb-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes forward-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes back-in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes ripple-out{from{opacity:.16;transform:scale(0)}to{opacity:0;transform:scale(1)}}
@keyframes reel-shake{0%{transform:translateY(-5px)}100%{transform:translateY(5px)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ===== Custom bottom navigation + appearance settings ===== */
:root{
  --user-bg:#0d1016;
  --user-card:#202027;
  --user-accent:#4f8cff;
}

html{background:var(--user-bg)!important}
body{
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 94px)!important;
  background:var(--user-bg)!important;
}
body::before{
  background:
    radial-gradient(ellipse at 88% 0%,rgba(255,255,255,.065),transparent 46%),
    radial-gradient(ellipse at 0% 68%,rgba(91,135,220,.075),transparent 50%),
    linear-gradient(165deg,var(--user-bg),var(--user-bg))!important;
}
.app{padding-bottom:122px!important}
.balance-card{
  border-color:rgba(255,255,255,.12)!important;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.075),transparent 72%),
    linear-gradient(135deg,var(--user-card),var(--user-bg))!important;
}
.balance-card::before{background:linear-gradient(90deg,transparent,var(--user-accent),transparent)!important}
.balance-value,.balance-unit,.gold-text{color:var(--user-accent)!important}
.menu-btn,.panel{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.022))!important}
.primary-btn:not(.rgb-btn),.copy-btn{background:var(--user-accent)!important;color:#fff!important}
.id-input:focus{border-color:var(--user-accent)!important;box-shadow:none!important}

.bottom-nav{
  position:fixed;
  z-index:45;
  right:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  width:min(448px,calc(100vw - 22px));
  transform:translateX(50%);
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(12,15,22,.92);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(0,0,0,.34);
}
.bottom-nav button{
  min-width:0;
  min-height:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:7px 2px;
  border:0;
  border-radius:15px;
  background:transparent;
  color:var(--dim);
  font-size:10px;
  font-weight:700;
}
.bottom-nav button.active{background:rgba(255,255,255,.075);color:var(--text)}
.bottom-nav button.active .nav-svg{color:var(--user-accent)}
.nav-svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-game-icon{font-size:21px;line-height:1}

.settings-wrap{display:grid;gap:12px}
.settings-card{padding:16px;border:1px solid var(--border);border-radius:19px;background:rgba(255,255,255,.03)}
.settings-card h3{margin:0 0 7px;font-size:14px}
.settings-card p{margin:0;color:var(--dim);font-size:12px;line-height:1.9}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.switch{position:relative;width:50px;height:28px;flex:0 0 50px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch-track{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.12);transition:.2s}
.switch-track::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + .switch-track{background:var(--user-accent)}
.switch input:checked + .switch-track::after{transform:translateX(22px)}

.color-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.color-field{padding:10px 7px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025);text-align:center;color:var(--dim);font-size:10px}
.color-field input{display:block;width:100%;height:40px;margin-top:7px;padding:0;border:0;border-radius:9px;background:transparent}

.layout-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.layout-choice{padding:11px 5px;border:1px solid var(--border);border-radius:13px;background:rgba(255,255,255,.025);color:var(--text);font-size:11px;font-weight:700}
.layout-choice.active{border-color:var(--user-accent);background:rgba(255,255,255,.065)}

.theme-preview{padding:17px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(145deg,var(--user-card),var(--user-bg))}
.theme-preview strong{display:block;margin-bottom:5px}
.theme-preview small{display:block;color:var(--dim);line-height:1.8}
.preview-accent{display:inline-block;margin-top:11px;padding:8px 13px;border-radius:10px;background:var(--user-accent);color:#fff;font-size:11px;font-weight:800}

.profile-box{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:15px;border:1px solid var(--border);border-radius:19px;background:rgba(255,255,255,.03)}
.profile-avatar{display:flex;align-items:center;justify-content:center;width:58px;height:58px;flex:0 0 58px;overflow:hidden;border:1px solid var(--border);border-radius:50%;background:rgba(255,255,255,.06);font-size:22px;font-weight:800}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-box strong{display:block;font-size:15px}
.profile-box small{display:block;margin-top:4px;color:var(--dim);direction:ltr;text-align:right;font-size:11px}
.profile-list{display:grid;gap:8px}
.profile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.025);font-size:12px}
.profile-row span{color:var(--dim)}
.profile-row b{direction:ltr;text-align:left}

body.theme-light{
  --text:#172235;
  --dim:#6e7d91;
  --border:rgba(20,45,80,.12);
  color-scheme:light;
  background:#eef3f8!important;
}
body.theme-light::before{background:linear-gradient(165deg,#f1f5fa,#e9eff6)!important}
body.theme-light .bottom-nav{background:rgba(250,252,255,.94)}
body.theme-light .icon-btn,
body.theme-light .menu-btn,
body.theme-light .panel,
body.theme-light .settings-card,
body.theme-light .profile-box,
body.theme-light .profile-row{background:rgba(255,255,255,.72)!important}
body.theme-light .balance-card{background:linear-gradient(145deg,#ffffff,#e7edf5)!important}
body.theme-light .balance-value,
body.theme-light .title,
body.theme-light .brand,
body.theme-light .panel b,
body.theme-light .profile-box strong{color:#162238!important}

body.layout-compact .app{padding-inline:13px!important}
body.layout-compact .grid{gap:8px!important}
body.layout-compact .menu-btn{min-height:108px!important;padding:16px 8px!important}
body.layout-compact .balance-card{padding:25px 16px 28px!important}

body.layout-list .grid{grid-template-columns:1fr!important}
body.layout-list .menu-btn{min-height:84px!important;flex-direction:row!important;justify-content:flex-start!important;padding:14px 16px!important;text-align:right!important}
body.layout-list .menu-btn.game-menu{grid-column:auto!important}
body.layout-list .menu-icon,
body.layout-list .game-menu .menu-icon{width:46px!important;height:46px!important;flex:0 0 46px!important}

@media(max-width:350px){
  .bottom-nav{width:calc(100vw - 14px)}
  .bottom-nav button{font-size:9px}
  .color-controls{grid-template-columns:1fr}
}

<script>
"use strict";

const API_BASE = "https://mio-backend-1-sus9.onrender.com/api";
const tg = window.Telegram?.WebApp;

if (tg) {
  try { tg.ready(); } catch (e) {}
  try { tg.expand(); } catch (e) {}
}

const TG_USER_ID = tg?.initDataUnsafe?.user?.id || "guest";
const TG_FIRST_NAME = tg?.initDataUnsafe?.user?.first_name || "";

const greeting = TG_FIRST_NAME
  ? `خوش آمدید ${TG_FIRST_NAME} عزیز`
  : "خوش آمدید عزیز";

document.getElementById("topWelcome").textContent = greeting;
document.getElementById("welcomeText").textContent = greeting;

const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia
  ? window.matchMedia("(prefers-reduced-motion: reduce)")
  : { matches:false };

const app = $("app");
const panel = $("panel");
const homeSection = $("homeSection");
const viewSection = $("viewSection");
const pageTitle = $("pageTitle");
const backArrow = $("backArrow");
const refreshBtn = $("refreshBtn");

const state = {
  balance: 0,
  daily_enabled: false,
  notifications: [],
  not_started: false
};

let hasUserData = false;
let currentView = "home";
let viewVersion = 0;
let userRequestVersion = 0;

let activeWithdrawal = null;
let pollingWithdrawal = false;
let lastWithdrawMethod = "id";
let enablingDaily = false;

let gameState = null;
let gameBusy = false;
let gameTimer = null;

const GAME_SYMBOLS = {
  seven: "7️⃣",
  grape: "🍇",
  lemon: "🍋",
  blank: "✖️"
};

const SYMBOL_NAMES = {
  seven: "هفت",
  grape: "انگور",
  lemon: "لیمو",
  blank: "پوچ"
};

const DEFAULT_PAYOUTS = {
  seven: [0, 100000, 200000, 400000],
  grape: [0, 30000, 60000, 80000],
  lemon: [0, 10000, 20000, 30000],
  blank: [0, 0, 0, 0]
};

async function api(path, options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 25000);

  try {
    const response = await fetch(API_BASE + path, {
      ...options,
      signal: controller.signal,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "tma " + (tg?.initData || "")
      }
    });

    const data = await response.json();

    if (!data || typeof data !== "object" || Array.isArray(data)) {
      return { ok: false, error: "invalid_response" };
    }

    if (!response.ok) {
      return {
        ...data,
        ok: false,
        error: data.error || "server",
        http_status: response.status
      };
    }

    return data;
  } catch (error) {
    console.error("API request failed:", path, error);
    return { ok: false, error: "network" };
  } finally {
    clearTimeout(timeout);
  }
}

function post(path, data = {}) {
  return api(path, {
    method: "POST",
    body: JSON.stringify(data)
  });
}

function errorText(code) {
  return {
    unauthorized: "لطفاً مینی‌اپ را ببند و دوباره از داخل تلگرام باز کن.",
    not_started: "ابتدا ربات را استارت کن، سپس دوباره وارد شو.",
    zero_balance: "موجودی قابل برداشت شما صفر است.",
    already_pending: "یک برداشت در حال پردازش داری.",
    withdrawal_pending: "بعد از پایان برداشت فعلی دوباره امتحان کن.",
    game_disabled: "بازی فعلاً غیرفعال است.",
    cooldown: "هنوز زمان بازی بعدی نرسیده است.",
    invalid_target: "آیدی تلگرام معتبر وارد کن.",
    invalid_card: "شماره کارت باید بین ۱۰ تا ۲۰ رقم باشد.",
    database_unavailable: "ارتباط با سرور برقرار نشد؛ دوباره تلاش کن.",
    network: "ارتباط قطع شد؛ دوباره تلاش کن.",
    invalid_response: "پاسخ سرور کامل دریافت نشد.",
    bot_username_not_configured: "لینک دعوت هنوز تنظیم نشده است."
  }[code] || "عملیات انجام نشد؛ دوباره تلاش کن.";
}

function fmt(value) {
  return Number(value || 0).toLocaleString("en-US");
}

function icon(name) {
  return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
    <use href="#i-${name}"></use>
  </svg>`;
}

function confirmLabel(text = "تأیید") {
  return `<span class="btn-label">${icon("check")}<span>${text}</span></span>`;
}

function englishDigits(value) {
  return value
    .replace(/[۰-۹]/g, d => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
    .replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
}

function ensureUserData() {
  if (!hasUserData) {
    showToast("اطلاعات حساب هنوز دریافت نشده؛ بروزرسانی را بزن.");
    return false;
  }

  if (state.not_started) {
    showToast(errorText("not_started"));
    return false;
  }

  return true;
}

let toastTimer;

function showToast(message) {
  clearTimeout(toastTimer);
  $("toast").textContent = message;
  $("toast").classList.add("show");

  toastTimer = setTimeout(() => {
    $("toast").classList.remove("show");
  }, 4000);
}

async function copyText(text, button) {
  if (!text) return;

  try {
    await navigator.clipboard.writeText(text);

    if (!button.isConnected) return;

    button.textContent = "کپی شد ✓";
    button.classList.add("copied");

    setTimeout(() => {
      if (!button.isConnected) return;
      button.textContent = "کپی";
      button.classList.remove("copied");

const THEME_KEY = `mio_theme_${TG_USER_ID}`;

function readTheme() {
  try {
    const data = JSON.parse(localStorage.getItem(THEME_KEY) || "{}");
    return data && typeof data === "object" ? data : {};
  } catch (e) {
    return {};
  }
}

function writeTheme(data) {
  try { localStorage.setItem(THEME_KEY, JSON.stringify(data)); } catch (e) {}
}

function validHex(value, fallback) {
  return /^#[0-9a-f]{6}$/i.test(String(value || "")) ? value : fallback;
}

function applyTheme(data) {
  data = data || readTheme();

  const root = document.documentElement;
  const dark = data.mode !== "light";
  const bg = validHex(data.bg, "#0d1016");
  const card = validHex(data.card, "#202027");
  const accent = validHex(data.accent, "#4f8cff");
  const layout = ["normal","compact","list"].includes(data.layout)
    ? data.layout
    : "normal";

  root.style.setProperty("--user-bg", bg);
  root.style.setProperty("--user-card", card);
  root.style.setProperty("--user-accent", accent);
  root.style.background = dark ? bg : "#eef3f8";

  document.body.classList.toggle("theme-light", !dark);
  document.body.classList.toggle("layout-compact", layout === "compact");
  document.body.classList.toggle("layout-list", layout === "list");

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? bg : "#eef3f8");
}

function setActiveNav(name) {
  const map = {
    home:"navHome",
    theme:"navTheme",
    game:"navGame",
    profile:"navProfile"
  };

  ["navHome","navTheme","navGame","navProfile"].forEach(id => {
    const element = $(id);
    if (element) element.classList.toggle("active", id === map[name]);
  });
}

function tinyHaptic(type) {
  try { tg?.HapticFeedback?.impactOccurred?.(type || "light"); } catch (e) {}
}

function escapeText(value) {
  const map = {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  };

  return String(value == null ? "" : value).replace(/[&<>"']/g, ch => map[ch]);
}

let balanceFrame = 0;
let displayedBalance = 0;

function setBalance(value) {
  const target = Number(value);
  if (!Number.isFinite(target)) return;

  state.balance = target;
  cancelAnimationFrame(balanceFrame);

  if (reduceMotion.matches || displayedBalance === target) {
    displayedBalance = target;
    $("balanceValue").textContent = fmt(target);
    return;
  }

  const from = displayedBalance;
  const startedAt = performance.now();

  function tick(now) {
    const progress = reduceMotion.matches
      ? 1
      : Math.min((now - startedAt) / 850, 1);

    const eased = 1 - Math.pow(1 - progress, 4);

    displayedBalance = from + (target - from) * eased;

    $("balanceValue").textContent = fmt(
      progress === 1 ? target : Math.round(displayedBalance)
    );

    if (progress < 1) {
      balanceFrame = requestAnimationFrame(tick);
    }
  }

  balanceFrame = requestAnimationFrame(tick);
}

const LAST_SEEN_KEY = `mio_last_seen_notif_${TG_USER_ID}`;

let seenMemory = "";
let previousFocus = null;
let previousOverflow = "";

function notificationKey(notification) {
  return String(notification?.id || notification?.time || "");
}

function getSeen() {
  try {
    return localStorage.getItem(LAST_SEEN_KEY) || seenMemory;
  } catch {
    return seenMemory;
  }
}

function setSeen(value) {
  seenMemory = value;

  try {
    localStorage.setItem(LAST_SEEN_KEY, value);
  } catch {}
}

function renderNotifications() {
  const list = $("notifList");
  list.replaceChildren();

  if (!state.notifications.length) {
    const empty = document.createElement("div");
    empty.className = "notif-empty";
    empty.textContent = "هنوز اعلانی نداری";
    list.appendChild(empty);
    return;
  }

  state.notifications.forEach((notification, index) => {
    const item = document.createElement("div");
    item.className = "notif-item " +
      (notification.type === "fail" ? "fail" : "success");
    item.style.animationDelay = `${Math.min(index, 6) * 45}ms`;

    const text = document.createElement("div");
    text.textContent = String(notification.text || "");

    const time = document.createElement("div");
    time.className = "t";
    time.textContent = String(notification.time || "");

    item.append(text, time);
    list.appendChild(item);
  });
}

function updateBellDot() {
  const newest = notificationKey(state.notifications[0]);
  $("bellDot").classList.toggle("show", Boolean(newest && newest !== getSeen()));
}

function openNotifications() {
  const overlay = $("notifOverlay");
  if (overlay.classList.contains("show")) return;

  previousFocus = document.activeElement;
  previousOverflow = document.body.style.overflow;

  renderNotifications();
  overlay.inert = false;
  overlay.setAttribute("aria-hidden", "false");
  overlay.classList.add("show");
  $("bellBtn").setAttribute("aria-expanded", "true");

  document.body.style.overflow = "hidden";
  $("closeNotifBtn").focus({ preventScroll: true });
  app.inert = true;

  setSeen(notificationKey(state.notifications[0]));
  updateBellDot();
}

function closeNotifications() {
  const overlay = $("notifOverlay");

  if (!overlay.classList.contains("show")) return;

  app.inert = false;
  document.body.style.overflow = previousOverflow;
  $("bellBtn").setAttribute("aria-expanded", "false");

  if (previousFocus?.isConnected) {
    previousFocus.focus({ preventScroll: true });
  }

  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden", "true");
  overlay.inert = true;
}

$("bellBtn").onclick = openNotifications;
$("closeNotifBtn").onclick = closeNotifications;

$("notifOverlay").onclick = event => {
  if (event.target === $("notifOverlay")) closeNotifications();
};

$("notifSheet").addEventListener("keydown", event => {
  if (event.key === "Escape") {
    event.preventDefault();
    closeNotifications();
  }

  if (event.key === "Tab") {
    event.preventDefault();
    $("closeNotifBtn").focus();

});

function viewActiveWithdrawal() {
  if (activeWithdrawal?.phase === "unknown") {
    viewWithdrawUnknown();
    return;
  }

  viewWithdrawWaiting();

  if (activeWithdrawal?.phase === "pending" && !pollingWithdrawal) {
    pollWithdrawStatus();
  }
}

async function startWithdrawal(method, value) {
  if (activeWithdrawal) return viewActiveWithdrawal();

  const job = {
    method,
    phase: "submitting",
    withdraw_id: null
  };

  activeWithdrawal = job;
  lastWithdrawMethod = method;
  viewWithdrawWaiting();

  const result = method === "bank"
    ? await post("/withdraw-bank", { card: value })
    : await post("/withdraw", { target: value });

  if (activeWithdrawal !== job) return;

  if (result.ok || result.error === "already_pending") {
    Object.assign(job, result, { phase: "pending" });
    if (isWithdrawalView()) updateWaitingInfo(job);
    pollWithdrawStatus();
    return;
  }

  if (
    ["network", "invalid_response", "database_unavailable", "server"]
      .includes(result.error)
  ) {
    job.phase = "unknown";
    if (isWithdrawalView()) viewWithdrawUnknown();
    else showToast("وضعیت برداشت مشخص نشد؛ دوباره بررسی کن.");
    return;
  }

  activeWithdrawal = null;
  if (isWithdrawalView()) viewWithdrawFailed(errorText(result.error));
  else showToast(errorText(result.error));
}

async function pollWithdrawStatus() {
  if (pollingWithdrawal || !activeWithdrawal) return;

  const job = activeWithdrawal;
  pollingWithdrawal = true;
  job.phase = "pending";

  try {
    for (let attempt = 0; attempt < 40; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 3000));
      if (activeWithdrawal !== job) return;

      if (!job.withdraw_id) {
        const user = await api("/user");

        if (user.pending_withdrawal?.withdraw_id) {
          Object.assign(job, user.pending_withdrawal);
        } else {
          job.phase = "unknown";
          if (isWithdrawalView()) viewWithdrawUnknown();
          return;
        }
      }

      const result = await api(
        "/withdraw-status?withdraw_id=" +
        encodeURIComponent(job.withdraw_id)
      );

      if (activeWithdrawal !== job) return;

      if (result.status === "success") {
        activeWithdrawal = null;

        if (isWithdrawalView()) viewWithdrawSuccess();
        else showToast("🎉 برداشت شما با موفقیت انجام شد.");

        refreshData(false);
        return;
      }

      if (result.status === "failed") {
        activeWithdrawal = null;

        if (isWithdrawalView()) viewWithdrawFailed();
        else showToast("برداشت ناموفق بود.");

        refreshData(false);
        return;
      }

      if (result.status === "pending") {
        Object.assign(job, result);
        if (currentView === "withdraw-waiting") updateWaitingInfo(job);
      }
    }

    job.phase = "unknown";
    if (isWithdrawalView()) viewWithdrawUnknown();
  } finally {
    pollingWithdrawal = false;
  }
}

const GAME_PENDING_KEY = `mio_game_pending_${TG_USER_ID}`;
let pendingGameMemory = "";

function getPendingGame() {
  try {
    return localStorage.getItem(GAME_PENDING_KEY) || pendingGameMemory;
  } catch {
    return pendingGameMemory;
  }
}

function savePendingGame(id) {
  pendingGameMemory = id;
  try {
    localStorage.setItem(GAME_PENDING_KEY, id);
  } catch {}
}

function clearPendingGame(id) {
  if (pendingGameMemory === id) pendingGameMemory = "";

  try {
    if (localStorage.getItem(GAME_PENDING_KEY) === id) {
      localStorage.removeItem(GAME_PENDING_KEY);
    }
  } catch {}
}

function makeRequestId() {
  if (crypto.randomUUID) return crypto.randomUUID();

  const bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 15) | 64;
  bytes[8] = (bytes[8] & 63) | 128;

  const hex = [...bytes].map(v => v.toString(16).padStart(2, "0"));

  return [
    hex.slice(0, 4).join(""),
    hex.slice(4, 6).join(""),
    hex.slice(6, 8).join(""),
    hex.slice(8, 10).join(""),
    hex.slice(10, 16).join("")
  ].join("-");
}

function acceptGameState(data) {
  gameState = {
    ...data,
    deadline: performance.now() +
      Math.max(0, Number(data.remaining_seconds) || 0) * 1000
  };
}

function remainingGameSeconds() {
  if (!gameState) return 0;
  return Math.max(0, Math.ceil((gameState.deadline - performance.now()) / 1000));
}

function formatCountdown(seconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;

  return [hours, minutes, secs]
    .map(value => String(value).padStart(2, "0"))
    .join(":");
}

function canStartGame() {
  return Boolean(
    gameState?.enabled &&
    !gameState.withdrawal_pending &&
    remainingGameSeconds() === 0
  );
}

async function viewGame() {
  if (!ensureUserData()) return;

  const version = showView("game", "🎰 بازی میویی");
  setActiveNav("game");

  if (gameBusy && gameState) {
    renderGame();
    return;
  }

  paint(`
    <div class="spinner" aria-hidden="true"></div>
    <p class="muted-center" role="status">در حال دریافت وضعیت بازی…</p>
  `);

  const result = await api("/game/status");

  if (version !== viewVersion) return;

  if (!result.ok) {
    paint(`
      <p class="muted-center" id="gameLoadError"></p>
      <button type="button" class="primary-btn" id="reloadGameBtn">تلاش دوباره</button>
    `);

    $("gameLoadError").textContent = errorText(result.error);
    $("reloadGameBtn").onclick = viewGame;
    return;
  }

  acceptGameState(result);
  setBalance(result.balance);
  renderGame();
}

function renderGame() {
  if (currentView !== "game" || !gameState) return;

  clearGameTimer();

  const lastRound = gameState.last_round;
  const symbols = Array.isArray(lastRound?.symbols)
    ? lastRound.symbols
    : ["seven", "grape", "lemon"];

  const payouts = gameState.payouts || DEFAULT_PAYOUTS;

  const tableRows = ["seven", "grape", "lemon", "blank"].map(symbol => {
    const values = payouts[symbol] || DEFAULT_PAYOUTS[symbol];

    return `
      <tr>
        <td aria-label="${SYMBOL_NAMES[symbol]}">${GAME_SYMBOLS[symbol]}</td>
        <td>${fmt(values[1])}</td>
        <td>${fmt(values[2])}</td>
        <td>${fmt(values[3])}</td>
      </tr>
    `;
  }).join("");

  paint(`
    <div class="game-intro">
      <span class="game-badge">یک بازی رایگان، هر ۴۸ ساعت</span>
      <p>روی دستگاه بزن و شانست رو امتحان کن ✨</p>
    </div>

    <button type="button" class="slot-machine" id="slotMachine"
      aria-label="شروع بازی میویی" disabled>
      <span class="slot-heading">MIO LUCK</span>

      <span class="reels" aria-hidden="true">
        ${symbols.map((symbol, index) => `
          <span class="reel" id="reel${index}">
            <span class="reel-symbol" id="reelSymbol${index}">
              ${GAME_SYMBOLS[symbol] || "✖️"}
            </span>
          </span>
        `).join("")}
      </span>

      <span class="slot-footer">
        <span class="slot-light"></span>
        سه خانه، یک شانس تازه
        <span class="slot-light"></span>
      </span>
    </button>

    <button type="button" class="primary-btn rgb-btn" id="playGameBtn" disabled>
      <span class="btn-label" id="playGameLabel">بازی کن</span>
    </button>

    <div class="game-status" id="gameStatus" role="status"></div>

    ${lastRound ? `
      <div class="game-result">
        <small>آخرین نتیجهٔ ثبت‌شده</small>
        <strong>${fmt(lastRound.reward)} میو</strong>
        <p>
          ${Number(lastRound.reward) > 0
            ? "این جایزه به موجودی قابل برداشتت اضافه شده 🎉"
            : "این بار جایزه‌ای نداشتی؛ بازی بعدی منتظرته 🍀"}
        </p>
      </div>
    ` : ""}

    <table class="prize-table">
      <caption>جدول جایزه‌ها — به میو</caption>
      <thead>
        <tr>
          <th scope="col">نماد</th>
          <th scope="col">یک عدد</th>
          <th scope="col">دو عدد</th>
          <th scope="col">سه عدد</th>
        </tr>
      </thead>
      <tbody>${tableRows}</tbody>
    </table>

    <p class="game-note">
      جایزهٔ نمادهای مختلف با هم جمع می‌شود.
      مثلاً هفت + انگور + پوچ = ۱۳۰,۰۰۰ میو.
    </p>

    <button type="button" class="ghost-btn" id="gameRefreshBtn">
      بروزرسانی وضعیت بازی
    </button>
  `);

  $("slotMachine").onclick = playGame;
  $("playGameBtn").onclick = playGame;
  $("gameRefreshBtn").onclick = viewGame;

  updateGameControls();
  gameTimer = setInterval(updateGameControls, 1000);
}

function updateGameControls() {
  if (currentView !== "game" || !$("playGameBtn")) return;

  const pendingId = getPendingGame();
  const canPlay = !gameBusy && (Boolean(pendingId) || canStartGame());

  $("playGameBtn").disabled = !canPlay;
  $("slotMachine").disabled = !canPlay;
  $("gameRefreshBtn").disabled = gameBusy;

  if (gameBusy) {
    $("playGameLabel").textContent = "در حال دریافت نتیجه…";
    $("gameStatus").textContent = "چند لحظه صبر کن 🎰";
    return;
  }

  if (pendingId) {
    $("playGameLabel").textContent = "بازیابی نتیجه";
    $("gameStatus").textContent =
      "پاسخ بازی قبلی کامل نرسیده؛ برای دریافت همان نتیجه بزن.";
    return;
  }

  $("playGameLabel").textContent = "بازی کن 🎰";

  if (!gameState.enabled) {
    $("gameStatus").textContent = "بازی فعلاً غیرفعال است.";
    return;
  }

  if (gameState.withdrawal_pending) {
    $("gameStatus").textContent =
      "برداشتت در حال پردازش است؛ بعد از پایان آن وضعیت بازی را بروزرسانی کن.";
    return;
  }

  const remaining = remainingGameSeconds();

  if (remaining > 0) {
    $("gameStatus").innerHTML = `
      بازی بعدی
      <b>${formatCountdown(remaining)}</b>
    `;
  } else {
    $("gameStatus").textContent = "شانست آماده‌ست؛ بازی کاملاً رایگانه ✨";
  }
}

function startReelAnimation() {
  const reels = [0, 1, 2].map(index => ({
    box: $("reel" + index),
    symbol: $("reelSymbol" + index),
    interval: null
  }));

  const values = Object.values(GAME_SYMBOLS);

  if (!reduceMotion.matches) {
    reels.forEach(reel => {
      reel.box?.classList.add("rolling");

      reel.interval = setInterval(() => {
        if (reel.symbol) {
          reel.symbol.textContent =
            values[Math.floor(Math.random() * values.length)];
        }
      }, 75);
    });
  }

  function stopOne(index, finalSymbol) {
    const reel = reels[index];
    clearInterval(reel.interval);
    reel.box?.classList.remove("rolling");

    if (reel.symbol && finalSymbol) {
      reel.symbol.textContent = GAME_SYMBOLS[finalSymbol] || "✖️";
    }
  }

  return {
    stop() {
      reels.forEach((_, index) => stopOne(index));
    },

    async finish(symbols) {
      for (let index = 0; index < 3; index++) {
        if (!reduceMotion.matches) {
          await new Promise(resolve =>
            setTimeout(resolve, index === 0 ? 500 : 350)
          );
        }

        stopOne(index, symbols[index]);
      }
    }
  };
}

async function playGame() {
  if (gameBusy) return;

  let requestId = getPendingGame();

  if (!requestId && !canStartGame()) return;

  if (!requestId) {
    try {
      requestId = makeRequestId();
    } catch {
      showToast("برای بازی، مینی‌اپ را داخل تلگرام باز کن.");
      return;
    }

    savePendingGame(requestId);
  }

  gameBusy = true;
  updateGameControls();

  const animation = startReelAnimation();

  try {
    const result = await post("/game/play", {
      request_id: requestId
    });

    if (result.ok && result.round) {
      acceptGameState(result);

      await animation.finish(result.round.symbols);

      clearPendingGame(requestId);
      setBalance(result.balance);

      const reward = Number(result.round.reward) || 0;

      showToast(
        result.replayed
          ? `نتیجهٔ ثبت‌شده بازی: ${fmt(reward)} میو`
          : reward > 0
            ? `🎉 ${fmt(reward)} میو به موجودیت اضافه شد!`
            : "این بار پوچ شد؛ دفعهٔ بعد دوباره امتحان کن 🍀"
      );

      return;
    }

    const definitiveErrors = [
      "cooldown",
      "withdrawal_pending",
      "game_disabled",
      "not_started",
      "invalid_request_id"
    ];

    if (definitiveErrors.includes(result.error)) {
      clearPendingGame(requestId);
    }

    if (typeof result.remaining_seconds === "number") {
      acceptGameState(result);
      if (typeof result.balance === "number") setBalance(result.balance);
    }

    showToast(errorText(result.error));
  } finally {
    animation.stop();
    gameBusy = false;

    if (currentView === "game") renderGame();
  }
}

function applyUserData(user) {
  if (
    !user ||
    user.ok === false ||
    !Number.isFinite(Number(user.balance))
  ) {
    return false;
  }

  hasUserData = true;
  state.not_started = Boolean(user.not_started);
  state.daily_enabled = Boolean(user.daily_enabled);

  setBalance(user.balance);

  state.notifications = Array.isArray(user.notifications)
    ? user.notifications.filter(item => item && typeof item === "object")
    : [];

  if (user.pending_withdrawal && !activeWithdrawal) {
    activeWithdrawal = {
      ...user.pending_withdrawal,
      phase: "pending",
      method: user.pending_withdrawal.withdraw_type === "card"
        ? "bank"
        : "id"
    };
  }

  renderNotifications();

  if ($("notifOverlay").classList.contains("show")) {
    setSeen(notificationKey(state.notifications[0]));
  }

  updateBellDot();
  return true;
}

async function refreshData(showError = true) {
  const requestVersion = ++userRequestVersion;

  refreshBtn.classList.add("spinning");
  refreshBtn.disabled = true;
  refreshBtn.setAttribute("aria-busy", "true");

  try {
    const user = await api("/user");

    if (requestVersion !== userRequestVersion) return;

    if (!applyUserData(user)) {
      if (showError) showToast(errorText(user.error));
      return;
    }

    if (currentView === "daily") viewDaily();
    if (currentView === "game" && !gameBusy) await viewGame();
  } finally {
    if (requestVersion === userRequestVersion) {
      refreshBtn.classList.remove("spinning");
      refreshBtn.disabled = false;
      refreshBtn.setAttribute("aria-busy", "false");
    }
  }
}

document.addEventListener("click", event => {
  if (!(event.target instanceof Element)) return;

  const button = event.target.closest(
    ".menu-btn,.primary-btn,.copy-btn"
  );

  if (!button || button.disabled || reduceMotion.matches) return;

  const rect = button.getBoundingClientRect();
  const size = Math.hypot(rect.width, rect.height) * 2;

  const x = event.detail ? event.clientX - rect.left : rect.width / 2;
  const y = event.detail ? event.clientY - rect.top : rect.height / 2;

  const ripple = document.createElement("span");
  ripple.className = "ripple";
  ripple.setAttribute("aria-hidden", "true");

  Object.assign(ripple.style, {
    width: `${size}px`,
    height: `${size}px`,
    left: `${x - size / 2}px`,
    top: `${y - size / 2}px`
  });

  button.appendChild(ripple);
  setTimeout(() => ripple.remove(), 650);
}, true);

$("btnInvite").onclick = viewInvite;
$("btnWithdraw").onclick = viewWithdrawForm;
$("btnBankWithdraw").onclick = viewBankWithdrawCardInput;
$("btnDaily").onclick = viewDaily;
$("btnGame").onclick = viewGame;

$("navHome").onclick = () => { tinyHaptic("light"); showHome(); };
$("navTheme").onclick = () => { tinyHaptic("light"); viewThemeSettings(); };
$("navGame").onclick = () => { tinyHaptic("light"); viewGame(); };
$("navProfile").onclick = () => { tinyHaptic("light"); viewProfile(); };

refreshBtn.onclick = () => refreshData(true);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && currentView === "game") {
    updateGameControls();
  }
});

async function init() {
  const requestVersion = ++userRequestVersion;
  const startedAt = performance.now();
  const userPromise = api("/user");

  let timeoutId;
  const timeoutPromise = new Promise(resolve => {
    timeoutId = setTimeout(() => resolve({ __timeout: true }), 4000);
  });

  let first;

  try {
    first = await Promise.race([userPromise, timeoutPromise]);
  } catch (error) {
    console.error("Initial load failed:", error);
    first = { ok:false, error:"network" };
  } finally {
    clearTimeout(timeoutId);
  }

  const elapsed = performance.now() - startedAt;
  if (elapsed < 650) {
    await new Promise(resolve => setTimeout(resolve, 650 - elapsed));
  }

  if (requestVersion !== userRequestVersion) return;

  $("skeletonSection").style.display = "none";
  showHome();

  if (first && !first.__timeout) {
    if (!applyUserData(first)) {
      $("balanceValue").textContent = "—";
      showToast(errorText(first?.error));
    }
    return;
  }

  userPromise
    .then(user => {
      if (requestVersion !== userRequestVersion) return;

      if (!applyUserData(user)) {
        $("balanceValue").textContent = "—";
        showToast(errorText(user?.error));
      }
    })
    .catch(error => {
      console.error("Late user load failed:", error);

      if (requestVersion !== userRequestVersion) return;

      $("balanceValue").textContent = "—";
      showToast("اطلاعات حساب دریافت نشد؛ بروزرسانی را بزن.");
    });
}

init();
