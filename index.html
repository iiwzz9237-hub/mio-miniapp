<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Mio Point</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --user-bg:#0d1016;
  --user-card:#202027;
  --user-accent:#4f8cff;
  --text:#f5f5f7;
  --dim:#b6c8e8;
  --card-text:#fff;
  --card-dim:#b6c8e8;
  --card-end:#0d1016;
  --border:rgba(255,255,255,.10);
  --wash:255,255,255;
  --nav-rgb:13,16,22;
  --action-bg:#4f8cff;
  --action-ink:#fff;
  --highlight:#4f8cff;
  --balance-ink:#4f8cff;
  --danger:#ff8585;
  --success:#93d8ba;
  --ease:cubic-bezier(.22,1,.36,1);
  --keyboard-offset:0px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;background:var(--user-bg);color-scheme:dark}
body{
  margin:0;min-height:100vh;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  background:var(--user-bg);color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 88% 0%,rgba(255,255,255,.065),transparent 46%),
    radial-gradient(ellipse at 0% 68%,rgba(91,135,220,.075),transparent 50%),
    var(--user-bg);
}
button,input{font-family:inherit}
button{color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--highlight);outline-offset:4px}
.app{position:relative;z-index:1;max-width:480px;margin:auto;padding:20px 20px 122px;animation:fade-in .65s var(--ease) backwards}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:600;line-height:1.9;color:var(--text);overflow-wrap:anywhere}
.icon-btn{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;padding:0;border:1px solid var(--border);border-radius:15px;background:rgba(var(--wash),.055);color:var(--text);transition:transform .2s var(--ease),background .2s}
.icon{display:block;flex-shrink:0;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.refresh-btn .icon{transform-box:view-box;transform-origin:50% 50%}
.refresh-btn.spinning .icon{animation:spin .85s linear infinite}
.bell-dot{position:absolute;top:8px;left:9px;display:none;width:7px;height:7px;border-radius:50%;background:var(--user-accent);box-shadow:0 0 0 3px var(--user-bg)}
.bell-dot.show{display:block;animation:pop-in .4s var(--ease) backwards}
.title-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:46px;margin:24px 0 28px}
.title{margin:0;text-align:center;font-size:clamp(24px,7vw,34px);font-weight:800;letter-spacing:-.8px}
.back-arrow{position:absolute;right:0;display:none}
.view-active .title-row{padding-inline:49px}
.view-active .title{font-size:clamp(19px,5.8vw,28px);line-height:1.6}

/* Balance */
.balance-card{
  position:relative;isolation:isolate;overflow:hidden;padding:32px 20px 36px;margin-bottom:22px;text-align:center;
  border:1px solid var(--border);border-radius:28px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.075),transparent 72%),linear-gradient(135deg,var(--user-card),var(--card-end));
  box-shadow:0 18px 44px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.08);
  animation:rise .7s .04s var(--ease) backwards;
}
.balance-card::before{content:"";position:absolute;inset:0 18% auto;height:1px;background:linear-gradient(90deg,transparent,var(--user-accent),transparent);pointer-events:none}
.balance-card::after{content:"";position:absolute;z-index:-1;left:-95px;bottom:-105px;width:170px;height:170px;border:1px solid rgba(122,195,255,.11);border-radius:50%;box-shadow:0 0 0 22px rgba(88,170,255,.045),0 0 0 44px rgba(88,170,255,.025)}
.balance-label{margin-bottom:18px;font-size:13px;color:var(--card-dim)}
.balance-value{display:inline-block;max-width:100%;direction:ltr;font-size:clamp(30px,9vw,46px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;letter-spacing:-1.5px;color:var(--balance-ink);overflow-wrap:anywhere}
.balance-unit{margin-inline-start:6px;font-size:17px;font-weight:700;color:var(--balance-ink)}

/* Pending withdrawals */
.withdraw-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.summary-card{min-width:0;padding:16px 10px;border:1px solid var(--border);border-radius:19px;background:rgba(var(--wash),.04);text-align:center}
.summary-card>span{display:block;font-size:11px;color:var(--dim)}
.summary-card>strong{display:block;margin:9px 0 4px;direction:ltr;font-size:clamp(18px,5vw,24px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.summary-card>small{display:block;color:var(--dim);font-size:10px;line-height:1.9}
.pending-list{display:grid;gap:10px;margin-bottom:18px;overflow-anchor:none}
.pending-list:empty{margin-bottom:8px}
.pending-item{display:block;width:100%;min-width:0;padding:16px;border:1px solid var(--border);border-radius:19px;background:rgba(var(--wash),.035);color:var(--text);text-align:right;animation:none;transform:none;transition:border-color .2s,background .2s}
.pending-item:active{background:rgba(var(--wash),.075)}
.pending-head,.pending-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pending-head strong,.pending-head b{font-size:13px}
.pending-head b{font-variant-numeric:tabular-nums;white-space:nowrap}
.pending-meta{margin-top:10px;color:var(--dim);font-size:11px}
.pending-clock{display:flex;align-items:center;min-height:3.8em;margin-top:7px;font-size:12px;line-height:1.9;color:var(--text);font-variant-numeric:tabular-nums}
.pending-hint{display:block;min-height:3.8em;font-size:10px;line-height:1.9;color:var(--dim)}
.home-receipt{margin:0 0 18px!important}

/* Home menu */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
.menu-btn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;min-width:0;min-height:132px;padding:22px 10px;border:1px solid var(--border);border-radius:22px;background:linear-gradient(145deg,rgba(var(--wash),.06),rgba(var(--wash),.022));color:var(--text);text-align:center;font-size:14px;font-weight:600;line-height:1.7;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;animation:rise .65s var(--delay,.1s) var(--ease) backwards}
.menu-btn:nth-child(1){--delay:.10s}
.menu-btn:nth-child(2){--delay:.16s}
.menu-btn:nth-child(3){--delay:.22s}
.menu-btn:nth-child(4){--delay:.28s}
.menu-btn:nth-child(5){--delay:.34s}
.menu-icon{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.10);color:#d6edff;transition:transform .3s var(--ease)}
#btnInvite .menu-icon{background:rgba(141,174,246,.16);color:#d8e7ff}
#btnBankWithdraw .menu-icon{background:rgba(136,213,181,.14);color:#a8ead0}
#btnDaily .menu-icon{background:rgba(192,156,238,.14);color:#dbc6f7}
.menu-btn.game-menu{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:16px;min-height:106px;padding:20px;text-align:right;border-color:rgba(222,167,129,.22);background:radial-gradient(ellipse at 0% 60%,rgba(192,90,110,.11),transparent 65%),linear-gradient(145deg,rgba(var(--wash),.06),rgba(var(--wash),.022))}
.game-menu .menu-icon{width:54px;height:54px;flex-shrink:0;border:1px solid rgba(232,175,142,.18);background:linear-gradient(145deg,rgba(207,113,97,.14),rgba(183,99,146,.09));color:#ecc6aa}
.game-menu .menu-icon .icon{width:29px;height:29px}
.menu-copy{flex:1;min-width:0}
.menu-copy strong{display:block;font-size:16px}
.menu-copy small{display:block;margin-top:5px;color:var(--dim);font-size:12px;font-weight:400}
.game-menu>.icon{color:var(--dim)}
body[data-bright="true"] .menu-icon,
body[data-bright="true"] #btnInvite .menu-icon,
body[data-bright="true"] #btnBankWithdraw .menu-icon,
body[data-bright="true"] #btnDaily .menu-icon{color:var(--text);background:rgba(0,0,0,.065)}

/* Common panels / fields */
.panel{min-height:140px;padding:25px 21px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,rgba(var(--wash),.06),rgba(var(--wash),.022))}
#homeSection>.panel{animation:rise .65s .4s var(--ease) backwards}
.panel h2{margin:0 0 12px;font-size:19px}
.panel p{margin:0 0 10px;color:var(--dim);font-size:14px;line-height:2}
.muted-center{text-align:center;padding:10px 0 4px}
.panel b{color:var(--text)}
.gold-text{color:var(--highlight)!important}
.link-box{display:flex;align-items:center;gap:8px;margin:14px 0 18px;padding:12px;border:1px solid var(--border);border-radius:17px;background:rgba(var(--wash),.035)}
.link-box>span{flex:1;min-width:0;overflow-x:auto;direction:ltr;text-align:left;white-space:nowrap;font-size:13px}
.field-label{display:block;margin-top:14px;color:var(--text);font-size:13px}
.id-input{width:100%;margin:10px 0 6px;padding:16px;border:1px solid var(--border);border-radius:17px;background:rgba(var(--wash),.035);color:var(--text);direction:ltr;text-align:left;font-size:16px;scroll-margin-block:30px;transition:border-color .2s,box-shadow .2s}
.id-input::placeholder{color:var(--dim);opacity:.8}
.id-input:focus{outline:none;border-color:var(--highlight);box-shadow:0 0 0 3px rgba(var(--wash),.06)}
.field-error{min-height:20px;margin-bottom:6px;color:var(--danger);font-size:12px;line-height:1.8}

/* Buttons */
.primary-btn,.ghost-btn,.copy-btn{position:relative;overflow:hidden;border:none;font-weight:700;transition:transform .2s var(--ease),opacity .2s,background .2s}
.primary-btn{width:100%;margin-top:10px;padding:16px;border-radius:17px;background:var(--action-bg);color:var(--action-ink);font-size:15px;font-weight:800}
.ghost-btn{width:100%;margin-top:10px;padding:14px;border:1px solid var(--border);border-radius:17px;background:rgba(var(--wash),.025);color:var(--text);font-size:14px}
.copy-btn{flex-shrink:0;padding:9px 14px;border-radius:11px;background:var(--action-bg);color:var(--action-ink);font-size:12px;white-space:nowrap}
.copy-btn.copied{background:#92d7ad;color:#143322}
.primary-btn.rgb-btn{isolation:isolate;display:flex;align-items:center;justify-content:center;min-height:64px;padding:10px 14px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(110deg,#ff356f,#a855f7 22%,#4f6cff 44%,#06b6d4 65%,#22c55e 82%,#ff356f);background-size:350% 350%;color:#fff;box-shadow:0 8px 25px rgba(109,80,230,.20);animation:rgb-flow 7s ease-in-out infinite}
.rgb-btn .btn-label{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:112px;padding:7px 20px;border:1px solid rgba(255,255,255,.20);border-radius:11px;background:#111625;color:#fff;font-size:15px;font-weight:800;line-height:1.6;pointer-events:none}
.btn-label .icon{width:18px;height:18px;stroke-width:2.2}
.menu-btn:active,.primary-btn:active,.ghost-btn:active,.copy-btn:active,.icon-btn:active{transform:scale(.965)}
.spinner{width:38px;height:38px;margin:8px auto 16px;border:2px solid rgba(var(--wash),.12);border-top-color:var(--highlight);border-radius:50%;animation:spin .9s linear infinite}
.result-icon{text-align:center;font-size:42px;margin:4px 0 18px;animation:pop-in .6s var(--ease) backwards}
.toggle-row{margin:16px 0 12px;padding:14px 16px;border:1px solid var(--border);border-radius:17px;background:rgba(var(--wash),.035)}
.status-text{color:var(--success);font-size:15px;font-weight:700}

/* Withdrawal tab */
.panel.withdraw-panel{padding:0;border:0;background:transparent}
.withdraw-hub{position:relative;isolation:isolate;padding:1px;color:#f5f7ff}
.withdraw-hero{position:relative;isolation:isolate;overflow:hidden;min-height:259px;padding:25px;border:1px solid rgba(157,178,255,.23);border-radius:29px;background:radial-gradient(ellipse at 100% 0%,rgba(93,128,255,.33),transparent 58%),radial-gradient(ellipse at 0% 100%,rgba(111,71,204,.24),transparent 57%),linear-gradient(125deg,#172848,#12182e 58%,#191c36);box-shadow:0 20px 45px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.09)}
.withdraw-hero::before{content:"";position:absolute;width:240px;height:240px;left:-105px;top:-67px;z-index:-1;border:1px solid rgba(169,190,255,.17);border-radius:50%;box-shadow:0 0 0 27px rgba(169,190,255,.035),0 0 0 55px rgba(169,190,255,.022)}
.withdraw-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.withdraw-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(164,185,255,.18);border-radius:999px;background:rgba(255,255,255,.045);font-size:10px;color:#dce6ff}
.withdraw-chip>span{width:5px;height:5px;border-radius:50%;background:#99dfd6}
.withdraw-emblem{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid rgba(175,194,255,.18);border-radius:14px;background:rgba(255,255,255,.055);color:#b4c8ff;transform:rotate(-8deg)}
.panel .withdraw-eyebrow{margin:0 0 8px;color:#bdc8e0;font-size:12px}
.withdraw-total{display:flex;align-items:baseline;gap:10px;margin-bottom:25px}
.withdraw-total strong{direction:ltr;font-size:clamp(28px,9vw,42px);font-weight:800;line-height:1.3;letter-spacing:-1px;color:#f7faff;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.withdraw-total>span{font-size:14px;color:#b8c9ee}
.withdraw-hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:17px;border-top:1px solid rgba(175,194,255,.13)}
.withdraw-hero-bottom small{display:block;margin-bottom:5px;color:#bdc8e0;font-size:10px}
.withdraw-hero-bottom strong{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#b1e5d8}
.withdraw-today-icon{display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:50%;background:rgba(128,225,189,.09);color:#a9dfcd}
.withdraw-today-icon .icon{width:17px;height:17px}
.withdraw-section-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 3px 13px;color:var(--text)}
.withdraw-section-label h2{margin:0;font-size:15px}
.withdraw-section-label>span{font-size:10px;color:var(--dim)}
.withdraw-methods{display:grid;gap:12px}
.withdraw-method{position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;width:100%;min-height:103px;padding:19px 16px;border:1px solid rgba(175,194,255,.17);border-radius:23px;text-align:right;color:#f5f7ff;background:linear-gradient(120deg,#17213a,#171a2b);box-shadow:0 8px 22px rgba(0,0,0,.11);transition:transform .2s var(--ease),border-color .2s}
.bank-method{background:radial-gradient(ellipse at 100% 50%,rgba(107,101,213,.18),transparent 70%),linear-gradient(120deg,#1e2240,#171b30)}
.id-method{background:radial-gradient(ellipse at 100% 50%,rgba(61,148,187,.14),transparent 70%),linear-gradient(120deg,#162b37,#171d2e)}
.withdraw-method-icon{display:flex;align-items:center;justify-content:center;flex:0 0 49px;width:49px;height:49px;border:1px solid rgba(188,181,255,.16);border-radius:16px;background:rgba(168,147,250,.10);color:#c7beff}
.id-method .withdraw-method-icon{background:rgba(107,210,230,.08);border-color:rgba(133,222,239,.14);color:#b1e8ef}
.withdraw-method-copy{flex:1;min-width:0}
.withdraw-method-copy strong{display:block;font-size:14px;font-weight:700}
.withdraw-method-copy small{display:block;margin-top:7px;font-size:10px;line-height:1.8;color:#c0cae0}
.withdraw-method-arrow{display:flex;align-items:center;justify-content:center;flex:0 0 27px;width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,.045);color:#cad6f0}
.withdraw-method-arrow .icon{width:16px;height:16px}
.withdraw-method:active{transform:scale(.979)}
.withdraw-home-link{display:flex;align-items:center;gap:9px;width:100%;margin-top:18px;padding:14px 13px;border:1px solid var(--border);border-radius:16px;background:rgba(var(--wash),.035);color:var(--text);text-align:right;font-size:11px;line-height:1.8}
.withdraw-home-link>span:nth-child(2){flex:1}
.withdraw-home-link>.icon{width:16px;height:16px;color:var(--dim)}
.withdraw-pending-dot{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--highlight)}
.panel .withdraw-footnote{margin:14px 5px 0;text-align:center;color:var(--dim);font-size:10px}

/* Casino */
.panel.game-panel{padding:0;border:0;background:transparent}
.casino{
  --casino-cream:#fff1d2;
  --casino-gold:#efd196;
  position:relative;isolation:isolate;overflow:hidden;padding:23px 16px 20px;
  border:1px solid rgba(229,193,136,.18);border-radius:30px;
  color:#f8f1e8;background:
    radial-gradient(ellipse at 50% 25%,rgba(120,35,57,.30),transparent 60%),
    radial-gradient(ellipse at 10% 0%,rgba(211,161,88,.11),transparent 45%),
    linear-gradient(165deg,#201a22,#11151f 70%);
  box-shadow:0 22px 48px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.045);
}
.casino::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.3;background-image:radial-gradient(rgba(222,189,145,.25) .6px,transparent .6px);background-size:16px 16px;mask-image:linear-gradient(#000,transparent 65%)}
.casino-intro{text-align:center}
.casino-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid rgba(226,190,134,.19);border-radius:999px;background:rgba(238,195,135,.06);color:#efd5aa;font-size:10px}
.casino-badge .icon{width:14px;height:14px}
.casino-intro h2{margin:14px 0 7px;font-size:25px;color:#fff0d3;letter-spacing:-.5px}
.panel .casino-intro p{margin:0;color:#c3b4b8;font-size:12px;line-height:1.9}
.machine-stage{position:relative;margin:25px 0 20px;padding-right:34px;direction:ltr}
.machine-stage::after{content:"";position:absolute;z-index:-1;bottom:-12px;left:8%;right:8%;height:27px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(9px)}
.slot-machine{
  position:relative;padding:7px;border:1px solid #deb975;border-radius:32px 32px 23px 23px;
  background:linear-gradient(135deg,#fae4ad 0%,#946537 16%,#efc98a 37%,#71502f 67%,#f1d69f 100%);
  box-shadow:0 10px 0 #51301f,0 13px 0 #291b17,0 18px 25px rgba(0,0,0,.4),inset 0 1px 0 #fff3d1;
}
.machine-cabinet{overflow:hidden;border:1px solid #591e29;border-radius:25px 25px 17px 17px;background:linear-gradient(130deg,#ba314a,#81213b 50%,#561829);box-shadow:inset 0 2px 0 rgba(255,255,255,.16)}
.machine-marquee{position:relative;overflow:hidden;padding:15px 8px 14px;text-align:center;background:radial-gradient(ellipse at 50% 100%,rgba(255,173,90,.10),transparent 75%),linear-gradient(#451523,#290f1d);border-bottom:1px solid rgba(255,221,149,.3)}
.machine-marquee::before,.machine-marquee::after{content:"";position:absolute;left:12px;right:12px;height:5px;background:radial-gradient(circle,#fce3a4 2px,transparent 2.8px) 0 0/17px 5px repeat-x;opacity:.75}
.machine-marquee::before{top:5px}
.machine-marquee::after{bottom:5px}
.machine-marquee strong{display:block;color:#ffe8b9;font-family:Georgia,serif;font-size:clamp(23px,7vw,32px);font-weight:700;letter-spacing:3px;text-shadow:0 2px 0 #8d462b,0 0 18px rgba(255,192,105,.23)}
.machine-marquee small{display:block;margin-top:2px;color:#d6b4a1;font-size:7px;letter-spacing:4px}
.reel-trigger{display:block;width:100%;padding:17px 10px 12px;border:0;background:transparent;opacity:1!important}
.reel-trigger:focus-visible{outline-color:#fff0c9;outline-offset:-5px;border-radius:12px}
.reel-trim{display:block;padding:6px;border:1px solid #2f1219;border-radius:15px;background:linear-gradient(120deg,#e2c18f,#7a5030 33%,#f2d4a0 66%,#976a40);box-shadow:0 3px 0 rgba(41,11,19,.6),inset 0 1px 0 #fff0c0}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;direction:ltr}
.reel-window{position:relative;display:block;height:clamp(78px,23vw,104px);overflow:hidden;border:1px solid #806b55;border-radius:9px;background:#fff7e6;isolation:isolate}
.reel-window::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(50,35,23,.31),transparent 26%,transparent 73%,rgba(50,35,23,.31));box-shadow:inset 0 0 8px rgba(34,25,20,.20)}
.reel-track{position:relative;display:block;transform:translateY(0);will-change:transform}
.reel-cell{display:flex;align-items:center;justify-content:center;height:calc(clamp(78px,23vw,104px) - 2px);overflow:hidden}
.slot-symbol{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:100%;height:100%;line-height:1;user-select:none}
.symbol-seven{font-family:Arial,Helvetica,sans-serif;font-size:clamp(48px,14vw,68px);font-weight:900;font-style:italic;color:#d52640;text-shadow:0 2px 0 #89132a,0 4px 0 #f3c0a8;transform:rotate(-5deg)}
.symbol-blank{font-family:Arial,Helvetica,sans-serif;font-size:clamp(44px,13vw,64px);font-weight:900;color:#d52a3e;text-shadow:0 2px 0 #8a1926}
.symbol-fruit{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:clamp(34px,10vw,51px);filter:drop-shadow(0 3px 1px rgba(59,39,21,.15))}
.machine-payline{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;font-size:9px;color:#ffe2b7}
.machine-payline::before,.machine-payline::after{content:"";height:1px;flex:1;max-width:28px;background:linear-gradient(90deg,transparent,#ddb779,transparent)}
.machine-bottom{display:flex;align-items:center;justify-content:space-between;padding:0 15px 13px;gap:8px}
.machine-bottom small{font-size:7px;letter-spacing:2px;color:#dfb6a0}
.coin-slot{display:block;width:48px;height:10px;border:2px solid #d1b68f;border-radius:5px;background:#291820;box-shadow:0 1px 0 #f4d6a2}
.machine-base{height:10px;margin:6px 13px -3px;border-radius:4px;background:linear-gradient(#43202a,#25151e);border:1px solid rgba(247,218,161,.2)}
.slot-lever{position:absolute;right:-2px;top:66px;z-index:3;width:38px;height:156px;border:0;padding:0;background:transparent;opacity:1!important;overflow:visible}
.lever-socket{position:absolute;bottom:15px;left:2px;width:24px;height:32px;border:1px solid #382829;border-radius:5px 13px 13px 5px;background:linear-gradient(90deg,#5d4946,#d5c9b5 45%,#67514b);box-shadow:0 3px 4px rgba(0,0,0,.3)}
.lever-arm{position:absolute;left:15px;bottom:29px;width:9px;height:99px;border:1px solid #5a5553;border-radius:7px;background:linear-gradient(90deg,#645c57,#f4ead7 42%,#a29a8d 65%,#504a48);transform-origin:50% 96%;transform:rotate(8deg);will-change:transform}
.lever-knob{position:absolute;top:-14px;left:50%;width:29px;height:29px;border-radius:50%;transform:translateX(-50%);border:1px solid #631523;background:radial-gradient(circle at 32% 25%,#ffb1a3 0%,#f85b59 18%,#d42842 47%,#7e142d 82%);box-shadow:inset -3px -4px 6px rgba(39,7,18,.28),0 4px 5px rgba(0,0,0,.35)}
.slot-lever:focus-visible{outline-color:#f2cf93;border-radius:18px}
.is-spinning .machine-marquee::before,.is-spinning .machine-marquee::after{opacity:1;filter:drop-shadow(0 0 3px #edc985)}
.reel-window.rolling .slot-symbol{filter:blur(.45px)}
.slot-machine.is-winner{box-shadow:0 10px 0 #51301f,0 13px 0 #291b17,0 0 30px rgba(244,198,103,.25)}
.casino-spin-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:58px;margin-top:13px;padding:15px;border:1px solid #f4d496;border-radius:17px;background:linear-gradient(115deg,#f8dfac,#e6b96d);color:#322018;font-size:14px;font-weight:800;box-shadow:0 4px 0 #8d663e,0 9px 20px rgba(0,0,0,.2),inset 0 1px 0 #fff2ce;transition:transform .2s,opacity .2s,box-shadow .2s}
.casino-spin-btn .icon{width:21px;height:21px}
.casino-spin-btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #8d663e,0 4px 12px rgba(0,0,0,.2)}
.casino-spin-btn:focus-visible{outline-color:#f5d49b}
.game-status{min-height:65px;margin:15px 0 3px;text-align:center;color:#c6b9bc;font-size:11px;line-height:1.9}
.game-status b{display:block;margin-top:5px;direction:ltr;color:#f4dab0;font-size:22px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.game-result{padding:17px;margin:10px 0 18px;border:1px solid rgba(232,195,130,.26);border-radius:19px;background:linear-gradient(135deg,rgba(226,175,98,.095),rgba(226,175,98,.025));text-align:center}
.game-result small{display:block;color:#cebdac;font-size:10px}
.game-result strong{display:block;margin:8px 0;color:#f8d69c;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}
.panel .game-result p{margin:0;color:#d8cec5;font-size:11px;line-height:1.9}
.prize-table{width:100%;border-collapse:collapse;text-align:center;font-size:11px}
.prize-table caption{padding:10px 0;text-align:right;color:#e8d8c5;font-size:12px;font-weight:700}
.prize-table th,.prize-table td{padding:10px 3px;border-bottom:1px solid rgba(226,201,169,.10)}
.prize-table th{color:#bdb1b5;font-size:10px;font-weight:500}
.prize-table td{color:#e6ddd3;font-variant-numeric:tabular-nums}
.prize-table .slot-symbol{width:28px;height:29px;font-size:24px;transform:none;text-shadow:none;filter:none}
.panel .game-note{margin:13px 0 6px;color:#bcaeb3;font-size:10px;line-height:1.9}
.casino .game-refresh{background:rgba(255,255,255,.035);color:#dfd0c3;border-color:rgba(225,200,162,.16);font-size:12px}
.casino .game-refresh:focus-visible{outline-color:#f5d49b}

/* Loading */
.skel{border-radius:28px;background:linear-gradient(100deg,rgba(var(--wash),.055) 30%,rgba(var(--wash),.13) 50%,rgba(var(--wash),.055) 70%);background-size:220% 100%;animation:shimmer 1.8s ease-in-out infinite}
.skel-card{height:176px;margin-bottom:22px}
.skel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.skel-btn{height:132px;border-radius:22px}
.skel-game{height:106px;grid-column:1/-1;border-radius:22px}
.skel-panel{height:140px}

/* Notifications */
.sheet-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 76px) 16px 20px;background:rgba(2,10,25,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
.sheet-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
.sheet{--text:#f5f5f7;--dim:#b6c8e8;--wash:255,255,255;--border:rgba(255,255,255,.13);--danger:#ff8585;--success:#93d8ba;color:var(--text);width:min(420px,100%);max-height:70vh;max-height:70dvh;overflow-y:auto;overscroll-behavior:contain;padding:18px;border:1px solid var(--border);border-radius:26px;background:linear-gradient(145deg,#0d4da8,#082c69);box-shadow:0 30px 90px rgba(0,0,0,.4);transform:translateY(-14px) scale(.975);transition:transform .35s var(--ease)}
.sheet-overlay.show .sheet{transform:translateY(0) scale(1)}
.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet h3{margin:0;font-size:16px}
.close-btn{width:34px;height:34px;flex-basis:34px;border-radius:11px}
.notif-item{margin-bottom:8px;padding:12px 14px;border:1px solid rgba(255,255,255,.07);border-radius:15px;background:rgba(255,255,255,.06);font-size:14px;line-height:1.9;overflow-wrap:anywhere}
.notif-item.success{border-inline-start:3px solid var(--success)}
.notif-item.fail{border-inline-start:3px solid var(--danger)}
.notif-item .t{margin-top:5px;direction:ltr;text-align:right;color:var(--dim);font-size:11px}
.notif-empty{padding:24px 0;text-align:center;color:var(--dim);font-size:14px}

/* Bottom navigation */
.bottom-nav{position:fixed;z-index:45;right:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(448px,calc(100vw - 22px));transform:translateX(50%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:8px 6px;border:1px solid var(--border);border-radius:22px;background:rgba(var(--nav-rgb),.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(0,0,0,.2);transition:opacity .15s,transform .18s var(--ease),visibility .15s}
.bottom-nav button{min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 1px;border:0;border-radius:15px;background:transparent;color:var(--dim);font-size:9px;font-weight:700;white-space:nowrap}
.bottom-nav button.active{background:rgba(var(--wash),.075);color:var(--text)}
.bottom-nav button.active>.nav-svg{color:var(--highlight)}
.nav-svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-withdraw-icon{display:flex;align-items:center;justify-content:center;width:35px;height:31px;border:1px solid rgba(180,196,255,.20);border-radius:11px;background:linear-gradient(135deg,#334e8d,#47376e);color:#fff;box-shadow:0 4px 12px rgba(41,60,120,.17)}
.bottom-nav .nav-withdraw{gap:3px}
.bottom-nav .nav-withdraw.active .nav-withdraw-icon{background:linear-gradient(135deg,#446ed0,#7651aa)}
body.keyboard-open .bottom-nav{opacity:0;visibility:hidden;pointer-events:none;transform:translate(50%,130%);transition:none}

/* Settings / profile */
.settings-wrap{display:grid;gap:12px}
.settings-card{padding:16px;border:1px solid var(--border);border-radius:19px;background:rgba(var(--wash),.03)}
.settings-card h3{margin:0 0 7px;font-size:14px}
.settings-card p{margin:0;color:var(--dim);font-size:12px;line-height:1.9}
.color-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.color-field{padding:10px 7px;border:1px solid var(--border);border-radius:14px;background:rgba(var(--wash),.025);text-align:center;color:var(--text);font-size:10px}
.color-field input{display:block;width:100%;height:40px;margin-top:7px;padding:0;border:0;border-radius:9px;background:transparent;cursor:pointer}
.layout-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.layout-choice{padding:11px 5px;border:1px solid var(--border);border-radius:13px;background:rgba(var(--wash),.025);color:var(--text);font-size:11px;font-weight:700}
.layout-choice.active{border-color:var(--highlight);background:rgba(var(--wash),.065)}
.theme-preview{padding:17px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(145deg,var(--user-card),var(--card-end));color:var(--card-text)}
.theme-preview strong{display:block;margin-bottom:5px}
.theme-preview small{display:block;color:var(--card-dim);line-height:1.8}
.preview-accent{display:inline-block;margin-top:11px;padding:8px 13px;border-radius:10px;background:var(--action-bg);color:var(--action-ink);font-size:11px;font-weight:800}
.profile-box{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:15px;border:1px solid var(--border);border-radius:19px;background:rgba(var(--wash),.03)}
.profile-avatar{display:flex;align-items:center;justify-content:center;width:58px;height:58px;flex:0 0 58px;overflow:hidden;border:1px solid var(--border);border-radius:50%;background:rgba(var(--wash),.06);font-size:22px;font-weight:800}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-box strong{display:block;font-size:15px}
.profile-box small{display:block;margin-top:4px;color:var(--dim);direction:ltr;text-align:right;font-size:11px}
.profile-list{display:grid;gap:8px}
.profile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:15px;background:rgba(var(--wash),.025);font-size:12px}
.profile-row span{color:var(--dim)}
.profile-row b{direction:ltr;text-align:left}
body.layout-compact .app{padding-inline:13px}
body.layout-compact .grid{gap:8px}
body.layout-compact .menu-btn{min-height:108px;padding:16px 8px}
body.layout-compact .balance-card{padding:25px 16px 28px}
body.layout-list .grid{grid-template-columns:1fr}
body.layout-list .menu-btn{min-height:84px;flex-direction:row;justify-content:flex-start;padding:14px 16px;text-align:right}
body.layout-list .menu-btn.game-menu{grid-column:auto}
body.layout-list .menu-icon,body.layout-list .game-menu .menu-icon{width:46px;height:46px;flex:0 0 46px}

/* Toast / animations */
.toast{position:fixed;z-index:100;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);left:50%;width:max-content;max-width:calc(100vw - 40px);padding:12px 18px;border:1px solid rgba(255,255,255,.14);border-radius:15px;background:#0a3a83;color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.3);text-align:center;font-size:13px;line-height:1.9;opacity:0;visibility:hidden;transform:translate(-50%,14px);pointer-events:none;transition:opacity .25s,transform .3s var(--ease),visibility .25s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
body.keyboard-open .toast{bottom:calc(var(--keyboard-offset) + 12px)}
.ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:ripple-out .6s var(--ease) forwards}
.anim-in-right{animation:forward-in .4s var(--ease) backwards}
.anim-in-left{animation:back-in .4s var(--ease) backwards}
.anim-pop{animation:rise .35s var(--ease) backwards}
@media(hover:hover) and (pointer:fine){
  .menu-btn:hover{transform:translateY(-4px);border-color:var(--highlight);box-shadow:0 12px 28px rgba(0,0,0,.12)}
  .menu-btn:hover .menu-icon{transform:translateY(-2px) rotate(-5deg)}
  .primary-btn:not(:disabled):hover{transform:translateY(-2px)}
  .icon-btn:hover,.ghost-btn:hover{background:rgba(var(--wash),.10)}
  .withdraw-method:hover{transform:translateY(-3px);border-color:rgba(175,194,255,.4)}
  .casino-spin-btn:not(:disabled):hover{filter:brightness(1.06)}
}
@media(max-width:360px){
  .app{padding-inline:14px}
  .brand{font-size:11px}
  .menu-btn{font-size:13px;padding-inline:7px}
  .panel{padding-inline:16px}
  .menu-btn.game-menu{padding:16px;gap:12px}
  .bottom-nav{width:calc(100vw - 14px);gap:1px;padding-inline:4px}
  .bottom-nav button{font-size:8.5px}
  .withdraw-hero{padding:21px}
  .withdraw-method{padding:17px 12px;gap:10px}
  .withdraw-method-copy strong{font-size:12px}
  .withdraw-method-copy small{font-size:9px}
  .pending-item{padding:13px}
  .pending-head strong,.pending-head b{font-size:12px}
  .casino{padding:20px 11px 17px}
  .machine-stage{padding-right:30px}
  .reel-trigger{padding-inline:7px}
  .machine-marquee strong{letter-spacing:2px}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes rgb-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes forward-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@keyframes back-in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes pop-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes ripple-out{from{opacity:.16;transform:scale(0)}to{opacity:0;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<div class="app" id="app">

      <div class="skel skel-btn"></div><div class="skel skel-btn"></div>
      <div class="skel skel-btn"></div><div class="skel skel-btn"></div>
      <div class="skel skel-game"></div>
    </div>
    <div class="skel skel-panel"></div>
  </div>

  <div id="homeSection" style="display:none">
    <div class="balance-card">
      <div class="balance-label">💎 موجودی شما</div>
      <div><span class="balance-value" id="balanceValue">…</span><span class="balance-unit">میو</span></div>
    </div>

    <div class="withdraw-summary">
      <div class="summary-card"><span>✅ برداشت‌شده امروز</span><strong id="withdrawnTodayValue">—</strong><small>میو</small></div>
      <div class="summary-card"><span>⏳ در انتظار برداشت</span><strong id="pendingTotalValue">—</strong><small>میو · <span id="pendingCountText">0 درخواست در صف</span></small></div>

async function api(path,options={}){

function humanDuration(seconds){
  seconds=Math.max(0,Math.ceil(seconds));
  const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;
  const parts=[];
  if(h)parts.push(`${h} ساعت`);

/* ================= Keyboard / viewport ================= */

function keyboardDecision({editing,session,baseline,height,scale=1}){
  const drop=Math.max(0,baseline-height);
  return editing||(session&&scale<=1.05&&drop>Math.max(110,baseline*.18));
}
function setupKeyboard(){
  const vv=window.visualViewport;
  let baseline=Math.max(window.innerHeight,vv?.height||0);
  let lastWidth=window.innerWidth,session=false,open=false,frame=0;

  function editor(){
    const el=document.activeElement;
    if(!el||el.disabled||el.readOnly)return null;
    if(el.isContentEditable)return el;
    if(el.tagName==="TEXTAREA")return el;
    if(el.tagName!=="INPUT")return null;
    return ["text","tel","number","email","search","password","url"].includes(el.type)?el:null;
  }

  function update(){
    frame=0;
    const field=editor();
    const height=vv?.height||tg?.viewportHeight||window.innerHeight;
    const width=window.innerWidth;
    if(Math.abs(width-lastWidth)>80){
      baseline=Math.max(window.innerHeight,height);
      lastWidth=width;
    }
    if(field)session=true;
    if(!session&&!field)baseline=Math.max(window.innerHeight,height);

    open=keyboardDecision({
      editing:Boolean(field),session,baseline,height,scale:vv?.scale||1
    });
    if(!open){
      session=false;
      baseline=Math.max(window.innerHeight,height);
    }

    document.body.classList.toggle("keyboard-open",open);
    const modal=$("notifOverlay").classList.contains("show");
    $("bottomNav").inert=open||modal;
    $("bottomNav").setAttribute("aria-hidden",String(open||modal));

    const offset=vv?Math.max(0,window.innerHeight-(vv.height+vv.offsetTop)):0;
    document.documentElement.style.setProperty("--keyboard-offset",`${offset}px`);

    if(field&&open&&vv&&(vv.scale||1)<=1.05){
      const rect=field.getBoundingClientRect();
      const top=vv.offsetTop+18;
      const bottom=vv.offsetTop+vv.height-24;
      if(rect.bottom>bottom)window.scrollBy({top:rect.bottom-bottom,behavior:"auto"});
      else if(rect.top<top)window.scrollBy({top:rect.top-top,behavior:"auto"});
    }
  }
  function schedule(){
    if(!frame)frame=requestAnimationFrame(update);
  }
  document.addEventListener("focusin",()=>{
    if(editor()){
      session=true;
      document.body.classList.add("keyboard-open");
      $("bottomNav").inert=true;
      $("bottomNav").setAttribute("aria-hidden","true");
    }
    schedule();setTimeout(schedule,160);setTimeout(schedule,350);
  });
  document.addEventListener("focusout",()=>setTimeout(schedule,220));
  window.addEventListener("resize",schedule,{passive:true});
  vv?.addEventListener("resize",schedule,{passive:true});
  vv?.addEventListener("scroll",schedule,{passive:true});
  try{tg?.onEvent("viewportChanged",schedule);}catch{}
  schedule();
  return{update:schedule};
}
const keyboard=setupKeyboard();

/* ================= Theme ================= */

const THEME_KEY=`mio_theme_${TG_USER_ID}`;
const DEFAULT_THEME={bg:"#0d1016",card:"#202027",accent:"#4f8cff",layout:"normal"};
function validHex(value,fallback){
  return /^#[0-9a-f]{6}$/i.test(String(value||""))?value.toLowerCase():fallback;
}
function readTheme(){
  try{
    const data=JSON.parse(localStorage.getItem(THEME_KEY)||"{}");
    return data&&typeof data==="object"&&!Array.isArray(data)?data:{};
  }catch{return{};}
}
function writeTheme(data){try{localStorage.setItem(THEME_KEY,JSON.stringify(data));}catch{}}
const rgb=hex=>[1,3,5].map(start=>parseInt(hex.slice(start,start+2),16));
function mixHex(base,ink,fraction){
  const a=rgb(base),b=rgb(ink);
  return"#"+a.map((v,i)=>Math.round(v+(b[i]-v)*fraction).toString(16).padStart(2,"0")).join("");
}
function luminance(hex){
  const c=rgb(hex).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;});
  return c[0]*.2126+c[1]*.7152+c[2]*.0722;
}
function contrast(a,b){
  const x=luminance(a),y=luminance(b);
  return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);
}
const inkFor=bg=>contrast(bg,"#000000")>contrast(bg,"#ffffff")?"#000000":"#ffffff";
function themePalette(raw={}){
  const bg=validHex(raw.bg,DEFAULT_THEME.bg),card=validHex(raw.card,DEFAULT_THEME.card),accent=validHex(raw.accent,DEFAULT_THEME.accent);
  const layout=["normal","compact","list"].includes(raw.layout)?raw.layout:"normal";
  const defaults=bg===DEFAULT_THEME.bg&&card===DEFAULT_THEME.card&&accent===DEFAULT_THEME.accent;
  const bright=inkFor(bg)==="#000000",text=defaults?"#f5f5f7":inkFor(bg),cardText=inkFor(card);
  const action=bright?"#141821":accent;
  return{
    bg,card,accent,layout,bright,text,cardText,action,
    dim:defaults?"#b6c8e8":mixHex(bg,text,.78),
    cardDim:defaults?"#b6c8e8":mixHex(card,cardText,.78),
    actionInk:defaults?"#ffffff":inkFor(action),
    highlight:contrast(bg,accent)>=4.5?accent:text,
    balanceInk:defaults?accent:contrast(card,accent)>=4.5?accent:cardText,
    cardEnd:defaults?bg:mixHex(card,bg,.12),
    wash:bright?"0,0,0":"255,255,255",
    nav:rgb(bg).join(",")
  };
}
function applyTheme(raw=readTheme()){
  const p=themePalette(raw),root=document.documentElement;
  const values={
    "--user-bg":p.bg,"--user-card":p.card,"--user-accent":p.accent,
    "--text":p.text,"--dim":p.dim,"--card-text":p.cardText,"--card-dim":p.cardDim,
    "--action-bg":p.action,"--action-ink":p.actionInk,"--highlight":p.highlight,
    "--balance-ink":p.balanceInk,"--card-end":p.cardEnd,"--wash":p.wash,"--nav-rgb":p.nav,
    "--border":`rgba(${p.wash},${p.bright?".18":".10"})`,
    "--danger":p.bright?"#a20d2c":"#ff8585","--success":p.bright?"#09633c":"#93d8ba"
  };
  Object.entries(values).forEach(([key,value])=>root.style.setProperty(key,value));
  root.style.colorScheme=p.bright?"light":"dark";
  document.body.dataset.bright=String(p.bright);
  document.body.classList.remove("theme-light");
  document.body.classList.toggle("layout-compact",p.layout==="compact");
  document.body.classList.toggle("layout-list",p.layout==="list");
  document.querySelector('meta[name="theme-color"]').setAttribute("content",p.bg);
}
function viewThemeSettings(){
  const p=themePalette(readTheme());
  showView("theme","🎨 تنظیمات رنگ");
  paint(`
    <div class="settings-wrap">
      <div class="settings-card"><h3>رنگ دلخواه</h3><p>رنگ‌ها را انتخاب کن؛ نوشته و آیکون دکمه‌ها خودکار خوانا می‌مانند.</p>
        <div class="color-controls">
          <label class="color-field">پس‌زمینه<input id="bgPicker" type="color" value="${p.bg}"></label>
          <label class="color-field">کارت‌ها<input id="cardPicker" type="color" value="${p.card}"></label>
          <label class="color-field">رنگ اصلی<input id="accentPicker" type="color" value="${p.accent}"></label>
        </div>
      </div>
      <div class="settings-card"><h3>چیدمان صفحه اصلی</h3><p>نمای کارت‌ها را هرطور راحت‌تری انتخاب کن.</p>
        <div class="layout-choices">${[["normal","عادی"],["compact","فشرده"],["list","لیستی"]].map(([value,label])=>`<button type="button" class="layout-choice ${p.layout===value?"active":""}" data-layout="${value}" aria-pressed="${p.layout===value}">${label}</button>`).join("")}</div>
      </div>
      <div class="theme-preview"><strong>پیش‌نمایش</strong><small>تغییرات همان لحظه اعمال و روی همین دستگاه ذخیره می‌شوند.</small><span class="preview-accent">Mio Point</span></div>
      <button type="button" class="ghost-btn" id="resetThemeBtn">بازنشانی ظاهر</button>
    </div>`);
  [["bgPicker","bg"],["cardPicker","card"],["accentPicker","accent"]].forEach(([id,key])=>{
    $(id).oninput=e=>{const next={...readTheme(),[key]:e.target.value};delete next.mode;writeTheme(next);applyTheme(next);};
  });
  panel.querySelectorAll("[data-layout]").forEach(button=>{
    button.onclick=()=>{
      const next={...readTheme(),layout:button.dataset.layout};delete next.mode;
      writeTheme(next);applyTheme(next);tinyHaptic();
      panel.querySelectorAll("[data-layout]").forEach(item=>{
        const selected=item.dataset.layout===next.layout;
        item.classList.toggle("active",selected);item.setAttribute("aria-pressed",String(selected));
      });
    };
  });
  $("resetThemeBtn").onclick=()=>{writeTheme({});applyTheme({});viewThemeSettings();showToast("ظاهر به حالت اولیه برگشت.");};
}

let balanceFrame=0,displayedBalance=0;
function setBalance(value){
  if(value==null||!Number.isFinite(Number(value)))return;
  const target=Number(value);state.balance=target;cancelAnimationFrame(balanceFrame);
  syncWithdrawHub();setText($("profileBalance"),`${fmt(target)} Mio`);
  if(reduceMotion.matches||displayedBalance===target){displayedBalance=target;setText($("balanceValue"),fmt(target));return;}
  const from=displayedBalance,start=performance.now();
  function tick(now){
    const p=reduceMotion.matches?1:Math.min((now-start)/850,1);
    displayedBalance=from+(target-from)*(1-Math.pow(1-p,4));
    setText($("balanceValue"),fmt(p===1?target:Math.round(displayedBalance)));
    if(p<1)balanceFrame=requestAnimationFrame(tick);
  }
  balanceFrame=requestAnimationFrame(tick);
}

/* ================= Stable pending cards ================= */

const pendingNodes=new Map();
function normalizeWithdrawal(value,previous){
  const next={...previous,...value};
  next.method=next.withdraw_type?(next.withdraw_type==="card"?"bank":"id"):(next.method==="bank"?"bank":"id");
  if(value.wait_seconds!=null&&Number.isFinite(Number(value.wait_seconds))){
    const estimate=performance.now()+Math.max(0,Number(value.wait_seconds))*1000,old=previous?.etaDeadline;
    next.etaDeadline=Number.isFinite(old)&&Math.abs(estimate-old)<1500?old:estimate;
  }else if(!Number.isFinite(next.etaDeadline))next.etaDeadline=null;
  return next;
}
function pendingSeconds(item){
  return Number.isFinite(item?.etaDeadline)?Math.max(0,Math.ceil((item.etaDeadline-performance.now())/1000)):null;
}
function pendingClockText(item){
  if(item.processing)return"در حال پردازش واریز";
  const seconds=pendingSeconds(item);
  if(seconds===null)return item.wait_text||"در انتظار بروزرسانی زمان";
  return seconds>0?`حدود ${humanDuration(seconds)} تا نوبت پردازش`:"نوبت پردازش نزدیک است؛ در انتظار بروزرسانی";
}
function createPendingCard(key){
  const button=document.createElement("button");button.type="button";button.className="pending-item";
  button.innerHTML=`<span class="pending-head"><strong data-part="method"></strong><b data-part="amount"></b></span><span class="pending-meta"><span data-part="status"></span><span data-part="position"></span></span><span class="pending-clock" data-part="clock"></span><small class="pending-hint">برای دیدن جزئیات بزن؛ نیازی به ماندن در صفحهٔ صف نیست.</small>`;
  const parts=Object.fromEntries([...button.querySelectorAll("[data-part]")].map(el=>[el.dataset.part,el]));
  button.onclick=()=>{
    const item=state.pending_withdrawals.find(x=>String(x.withdraw_id)===key);
    if(!item)return;
    if(!activeWithdrawal||String(activeWithdrawal.withdraw_id)!==key)activeWithdrawal={...item,phase:"pending"};
    lastWithdrawMethod=activeWithdrawal.method;viewActiveWithdrawal();
  };
  return{button,parts};
}
function renderWithdrawDashboard(){
  setText($("withdrawnTodayValue"),hasUserData?fmt(state.withdrawn_today):"—");
  const total=state.pending_withdrawals.reduce((sum,x)=>sum+(Number(x.amount)||0),0);
  setText($("pendingTotalValue"),hasUserData?fmt(total):"—");
  setText($("pendingCountText"),`${state.pending_withdrawals.length} درخواست در صف`);
  const list=$("pendingList"),keys=new Set(state.pending_withdrawals.map(x=>String(x.withdraw_id)));
  for(const[key,node]of pendingNodes)if(!keys.has(key)){node.button.remove();pendingNodes.delete(key);}
  state.pending_withdrawals.forEach((item,index)=>{
    const key=String(item.withdraw_id);
    let node=pendingNodes.get(key);
    if(!node){node=createPendingCard(key);pendingNodes.set(key,node);}
    if(list.children[index]!==node.button)list.insertBefore(node.button,list.children[index]||null);
    setText(node.parts.method,item.method==="bank"?"🏦 بانک میویی":"📤 برداشت با آیدی");
    setText(node.parts.amount,`${fmt(item.amount)} میو`);
    setText(node.parts.status,item.processing?"در حال برداشت":"در صف برداشت");
    setText(node.parts.position,Number(item.position)>0?`نفر ${item.position} در صف`:"در حال بررسی");
    setText(node.parts.clock,pendingClockText(item));
  });
  $("homeReceiptBtn").hidden=!state.notifications.some(n=>n.type==="success");syncWithdrawHub();
}
function updatePendingClocks(){
  state.pending_withdrawals.forEach(item=>{
    const node=pendingNodes.get(String(item.withdraw_id));
    if(node)setText(node.parts.clock,pendingClockText(item));
  });
}
function upsertPendingWithdrawal(value){
  if(!value.withdraw_id||finishedWithdrawals.has(String(value.withdraw_id)))return;
  const i=state.pending_withdrawals.findIndex(x=>String(x.withdraw_id)===String(value.withdraw_id));
  const next=normalizeWithdrawal(value,i>=0?state.pending_withdrawals[i]:activeWithdrawal);
  if(i>=0)state.pending_withdrawals[i]=next;else state.pending_withdrawals.push(next);
  if(activeWithdrawal&&String(activeWithdrawal.withdraw_id)===String(next.withdraw_id))Object.assign(activeWithdrawal,next,{phase:"pending"});
  renderWithdrawDashboard();
}
function removePendingWithdrawal(id){
  finishedWithdrawals.add(String(id));
  if(finishedWithdrawals.size>100)finishedWithdrawals.delete(finishedWithdrawals.values().next().value);
  state.pending_withdrawals=state.pending_withdrawals.filter(x=>String(x.withdraw_id)!==String(id));
  renderWithdrawDashboard();
}

async function startWithdrawal(method,value){
  if(activeWithdrawal)return viewActiveWithdrawal();
  const job={method,phase:"submitting",withdraw_id:null,amount:state.balance,withdraw_type:method==="bank"?"card":"id"};
  activeWithdrawal=job;lastWithdrawMethod=method;viewWithdrawWaiting();
  const result=await post(method==="bank"?"/withdraw-bank":"/withdraw",method==="bank"?{card:value}:{target:value});
  if(activeWithdrawal!==job)return;
  if(result.ok||result.error==="already_pending"){
    Object.assign(job,normalizeWithdrawal(result,job),{phase:"pending"});upsertPendingWithdrawal(job);
    if(currentView==="withdraw-waiting"){updateWaitingInfo(job);armBankAutoReturn();}
    pollWithdrawStatus();return;
  }
  if(["network","invalid_response","database_unavailable","server"].includes(result.error)){
    job.phase="unknown";if(isWithdrawalView())viewWithdrawUnknown();else showToast("وضعیت برداشت مشخص نشد؛ دوباره بررسی کن.");return;
  }
  activeWithdrawal=null;
  if(isWithdrawalView())viewWithdrawFailed(errorText(result.error));else showToast(errorText(result.error));
}
async function pollWithdrawStatus(){
  if(pollingWithdrawal||!activeWithdrawal)return;
  const job=activeWithdrawal;pollingWithdrawal=true;job.phase="pending";
  try{
    while(activeWithdrawal===job){
      await new Promise(resolve=>setTimeout(resolve,3000));if(activeWithdrawal!==job)return;
      if(!job.withdraw_id){
        const user=await api("/user");if(activeWithdrawal!==job)return;
        if(user.pending_withdrawal?.withdraw_id){
          Object.assign(job,normalizeWithdrawal(user.pending_withdrawal,job),{phase:"pending"});upsertPendingWithdrawal(job);
          if(currentView==="withdraw-waiting")armBankAutoReturn();
        }else if(user.error&&user.error!=="unauthorized")continue;
        else{
          job.phase="unknown";if(isWithdrawalView())viewWithdrawUnknown();
          if(user.error)showToast(errorText(user.error));return;
        }
      }
      const result=await api("/withdraw-status?withdraw_id="+encodeURIComponent(job.withdraw_id));
      if(activeWithdrawal!==job)return;
      if(result.status==="success"||result.status==="failed"){
        const success=result.status==="success";
        activeWithdrawal=null;removePendingWithdrawal(job.withdraw_id);clearBankTimers();
        if(isWithdrawalView())success?viewWithdrawSuccess():viewWithdrawFailed();
        else showToast(success?`🎉 برداشت ${fmt(job.amount)} میو با موفقیت انجام شد.`:"برداشت ناموفق بود.");
        await refreshData(false);return;
      }
      if(result.status==="pending"){
        Object.assign(job,normalizeWithdrawal(result,job),{phase:"pending"});upsertPendingWithdrawal(job);
        if(currentView==="withdraw-waiting")updateWaitingInfo(job);
      }else if(result.error==="unauthorized"||result.status==="none"){
        job.phase="unknown";if(isWithdrawalView())viewWithdrawUnknown();
        if(result.error)showToast(errorText(result.error));return;
      }else if(currentView==="withdraw-waiting")setText($("queueWaitText"),"ارتباط موقتاً قطع شده؛ در حال بررسی دوباره…");
    }
  }finally{
    pollingWithdrawal=false;
    if(activeWithdrawal&&activeWithdrawal!==job&&activeWithdrawal.phase==="pending")pollWithdrawStatus();
  }
}

/* ================= Game state ================= */

const GAME_PENDING_KEY=`mio_game_pending_${TG_USER_ID}`;
let pendingGameMemory="";
function getPendingGame(){try{return localStorage.getItem(GAME_PENDING_KEY)||pendingGameMemory;}catch{return pendingGameMemory;}}
function savePendingGame(id){pendingGameMemory=id;try{localStorage.setItem(GAME_PENDING_KEY,id);}catch{}}
function clearPendingGame(id){
  if(pendingGameMemory===id)pendingGameMemory="";
  try{if(localStorage.getItem(GAME_PENDING_KEY)===id)localStorage.removeItem(GAME_PENDING_KEY);}catch{}
}
function makeRequestId(){
  if(crypto.randomUUID)return crypto.randomUUID();
  const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  const hex=[...bytes].map(v=>v.toString(16).padStart(2,"0"));
  return[hex.slice(0,4),hex.slice(4,6),hex.slice(6,8),hex.slice(8,10),hex.slice(10)].map(a=>a.join("")).join("-");
}
function acceptGameState(data){
  gameState={...gameState,...data,deadline:performance.now()+Math.max(0,Number(data.remaining_seconds)||0)*1000};
  if(data.round&&!data.last_round)gameState.last_round=data.round;
}
function remainingGameSeconds(){return gameState?Math.max(0,Math.ceil((gameState.deadline-performance.now())/1000)):0;}
function formatCountdown(seconds){
  return[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(v=>String(v).padStart(2,"0")).join(":");
}
function canStartGame(){return Boolean(gameState?.enabled&&!gameState.withdrawal_pending&&remainingGameSeconds()===0);}
function symbolHTML(symbol){
  if(symbol==="seven")return'<span class="slot-symbol symbol-seven">7</span>';
  if(symbol==="grape")return'<span class="slot-symbol symbol-fruit">🍇</span>';
  if(symbol==="lemon")return'<span class="slot-symbol symbol-fruit">🍋</span>';
  return'<span class="slot-symbol symbol-blank">×</span>';
}
function reelCell(symbol,height){
  return `<span class="reel-cell"${height?` style="height:${height}px"`:""}>${symbolHTML(symbol)}</span>`;
}
function lastGameSymbols(){
  const symbols=gameState?.last_round?.symbols;
  return Array.isArray(symbols)&&symbols.length===3?symbols:["seven","grape","lemon"];
}

  if(currentView!=="game"||!$("gameResult"))return;

    lastGameSymbols().forEach((symbol,i)=>{

      track.innerHTML=reelCell(symbol);track.dataset.symbol=symbol;

    });
  }

function updateGameControls(){
  if(currentView!=="game"||!$("playGameBtn"))return;
  const pending=getPendingGame(),canPlay=!gameBusy&&(Boolean(pending)||canStartGame());
  ["playGameBtn","slotStartBtn","slotLever"].forEach(id=>$(id).disabled=!canPlay);
  $("gameRefreshBtn").disabled=gameBusy;
  $("slotMachine").setAttribute("aria-busy",String(gameBusy));
  $("gameCountdown").hidden=true;
  if(gameBusy){
    setText($("playGameLabel"),"در حال دریافت نتیجه…");

  if(!gameState.enabled){setText($("gameStatusText"),"بازی فعلاً غیرفعال است.");return;}
  if(gameState.withdrawal_pending){
    setText($("gameStatusText"),"برداشتت در حال پردازش است؛ بعد از پایان آن وضعیت بازی را بروزرسانی کن.");return;

  const remaining=remainingGameSeconds();
  if(remaining>0){
    setText($("gameStatusText"),"تا شانس بعدی");
    $("gameCountdown").hidden=false;setText($("gameCountdown"),formatCountdown(remaining));
  }else setText($("gameStatusText"),"بازی کاملاً رایگان است؛ دسته یا دکمهٔ شروع را بزن.");
}

/* ================= Slot animation ================= */

function reelLanding(cycle,offset,cellHeight,finalSymbol,index){
  const count=cycle.length;
  const absolute=Math.max(0,offset)/Math.max(1,cellHeight);
  const whole=Math.floor(absolute);
  const fraction=absolute-whole;
  const finalIndex=12+index*3;
  const symbols=Array.from({length:finalIndex},(_,i)=>cycle[(whole+i)%count]);
  symbols.push(finalSymbol,cycle[(whole+finalIndex+1)%count]);
  return{symbols,start:-fraction*cellHeight,end:-finalIndex*cellHeight};
}

function startReelAnimation(){
  const machine=$("slotMachine"),arm=$("leverArm");
  let disposed=false,leverAnimation=null;
  const start=performance.now();
  const records=[];
  machine?.classList.remove("is-winner");
  machine?.classList.add("is-spinning");

  if(!reduceMotion.matches&&arm?.animate){
    leverAnimation=arm.animate([
      {transform:"rotate(8deg) scaleY(1)",offset:0},
      {transform:"rotate(18deg) scaleY(.43)",offset:.40},
      {transform:"rotate(18deg) scaleY(.43)",offset:.56},
      {transform:"rotate(4deg) scaleY(1.02)",offset:.88},
      {transform:"rotate(8deg) scaleY(1)",offset:1}
    ],{duration:760,easing:"cubic-bezier(.25,.8,.3,1)"});
  }

  for(let i=0;i<3;i++){
    const box=$("reel"+i),track=$("reelTrack"+i);
    if(!box||!track)continue;
    const height=Math.max(1,box.clientHeight);
    const first=SYMBOL_KEYS.includes(track.dataset.symbol)?track.dataset.symbol:SYMBOL_KEYS[i];
    const index=SYMBOL_KEYS.indexOf(first);
    const cycle=SYMBOL_KEYS.slice(index).concat(SYMBOL_KEYS.slice(0,index));
    const duration=440+i*85;
    const rec={box,track,height,cycle,duration,loop:null,landing:null};
    records.push(rec);

    if(!reduceMotion.matches&&track.animate){
      track.innerHTML=cycle.concat(cycle.slice(0,2)).map(s=>reelCell(s,height)).join("");
      track.style.transform="translateY(0)";
      box.classList.add("rolling");
      rec.loop=track.animate([
        {transform:"translateY(0)"},
        {transform:`translateY(${-cycle.length*height}px)`}
      ],{duration,iterations:Infinity,easing:"linear"});
    }
  }

  function settle(rec,symbol){
    rec.track.style.transform="translateY(0)";
    rec.track.innerHTML=reelCell(symbol);
    rec.track.dataset.symbol=symbol;
    rec.box.classList.remove("rolling");
  }

  async function finishOne(rec,symbol,index){
    if(disposed||!rec.track.isConnected)return;
    if(reduceMotion.matches||!rec.loop||!rec.track.animate){
      rec.loop?.cancel();settle(rec,symbol);return;
    }

    const current=Number(rec.loop.currentTime)||0;
    const offset=((current%rec.duration)/rec.duration)*rec.cycle.length*rec.height;
    const plan=reelLanding(rec.cycle,offset,rec.height,symbol,index);

    rec.loop.cancel();
    rec.track.innerHTML=plan.symbols.map(s=>reelCell(s,rec.height)).join("");
    rec.track.style.transform=`translateY(${plan.start}px)`;

    rec.landing=rec.track.animate([
      {transform:`translateY(${plan.start}px)`},
      {transform:`translateY(${plan.end}px)`}
    ],{
      duration:1050+index*290,
      easing:"cubic-bezier(.12,.72,.15,1)",
      fill:"forwards"
    });

    try{await rec.landing.finished;}catch{return;}
    if(disposed||!rec.track.isConnected)return;

    rec.track.style.transform=`translateY(${plan.end}px)`;
    rec.landing.cancel();rec.landing=null;
    settle(rec,symbol);
    tinyHaptic();
  }

  return{
    stop(){
      disposed=true;
      leverAnimation?.cancel();
      records.forEach(rec=>{
        rec.loop?.cancel();rec.landing?.cancel();
        rec.box.classList.remove("rolling");
      });
      machine?.classList.remove("is-spinning");
    },
    async finish(symbols){
      const wait=reduceMotion.matches?0:Math.max(0,1100-(performance.now()-start));
      if(wait)await new Promise(resolve=>setTimeout(resolve,wait));
      if(disposed)return;
      await Promise.all(records.map((rec,index)=>finishOne(rec,symbols[index],index)));
      machine?.classList.remove("is-spinning");
    }
  };
}

async function playGame(){
  if(gameBusy)return;
  let id=getPendingGame();
  if(!id&&!canStartGame())return;
  if(!id){
    try{id=makeRequestId();}catch{showToast("برای بازی، مینی‌اپ را داخل تلگرام باز کن.");return;}
    savePendingGame(id);
  }

  gameBusy=true;
  syncGamePresentation();updateGameControls();stopGameVisual();
  activeGameAnimation=startReelAnimation();
  tinyHaptic();

  let winning=false;
  try{
    const result=await post("/game/play",{request_id:id});
    const validSymbols=Array.isArray(result.round?.symbols)&&
      result.round.symbols.length===3&&result.round.symbols.every(s=>SYMBOL_KEYS.includes(s));

    if(result.ok&&result.round&&validSymbols){
      acceptGameState(result);
      if(activeGameAnimation)await activeGameAnimation.finish(result.round.symbols);

      clearPendingGame(id);
      setBalance(result.balance);

      const reward=Number(result.round.reward)||0;
      winning=reward>0;
      showToast(result.replayed?`نتیجهٔ ثبت‌شده بازی: ${fmt(reward)} میو`:
        reward>0?`🎉 ${fmt(reward)} میو به موجودیت اضافه شد!`:"این بار پوچ شد؛ دفعهٔ بعد دوباره امتحان کن 🍀");
      return;
    }

    if(["cooldown","withdrawal_pending","game_disabled","not_started","invalid_request_id"].includes(result.error)){
      clearPendingGame(id);
    }
    if(typeof result.remaining_seconds==="number"){
      acceptGameState(result);setBalance(result.balance);
    }
    showToast(errorText(result.error));
  }finally{
    stopGameVisual();gameBusy=false;
    if(currentView==="game"){
      // دستگاه دوباره ساخته نمی‌شود؛ فقط نتیجه و کنترل‌ها به‌روز می‌شوند.
      syncGamePresentation();updateGameControls();
      $("slotMachine")?.classList.toggle("is-winner",winning);
    }
  }
}

/* ================= User / refresh ================= */

function applyUserData(user){
  if(!user||user.ok===false||user.balance==null||!Number.isFinite(Number(user.balance)))return false;
  hasUserData=true;state.not_started=Boolean(user.not_started);state.daily_enabled=Boolean(user.daily_enabled);
  state.withdrawn_today=Number(user.withdrawn_today)||0;
  state.notifications=Array.isArray(user.notifications)?user.notifications.filter(n=>n&&typeof n==="object"):[];
  const previous=new Map(state.pending_withdrawals.map(x=>[String(x.withdraw_id),x]));
  const pending=Array.isArray(user.pending_withdrawals)?user.pending_withdrawals:user.pending_withdrawal?[user.pending_withdrawal]:[];
  state.pending_withdrawals=pending.filter(x=>x?.withdraw_id&&!finishedWithdrawals.has(String(x.withdraw_id)))
    .map(x=>normalizeWithdrawal(x,previous.get(String(x.withdraw_id))));
  if(activeWithdrawal){
    const match=state.pending_withdrawals.find(x=>String(x.withdraw_id)===String(activeWithdrawal.withdraw_id));
    if(match)Object.assign(activeWithdrawal,match);
  }else if(state.pending_withdrawals.length){
    activeWithdrawal={...state.pending_withdrawals[0],phase:"pending"};lastWithdrawMethod=activeWithdrawal.method;
  }
  setBalance(user.balance);renderWithdrawDashboard();
  if($("notifOverlay").classList.contains("show")){
    renderNotifications();setSeen(notificationKey(state.notifications[0]));
  }
  updateBellDot();
  if(activeWithdrawal?.phase==="pending"&&!pollingWithdrawal)pollWithdrawStatus();
  return true;
}
async function refreshData(showError=true){
  const version=++userRequestVersion;
  refreshBtn.classList.add("spinning");refreshBtn.disabled=true;refreshBtn.setAttribute("aria-busy","true");
  try{
    const user=await api("/user");if(version!==userRequestVersion)return;
    if(!applyUserData(user)){if(showError)showToast(errorText(user.error));return;}
    if(currentView==="daily")viewDaily();
    else if(currentView==="profile")viewProfile();
    else if(currentView==="game"&&!gameBusy)await viewGame();
  }finally{
    if(version===userRequestVersion){
      refreshBtn.classList.remove("spinning");refreshBtn.disabled=false;refreshBtn.setAttribute("aria-busy","false");
    }
  }
}

document.addEventListener("click",e=>{
  if(!(e.target instanceof Element))return;
  const button=e.target.closest(".menu-btn,.primary-btn,.copy-btn,.withdraw-method");
  if(!button||button.disabled||reduceMotion.matches)return;
  const rect=button.getBoundingClientRect(),size=Math.hypot(rect.width,rect.height)*2;
  const x=e.detail?e.clientX-rect.left:rect.width/2,y=e.detail?e.clientY-rect.top:rect.height/2;
  const ripple=document.createElement("span");ripple.className="ripple";ripple.setAttribute("aria-hidden","true");
  Object.assign(ripple.style,{width:`${size}px`,height:`${size}px`,left:`${x-size/2}px`,top:`${y-size/2}px`});
  button.append(ripple);setTimeout(()=>ripple.remove(),650);
},true);

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopGameVisual();return;}
  keyboard.update();updatePendingClocks();
  if(currentView==="game"){
    updateGameControls();
    if(gameBusy&&!activeGameAnimation)activeGameAnimation=startReelAnimation();
  }
  if(hasUserData&&!gameBusy)refreshData(false);
});
reduceMotion.addEventListener?.("change",()=>{
  if(reduceMotion.matches)stopGameVisual();
});
setInterval(()=>{
  if(!document.hidden&&currentView==="home")updatePendingClocks();
},1000);

applyTheme();

/* ================= Init ================= */

async function init(){
  const version=++userRequestVersion,start=performance.now(),userPromise=api("/user");
  let timer;
  const timeout=new Promise(resolve=>{timer=setTimeout(()=>resolve(null),4000);});
  const first=await Promise.race([userPromise,timeout]);clearTimeout(timer);
  const wait=650-(performance.now()-start);
  if(wait>0)await new Promise(resolve=>setTimeout(resolve,wait));
  $("skeletonSection").style.display="none";
  if(currentView==="home")showHome();
  if(version!==userRequestVersion)return;
  if(first){
    if(!applyUserData(first)){$("balanceValue").textContent="—";showToast(errorText(first.error));}
  }else userPromise.then(user=>{
    if(version!==userRequestVersion)return;
    if(!applyUserData(user)){$("balanceValue").textContent="—";showToast(errorText(user.error));}
  });
}
init();
