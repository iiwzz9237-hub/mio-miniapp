<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Mio Point</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --user-bg:#0d1016;
  --user-card:#202027;
  --user-accent:#4f8cff;
  --text:#f5f5f7;
  --dim:#b6c8e8;
  --card-text:#fff;
  --card-dim:#b6c8e8;
  --card-end:#0d1016;
  --border:rgba(255,255,255,.10);
  --wash:255,255,255;
  --nav-rgb:13,16,22;
  --action-bg:#4f8cff;
  --action-ink:#fff;
  --highlight:#4f8cff;
  --balance-ink:#4f8cff;
  --gold:#f4cf77;
  --danger:#ff8585;
  --success:#93d8ba;
  --keyboard-offset:0px;
  --doz-viewport-height:100dvh;
  --doz-board-size:260px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;background:var(--user-bg);color-scheme:dark}
body{
  margin:0;
  min-height:100vh;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  background:var(--user-bg);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 88% 0%,rgba(255,255,255,.065),transparent 46%),
    radial-gradient(ellipse at 0% 68%,rgba(91,135,220,.075),transparent 50%),
    var(--user-bg);
}
button,input{font-family:inherit}
button{
  color:inherit;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,input:focus-visible{
  outline:2px solid var(--highlight);
  outline-offset:4px;
}
.app{
  position:relative;
  z-index:1;
  max-width:480px;
  margin:auto;
  padding:20px 20px 122px;
  animation:fade-in .65s var(--ease) backwards;
}

/* ===== Top bar ===== */

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:600;line-height:1.9;color:var(--text);overflow-wrap:anywhere}
.icon-btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 44px;
  width:44px;
  height:44px;
  padding:0;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(var(--wash),.055);
  color:var(--text);
  transition:transform .2s var(--ease),background .2s ease;
}
.icon{
  display:block;
  flex-shrink:0;
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.refresh-btn .icon{transform-box:view-box;transform-origin:50% 50%}
.refresh-btn.spinning .icon{animation:spin .85s linear infinite}
.bell-dot{
  position:absolute;
  top:8px;
  left:9px;
  display:none;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--user-accent);
  box-shadow:0 0 0 3px var(--user-bg);
}
.bell-dot.show{display:block;animation:pop-in .4s var(--ease) backwards}
.title-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:46px;margin:24px 0 28px}
.title{margin:0;text-align:center;font-size:clamp(24px,7vw,34px);font-weight:800;letter-spacing:-.8px}
.back-arrow{position:absolute;right:0;display:none}
.view-active .title-row{padding-inline:49px}
.view-active .title{font-size:clamp(19px,5.8vw,28px);line-height:1.6}

/* ===== Balance ===== */

.balance-card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:32px 20px 36px;
  margin-bottom:22px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:28px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.075),transparent 72%),
    linear-gradient(135deg,var(--user-card),var(--card-end));
  box-shadow:0 18px 44px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.08);
  animation:rise .7s .04s var(--ease) backwards;
}
.balance-card::before{
  content:"";
  position:absolute;
  inset:0 18% auto;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--user-accent),transparent);
  pointer-events:none;
}
.balance-card::after{
  content:"";
  position:absolute;
  z-index:-1;
  left:-95px;
  bottom:-105px;
  width:170px;
  height:170px;
  border:1px solid rgba(122,195,255,.11);
  border-radius:50%;
  box-shadow:0 0 0 22px rgba(88,170,255,.045),0 0 0 44px rgba(88,170,255,.025);
  pointer-events:none;
}
.balance-label{margin-bottom:18px;font-size:13px;color:var(--card-dim)}
.balance-value{
  display:inline-block;
  max-width:100%;
  direction:ltr;
  font-size:clamp(30px,9vw,46px);
  font-weight:800;
  font-variant-numeric:tabular-nums;
  line-height:1.3;
  letter-spacing:-1.5px;
  color:var(--balance-ink);
  overflow-wrap:anywhere;
}
.balance-unit{margin-inline-start:6px;font-size:17px;font-weight:700;color:var(--balance-ink)}

/* ===== Withdrawal summary ===== */

.withdraw-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.summary-card{min-width:0;padding:16px 10px;border:1px solid var(--border);border-radius:19px;background:rgba(var(--wash),.04);text-align:center}
.summary-card>span{display:block;font-size:11px;color:var(--dim)}
.summary-card>strong{display:block;margin:9px 0 4px;direction:ltr;font-size:clamp(18px,5vw,24px);font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.summary-card>small{display:block;color:var(--dim);font-size:10px;line-height:1.9}
.pending-list{display:grid;gap:10px;margin-bottom:18px;overflow-anchor:none}
.pending-list:empty{margin-bottom:8px}
.pending-item{
  display:block;
  width:100%;
  min-width:0;
  padding:16px;
  border:1px solid var(--border);
  border-radius:19px;
  background:rgba(var(--wash),.035);
  color:var(--text);
  text-align:right;
  animation:none;
  transform:none;
  transition:border-color .2s ease,background .2s ease;
}
.pending-item:active{background:rgba(var(--wash),.075)}
.pending-head,.pending-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pending-head strong{font-size:13px}
.pending-head b{direction:rtl;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pending-meta{margin-top:10px;color:var(--dim);font-size:11px}
.pending-clock{
  display:flex;
  align-items:center;
  min-height:3.8em;
  margin-top:7px;
  font-size:12px;
  line-height:1.9;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}
.pending-hint{display:block;min-height:3.8em;font-size:10px;line-height:1.9;color:var(--dim)}
.home-receipt{margin:0 0 18px!important}

/* ===== Menu ===== */

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
.menu-btn{
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:13px;
  min-width:0;
  min-height:132px;
  padding:22px 10px;
  border:1px solid var(--border);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(var(--wash),.06),rgba(var(--wash),.022));
  color:var(--text);
  text-align:center;
  font-size:14px;
  font-weight:600;
  line-height:1.7;
  transition:transform .25s var(--ease),border-color .25s ease,box-shadow .25s ease;
  animation:rise .65s var(--delay,.1s) var(--ease) backwards;
}
.menu-btn:nth-child(1){--delay:.10s}
.menu-btn:nth-child(2){--delay:.16s}
.menu-btn:nth-child(3){--delay:.22s}
.menu-btn:nth-child(4){--delay:.28s}
.menu-btn:nth-child(5){--delay:.34s}
.menu-icon{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.10);color:#d6edff;transition:transform .3s var(--ease)}
#btnInvite .menu-icon{background:rgba(141,174,246,.16);color:#d8e7ff}
#btnBankWithdraw .menu-icon{background:rgba(136,213,181,.14);color:#a8ead0}
#btnDaily .menu-icon{background:rgba(192,156,238,.14);color:#dbc6f7}
#btnGame .menu-icon{background:rgba(176,133,255,.10);color:#d7c2fb}
.menu-btn.game-menu{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:16px;min-height:106px;padding:20px;text-align:right}
.game-menu .menu-icon{width:54px;height:54px;flex-shrink:0}
.game-menu .menu-icon .icon{width:27px;height:27px}
.menu-copy{flex:1;min-width:0}
.menu-copy strong{display:block;font-size:16px}
.menu-copy small{display:block;margin-top:5px;color:var(--dim);font-size:12px;font-weight:400}
.game-menu>.icon{color:var(--dim)}
body[data-bright="true"] .menu-icon,
body[data-bright="true"] #btnInvite .menu-icon,
body[data-bright="true"] #btnBankWithdraw .menu-icon,
body[data-bright="true"] #btnDaily .menu-icon,
body[data-bright="true"] #btnGame .menu-icon{color:var(--text);background:rgba(0,0,0,.065)}

/* ===== Panels / fields ===== */

.panel{min-height:140px;padding:25px 21px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,rgba(var(--wash),.06),rgba(var(--wash),.022))}
#homeSection>.panel{animation:rise .65s .4s var(--ease) backwards}
.panel h2{margin:0 0 12px;font-size:19px}
.panel p{margin:0 0 10px;color:var(--dim);font-size:14px;line-height:2}
.muted-center{text-align:center;padding:10px 0 4px}
.panel b{color:var(--text)}
.gold-text{color:var(--highlight)!important}
.link-box{display:flex;align-items:center;gap:8px;margin:14px 0 18px;padding:12px;border:1px solid var(--border);border-radius:17px;background:rgba(var(--wash),.035)}
.link-box>span{flex:1;min-width:0;overflow-x:auto;direction:ltr;text-align:left;white-space:nowrap;font-size:13px}
.field-label{display:block;margin-top:14px;color:var(--text);font-size:13px}
.id-input{
  width:100%;
  margin:10px 0 6px;
  padding:16px;
  border:1px solid var(--border);
  border-radius:17px;
  background:rgba(var(--wash),.035);
  color:var(--text);
  direction:ltr;
  text-align:left;
  font-size:16px;
  scroll-margin-block:24px;
  transition:border-color .2s,box-shadow .2s;
}
.id-input::placeholder{color:var(--dim);opacity:.8}
.id-input:focus{outline:none;border-color:var(--highlight);box-shadow:0 0 0 3px rgba(var(--wash),.06)}
.field-error{min-height:20px;margin-bottom:6px;color:var(--danger);font-size:12px;line-height:1.8}

/* ===== Buttons ===== */

.primary-btn,.ghost-btn,.copy-btn{position:relative;overflow:hidden;border:none;font-weight:700;transition:transform .2s var(--ease),opacity .2s,background .2s}
.primary-btn{width:100%;margin-top:10px;padding:16px;border-radius:17px;background:var(--action-bg);color:var(--action-ink);font-size:15px;font-weight:800}
.ghost-btn{width:100%;margin-top:10px;padding:14px;border:1px solid var(--border);border-radius:17px;background:rgba(var(--wash),.025);color:var(--text);font-size:14px}
.copy-btn{flex-shrink:0;padding:9px 14px;border-radius:11px;background:var(--action-bg);color:var(--action-ink);font-size:12px;white-space:nowrap}
.copy-btn.copied{background:#92d7ad;color:#143322}
.primary-btn.rgb-btn{
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:64px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(110deg,#ff356f,#a855f7 22%,#4f6cff 44%,#06b6d4 65%,#22c55e 82%,#ff356f);
  background-size:350% 350%;
  color:#fff;
  box-shadow:0 8px 25px rgba(109,80,230,.20);
  animation:rgb-flow 7s ease-in-out infinite;
}
.rgb-btn .btn-label{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:112px;padding:7px 20px;border:1px solid rgba(255,255,255,.20);border-radius:11px;background:#111625;color:#fff;font-size:15px;font-weight:800;line-height:1.6;pointer-events:none}
.btn-label .icon{width:18px;height:18px;stroke-width:2.2}
.menu-btn:active,.primary-btn:active,.ghost-btn:active,.copy-btn:active,.icon-btn:active{transform:scale(.965)}
.spinner{width:38px;height:38px;margin:8px auto 16px;border:2px solid rgba(var(--wash),.12);border-top-color:var(--highlight);border-radius:50%;animation:spin .9s linear infinite}
.result-icon{text-align:center;font-size:42px;margin:4px 0 18px;animation:pop-in .6s var(--ease) backwards}
.toggle-row{margin:16px 0 12px;padding:14px 16px;border:1px solid var(--border);border-radius:17px;background:rgba(var(--wash),.035)}
.status-text{color:var(--success);font-size:15px;font-weight:700}

/* ===== Exclusive withdrawal page ===== */

.panel.withdraw-panel{padding:0;border:0;background:transparent}
.withdraw-hub{
  position:relative;
  isolation:isolate;
  padding:1px;
  --hub-text:#f5f7ff;
  --hub-dim:#bdc8e0;
  color:var(--hub-text);
}
.withdraw-hero{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  min-height:259px;
  padding:25px;
  border:1px solid rgba(157,178,255,.23);
  border-radius:29px;
  background:
    radial-gradient(ellipse at 100% 0%,rgba(93,128,255,.33),transparent 58%),
    radial-gradient(ellipse at 0% 100%,rgba(111,71,204,.24),transparent 57%),
    linear-gradient(125deg,#172848,#12182e 58%,#191c36);
  box-shadow:0 20px 45px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.09);
}
.withdraw-hero::before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  left:-105px;
  top:-67px;
  z-index:-1;
  border:1px solid rgba(169,190,255,.17);
  border-radius:50%;
  box-shadow:0 0 0 27px rgba(169,190,255,.035),0 0 0 55px rgba(169,190,255,.022);
}
.withdraw-hero::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.055) 49%,transparent 68%);
  background-size:250% 100%;
  animation:wallet-sheen 9s ease-in-out infinite;
}
.withdraw-hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.withdraw-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(164,185,255,.18);border-radius:999px;background:rgba(255,255,255,.045);font-size:10px;color:#dce6ff}
.withdraw-chip>span{width:5px;height:5px;border-radius:50%;background:#99dfd6;box-shadow:0 0 10px rgba(153,223,214,.4)}
.withdraw-emblem{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid rgba(175,194,255,.18);border-radius:14px;background:rgba(255,255,255,.055);color:#b4c8ff;transform:rotate(-8deg)}
.panel .withdraw-eyebrow{margin:0 0 8px;color:#bdc8e0;font-size:12px}
.withdraw-total{display:flex;align-items:baseline;gap:10px;margin-bottom:25px}
.withdraw-total strong{direction:ltr;font-size:clamp(28px,9vw,42px);font-weight:800;line-height:1.3;letter-spacing:-1px;color:#f7faff;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.withdraw-total>span{font-size:14px;color:#b8c9ee}
.withdraw-hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:17px;border-top:1px solid rgba(175,194,255,.13)}
.withdraw-hero-bottom small{display:block;margin-bottom:5px;color:#bdc8e0;font-size:10px}
.withdraw-hero-bottom strong{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#b1e5d8}
.withdraw-today-icon{display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:50%;background:rgba(128,225,189,.09);color:#a9dfcd}
.withdraw-today-icon .icon{width:17px;height:17px}
.withdraw-section-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 3px 13px;color:var(--text)}
.withdraw-section-label h2{margin:0;font-size:15px}
.withdraw-section-label>span{font-size:10px;color:var(--dim)}
.withdraw-methods{display:grid;gap:12px}
.withdraw-method{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  min-height:103px;
  padding:19px 16px;
  border:1px solid rgba(175,194,255,.17);
  border-radius:23px;
  text-align:right;
  color:#f5f7ff;
  background:linear-gradient(120deg,#17213a,#171a2b);
  box-shadow:0 8px 22px rgba(0,0,0,.11);
  transition:transform .2s var(--ease),border-color .2s,box-shadow .2s;
}
.bank-method{background:radial-gradient(ellipse at 100% 50%,rgba(107,101,213,.18),transparent 70%),linear-gradient(120deg,#1e2240,#171b30)}
.id-method{background:radial-gradient(ellipse at 100% 50%,rgba(61,148,187,.14),transparent 70%),linear-gradient(120deg,#162b37,#171d2e)}
.withdraw-method::before{
  content:"";
  position:absolute;
  inset:14px 0 14px auto;
  width:2px;
  background:linear-gradient(transparent,#a7adff,transparent);
  opacity:.8;
  pointer-events:none;
}
.id-method::before{background:linear-gradient(transparent,#99dcea,transparent)}
.withdraw-method-icon{display:flex;align-items:center;justify-content:center;flex:0 0 49px;width:49px;height:49px;border:1px solid rgba(188,181,255,.16);border-radius:16px;background:rgba(168,147,250,.10);color:#c7beff}
.id-method .withdraw-method-icon{background:rgba(107,210,230,.08);border-color:rgba(133,222,239,.14);color:#b1e8ef}
.withdraw-method-copy{flex:1;min-width:0}
.withdraw-method-copy strong{display:block;font-size:14px;font-weight:700}
.withdraw-method-copy small{display:block;margin-top:7px;font-size:10px;line-height:1.8;color:#c0cae0}
.withdraw-method-arrow{display:flex;align-items:center;justify-content:center;flex:0 0 27px;width:27px;height:27px;border-radius:50%;background:rgba(255,255,255,.045);color:#cad6f0}
.withdraw-method-arrow .icon{width:16px;height:16px}
.withdraw-method:active{transform:scale(.979)}
.withdraw-home-link{display:flex;align-items:center;gap:9px;width:100%;margin-top:18px;padding:14px 13px;border:1px solid var(--border);border-radius:16px;background:rgba(var(--wash),.035);color:var(--text);text-align:right;font-size:11px;line-height:1.8}
.withdraw-home-link>span:nth-child(2){flex:1}
.withdraw-home-link>.icon{width:16px;height:16px;color:var(--dim)}
.withdraw-pending-dot{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--highlight)}
.panel .withdraw-footnote{margin:14px 5px 0;text-align:center;color:var(--dim);font-size:10px;line-height:1.9}
.withdraw-hub button:focus-visible{outline-color:#92b2ff}

/* ===== Game / slot machine ===== */

.panel.game-panel{padding:0;border:0;background:transparent}
.casino{
  --text:#fff4dc;
  --dim:#d6c1b6;
  --wash:255,255,255;
  --border:rgba(247,214,153,.16);
  --highlight:#f4cf77;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:24px 17px 20px;
  border:1px solid rgba(231,179,93,.22);
  border-radius:30px;
  background:
    radial-gradient(ellipse at 50% 8%,rgba(191,51,66,.24),transparent 48%),
    radial-gradient(ellipse at 90% 80%,rgba(125,65,31,.15),transparent 55%),
    linear-gradient(155deg,#29131d,#120e17 58%,#21151c);
  color:var(--text);
  box-shadow:0 22px 50px rgba(0,0,0,.23);
}
.casino::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  opacity:.22;
  pointer-events:none;
  background-image:radial-gradient(rgba(255,223,157,.3) .7px,transparent .7px);
  background-size:16px 16px;
}
.game-intro{text-align:center}
.game-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 12px;
  margin-bottom:13px;
  border:1px solid rgba(244,207,119,.22);
  border-radius:999px;

.slot-lever{position:absolute;z-index:3;right:-6px;top:63px;width:48px;height:157px;padding:0;border:0;background:transparent;perspective:300px}

.casino-spin-btn{

.casino-spin-btn .icon{width:21px;height:21px}
.game-status{min-height:79px;margin:18px 0 4px;text-align:center;color:#d6c1b6;font-size:12px;line-height:1.9}

/* ===== Notifications / meteor shower ===== */

.sheet-overlay{
  position:fixed;
  inset:0;
  z-index:50;
  isolation:isolate;
  overflow:hidden;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 76px) 16px 20px;
  background:rgba(3,7,21,.93);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .25s,visibility .25s;
}
.sheet-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
.meteor-sky{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 75% 15%,rgba(80,59,153,.25),transparent 48%),
    radial-gradient(ellipse at 10% 80%,rgba(21,81,142,.2),transparent 50%),
    linear-gradient(160deg,#080d24,#030711 75%);
}
.meteor-sky::before,.meteor-sky::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle at 12% 16%,#d6e8ff 0 1px,transparent 1.6px),
    radial-gradient(circle at 72% 23%,#fff 0 1px,transparent 1.6px),
    radial-gradient(circle at 38% 63%,#bfcbff 0 1px,transparent 1.5px),
    radial-gradient(circle at 87% 78%,#d6e8ff 0 .8px,transparent 1.5px),
    radial-gradient(circle at 51% 42%,#fff 0 .7px,transparent 1.4px);
  background-size:211px 263px;
  opacity:.65;
}
.meteor-sky::after{background-size:337px 389px;background-position:81px 119px;opacity:.32}
.meteor{
  position:absolute;
  top:var(--meteor-top,0%);
  left:var(--meteor-left,80%);
  width:140px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg,#fff,rgba(153,197,255,.75) 12%,transparent);
  box-shadow:0 0 7px rgba(140,191,255,.4);
  opacity:0;
  transform:rotate(-45deg);
  transform-origin:left center;
  animation:meteor-fall var(--meteor-duration,6s) linear infinite;
  animation-delay:var(--meteor-delay,0s);
  animation-play-state:paused;
}
.sheet-overlay.show:not(.meteors-paused) .meteor{animation-play-state:running}
@keyframes meteor-fall{
  0%{opacity:0;transform:translate3d(120px,-120px,0) rotate(-45deg)}
  4%{opacity:.9}
  23%{opacity:0;transform:translate3d(-520px,520px,0) rotate(-45deg)}
  100%{opacity:0;transform:translate3d(-520px,520px,0) rotate(-45deg)}
}
.sheet{
  --text:#f5f5f7;
  --dim:#b6c8e8;
  --wash:255,255,255;
  --border:rgba(255,255,255,.13);
  --danger:#ff8585;
  --success:#93d8ba;
  position:relative;
  z-index:1;
  color:var(--text);
  width:min(420px,100%);
  max-height:70vh;
  max-height:70dvh;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:18px;
  border:1px solid rgba(162,185,249,.24);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(18,32,70,.89),rgba(9,17,39,.88));
  box-shadow:0 30px 90px rgba(0,0,0,.4);
  transform:translateY(-14px) scale(.975);
  transition:transform .35s var(--ease);
}
.sheet-overlay.show .sheet{transform:translateY(0) scale(1)}
.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet h3{margin:0;font-size:16px}
.close-btn{width:34px;height:34px;flex-basis:34px;border-radius:11px}
.notif-item{margin-bottom:8px;padding:12px 14px;border:1px solid rgba(255,255,255,.07);border-radius:15px;background:rgba(255,255,255,.06);font-size:14px;line-height:1.9;overflow-wrap:anywhere}
.notif-item.success{border-inline-start:3px solid var(--success)}
.notif-item.fail{border-inline-start:3px solid var(--danger)}
.notif-item .t{margin-top:5px;direction:ltr;text-align:right;color:var(--dim);font-size:11px}
.notif-empty{padding:24px 0;text-align:center;color:var(--dim);font-size:14px}

/* ===== Bottom navigation ===== */

.bottom-nav{
  position:fixed;
  z-index:45;
  right:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  width:min(448px,calc(100vw - 22px));
  transform:translateX(50%);
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:3px;
  padding:8px 6px;
  border:1px solid var(--border);
  border-radius:22px;
  background:rgba(var(--nav-rgb),.94);
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(0,0,0,.2);
  opacity:1;
  visibility:visible;
  transition:
    transform .42s var(--ease),
    opacity .3s ease,
    visibility 0s;
}
.bottom-nav button{min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 1px;border:0;border-radius:15px;background:transparent;color:var(--dim);font-size:9px;font-weight:700;white-space:nowrap}
.bottom-nav button.active{background:rgba(var(--wash),.075);color:var(--text)}
.bottom-nav button.active>.nav-svg{color:var(--highlight)}
.nav-svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-withdraw-icon{display:flex;align-items:center;justify-content:center;width:35px;height:31px;border:1px solid rgba(180,196,255,.20);border-radius:11px;background:linear-gradient(135deg,#334e8d,#47376e);color:#fff;box-shadow:0 4px 12px rgba(41,60,120,.17)}
.bottom-nav .nav-withdraw{gap:3px}
.bottom-nav .nav-withdraw.active .nav-withdraw-icon{background:linear-gradient(135deg,#446ed0,#7651aa);box-shadow:0 4px 15px rgba(78,100,202,.26)}
body.keyboard-open .bottom-nav{visibility:hidden;opacity:0;pointer-events:none;transform:translate(50%,140%)}
body.keyboard-open .toast{bottom:calc(var(--keyboard-offset) + 12px)}

.doz-finale{

.doz-finale-card small{display:block;margin-top:13px;color:#cbd5f1;font-size:12px;line-height:2}
.doz-finale-card .primary-btn{min-height:48px;margin-top:22px}
.doz-confetti{position:absolute;top:-20px;left:var(--left);width:9px;height:16px;border-radius:2px;background:var(--color);pointer-events:none;animation:doz-confetti-fall var(--duration) var(--delay) linear forwards}
@keyframes doz-draw{to{stroke-dashoffset:0}}
@keyframes doz-confetti-fall{
  from{transform:translate3d(0,-25px,0) rotate(0deg);opacity:1}

/* ===== Toast / motion ===== */

.toast{position:fixed;z-index:100;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);left:50%;width:max-content;max-width:calc(100vw - 40px);padding:12px 18px;border:1px solid rgba(255,255,255,.14);border-radius:15px;background:#0a3a83;color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.3);text-align:center;font-size:13px;line-height:1.9;opacity:0;visibility:hidden;transform:translate(-50%,14px);pointer-events:none;transition:opacity .25s,transform .3s var(--ease),visibility .25s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:ripple-out .6s var(--ease) forwards}
.anim-in-right{animation:forward-in .4s var(--ease) backwards}
.anim-in-left{animation:back-in .4s var(--ease) backwards}
.anim-pop{animation:rise .35s var(--ease) backwards}

@media(max-height:520px) and (min-width:600px){
  body.doz-focus .app{
    max-width:900px;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:44px minmax(0,1fr);
    column-gap:18px;

  body.doz-focus #viewSection{grid-column:1/-1}
  body.doz-focus .doz-arena{

  body.doz-focus .doz-arena>.doz-kicker{grid-column:1;grid-row:1}

  body.doz-focus .doz-arena-actions{grid-column:1;grid-row:5;align-content:end}
  body.doz-focus .doz-lobby{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);

  body.doz-focus .doz-lobby-controls{

@media(max-height:450px) and (max-width:599px){

<script>
(function mioApp() {
  "use strict";

  const API_BASE = "https://mio-backend-1-sus9.onrender.com/api";

  const tg = window.Telegram?.WebApp;
  try { tg?.ready(); tg?.expand(); } catch {}

  const $ = id => document.getElementById(id);
  const TG_USER_ID = tg?.initDataUnsafe?.user?.id || "guest";

  $("topWelcome").textContent = TG_FIRST_NAME
    ? `خوش آمدید ${TG_FIRST_NAME} عزیز`

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const app = $("app");
  const panel = $("panel");
  const refreshBtn = $("refreshBtn");
  const pageTitle = $("pageTitle");

  const state = {
    balance:0,
    daily_enabled:false,
    notifications:[],
    not_started:false,
    withdrawn_today:0,
    pending_withdrawals:[]
  };

  let hasUserData = false;
  let currentView = "home";
  let viewVersion = 0;
  let userRequestVersion = 0;
  let activeWithdrawal = null;
  let pollingWithdrawal = false;
  let lastWithdrawMethod = "id";
  let enablingDaily = false;
  let bankScreenTimer = null;
  let bankNoticeTimer = null;
  let gameState = null;
  let gameBusy = false;
  let gameTimer = null;
  let activeGameAnimation = null;
  let toastTimer;

  const finishedWithdrawals = new Set();

  const GAME_SYMBOLS = {
    seven:"7",
    grape:"🍇",
    lemon:"🍋",
    blank:"×"
  };

  const SYMBOL_KEYS = ["seven","grape","lemon","blank"];
  const SYMBOL_NAMES = {seven:"هفت",grape:"انگور",lemon:"لیمو",blank:"پوچ"};
  const DEFAULT_PAYOUTS = {
    seven:[0,100000,200000,400000],
    grape:[0,30000,60000,80000],
    lemon:[0,10000,20000,30000],
    blank:[0,0,0,0]
  };

  let dozState = null;
  let dozRound = null;
  let dozBusy = false;
  let dozUncertain = false;
  let dozDeadline = 0;
  let dozTimer = null;
  let dozResultTimer = null;
  let dozCelebrating = false;
  let dozStartMemory = "";
  let dozRpsCountdownCancel = null;
  let dozBoardObserver = null;
  let dozFitFrame = 0;

  const dozCelebrated = new Set();
  const DOZ_PENDING_KEY = `mio_doz_start_${TG_USER_ID}`;

  const RPS = {
    rock:{label:"سنگ",emoji:"✊"},
    paper:{label:"کاغذ",emoji:"✋"},
    scissors:{label:"قیچی",emoji:"✌️"}
  };

  async function api(path, options = {}) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(),25000);

    try {
      const response = await fetch(API_BASE + path,{
        ...options,
        signal:controller.signal,
        headers:{
          "Content-Type":"application/json",
          "Authorization":"tma " + (tg?.initData || "")
        }
      });

      const data = await response.json();

      if (!data || typeof data !== "object" || Array.isArray(data)) {
        return {ok:false,error:"invalid_response"};
      }

      return response.ok
        ? data
        : {...data,ok:false,error:data.error || "server",http_status:response.status};
    } catch {
      return {ok:false,error:"network"};
    } finally {
      clearTimeout(timeout);
    }
  }

  const post = (path,data = {}) => api(path,{
    method:"POST",
    body:JSON.stringify(data)
  });

  function errorText(code) {
    return ({
      unauthorized:"مینی‌اپ را ببند و دوباره از داخل تلگرام باز کن.",
      not_started:"ابتدا ربات را استارت کن، سپس دوباره وارد شو.",
      zero_balance:"موجودی قابل برداشت شما صفر است.",
      already_pending:"یک برداشت در حال پردازش داری.",
      withdrawal_pending:"بعد از پایان برداشت فعلی دوباره امتحان کن.",
      game_disabled:"بازی فعلاً غیرفعال است.",
      balance_limit_reached:"موجودیت به سقف ۵۰۰ هزار میو رسیده؛ ابتدا برداشت کن. فرصت بازی جدید مصرف نشده است.",
      cooldown:"هنوز زمان بازی بعدی نرسیده است.",
      invalid_target:"آیدی تلگرام معتبر وارد کن.",
      invalid_card:"شماره کارت باید بین ۱۰ تا ۲۰ رقم باشد.",
      database_unavailable:"ارتباط با سرور برقرار نشد؛ دوباره تلاش کن.",
      network:"ارتباط قطع شد؛ دوباره تلاش کن.",
      invalid_response:"پاسخ سرور کامل دریافت نشد.",
      invalid_request_id:"شناسهٔ درخواست معتبر نیست؛ دوباره تلاش کن.",
      bot_username_not_configured:"لینک دعوت هنوز تنظیم نشده است.",
      doz_reward_unconfigured:"بازی دوز هنوز فعال نشده است.",
      doz_cooldown:"پنج فرصت این سری تمام شده؛ منتظر سری بعد بمان.",
      doz_old_request:"درخواست قبلی بسته شده؛ دوباره شروع را بزن.",
      doz_round_changed:"وضعیت بازی تغییر کرده؛ بازیابی بازی را بزن.",
      doz_choice_locked:"انتخاب سنگ‌کاغذ‌قیچی قبلاً ثبت شده است.",
      doz_invalid_choice:"یکی از گزینه‌های سنگ، کاغذ یا قیچی را انتخاب کن.",
      doz_invalid_move:"این حرکت معتبر نیست.",
      doz_stale_move:"وضعیت بازی تغییر کرده؛ بازیابی بازی را بزن.",
      doz_occupied_cell:"این خانه قبلاً انتخاب شده است."
    })[code] || "عملیات انجام نشد؛ دوباره تلاش کن.";
  }

  function fmt(value) {
    return Number(value || 0).toLocaleString("en-US");
  }

  function escapeText(value) {
    const map = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"};
    return String(value ?? "").replace(/[&<>"']/g,ch => map[ch]);
  }

  function icon(name) {
    return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <use href="#i-${name}"></use>
    </svg>`;
  }

  function confirmLabel(text = "تأیید") {
    return `<span class="btn-label">${icon("check")}<span>${text}</span></span>`;
  }

  function englishDigits(value) {
    return value
      .replace(/[۰-۹]/g,d => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
      .replace(/[٠-٩]/g,d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
  }

  function setText(element,value) {
    if (!element) return;
    const text = String(value ?? "");
    if (element.textContent !== text) element.textContent = text;
  }

  function humanDuration(seconds) {
    seconds = Math.max(0,Math.ceil(seconds));
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor(seconds % 3600 / 60);
    const rest = seconds % 60;
    const parts = [];

    if (hours) parts.push(`${hours} ساعت`);
    if (minutes) parts.push(`${minutes} دقیقه`);
    if (rest || !parts.length) parts.push(`${rest} ثانیه`);

    return parts.join(" و ");
  }

  function ensureUserData() {
    if (!hasUserData) {
      showToast("اطلاعات حساب هنوز دریافت نشده؛ بروزرسانی را بزن.");
      return false;
    }
    if (state.not_started) {
      showToast(errorText("not_started"));
      return false;
    }
    return true;
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    setText($("toast"),message);
    $("toast").classList.add("show");
    toastTimer = setTimeout(() => $("toast").classList.remove("show"),5000);
  }

  function tinyHaptic() {
    try { tg?.HapticFeedback?.impactOccurred("light"); } catch {}
  }

  async function copyText(text,button) {
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      if (!button?.isConnected) return;

      button.textContent = "کپی شد ✓";
      button.classList.add("copied");

      setTimeout(() => {
        if (!button.isConnected) return;
        button.textContent = "کپی";
        button.classList.remove("copied");
      },1800);
    } catch {
      showToast("کپی انجام نشد؛ متن را دستی کپی کن.");
    }
  }

  /* ================= Keyboard ================= */

  function setupKeyboard() {
    const viewport = window.visualViewport;
    const nav = $("bottomNav");

    let baseline = Math.max(window.innerHeight,viewport?.height || 0);
    let lastWidth = window.innerWidth;
    let editingSession = false;
    let frame = 0;

    function focusedEditor() {
      const element = document.activeElement;
      if (!(element instanceof HTMLElement)) return null;
      if (element.isContentEditable) return element;

      if (element instanceof HTMLTextAreaElement) {
        return !element.disabled && !element.readOnly ? element : null;
      }

      if (element instanceof HTMLInputElement) {
        const supported = ["text","search","tel","url","email","password","number"];
        return supported.includes(element.type) && !element.disabled && !element.readOnly
          ? element : null;
      }

      return null;
    }

    function availableHeight() {
      if (viewport) return viewport.height;
      const telegramHeight = Number(tg?.viewportHeight);
      return telegramHeight > 0
        ? Math.min(window.innerHeight,telegramHeight)
        : window.innerHeight;
    }

    function scrollEditorIntoView(element) {
      if (!element?.isConnected) return;
      const rect = element.getBoundingClientRect();
      const top = viewport?.offsetTop || 0;
      const bottom = top + availableHeight();
      let delta = 0;

      if (rect.bottom > bottom - 24) delta = rect.bottom - bottom + 24;
      else if (rect.top < top + 18) delta = rect.top - top - 18;

      if (Math.abs(delta) > 1) window.scrollBy({top:delta,behavior:"auto"});
    }

    function update() {
      frame = 0;
      const editor = focusedEditor();
      const height = availableHeight();
      const scale = viewport?.scale || 1;

      if (Math.abs(window.innerWidth-lastWidth) > 80) {
        lastWidth = window.innerWidth;
        baseline = Math.max(
          window.innerHeight,height,Number(tg?.viewportStableHeight) || 0
        );
      }

      if (editor) editingSession = true;

      const shrink = baseline-height;
      const keyboardVisible = editingSession && scale <= 1.05 &&
        shrink > Math.max(110,baseline*.18);
      const hideNav = Boolean(editor) || keyboardVisible;
      const navHidden = hideNav || document.body.classList.contains("doz-focus");

      document.body.classList.toggle("keyboard-open",hideNav);
      nav.inert = navHidden || $("notifOverlay").classList.contains("show");

      if (navHidden) nav.setAttribute("aria-hidden","true");
      else nav.removeAttribute("aria-hidden");

      const offset = Math.max(
        0,window.innerHeight-(height+(viewport?.offsetTop || 0))
      );

      document.documentElement.style.setProperty("--keyboard-offset",`${offset}px`);

      if (!hideNav) {
        editingSession = false;
        baseline = Math.max(window.innerHeight,height);
      }

      if (editor && scale <= 1.05) scrollEditorIntoView(editor);
    }

    function schedule() {
      if (!frame) frame = requestAnimationFrame(update);
    }

    function blur() {
      const editor = focusedEditor();
      if (editor) editor.blur();
      schedule();
      setTimeout(schedule,250);
      setTimeout(schedule,500);
    }

    document.addEventListener("focusin",() => {
      if (!focusedEditor()) return;
      editingSession = true;
      document.body.classList.add("keyboard-open");
      nav.inert = true;
      nav.setAttribute("aria-hidden","true");
      schedule();
      setTimeout(schedule,180);
      setTimeout(schedule,400);
    });

    document.addEventListener("focusout",() => {
      schedule();
      setTimeout(schedule,250);
      setTimeout(schedule,500);
    });

    window.addEventListener("resize",schedule,{passive:true});
    viewport?.addEventListener("resize",schedule,{passive:true});
    viewport?.addEventListener("scroll",schedule,{passive:true});
    try { tg?.onEvent("viewportChanged",schedule); } catch {}

    schedule();
    return {update:schedule,blur};
  }

  const keyboard = setupKeyboard();

  /* ================= Doz viewport ================= */

  function updateDozViewport() {
    if (!document.body.classList.contains("doz-focus")) return;

    const stableHeight = Number(tg?.viewportStableHeight);
    const visualHeight = Number(window.visualViewport?.height);
    const height = stableHeight > 0
      ? stableHeight
      : visualHeight > 0
        ? visualHeight
        : window.innerHeight;

    if (!Number.isFinite(height) || height <= 0) return;

    document.documentElement.style.setProperty(
      "--doz-viewport-height",
      `${Math.floor(height)}px`
    );

    scheduleDozBoardFit();
  }

  function setDozLayout(active) {
    const nav = $("bottomNav");

    if (active && nav.contains(document.activeElement)) {
      document.activeElement.blur();
    }

    document.body.classList.toggle("doz-focus",active);

    const hidden = active || document.body.classList.contains("keyboard-open");
    nav.inert = hidden || $("notifOverlay").classList.contains("show");

    if (hidden) nav.setAttribute("aria-hidden","true");
    else nav.removeAttribute("aria-hidden");

    if (active) {
      updateDozViewport();
      window.scrollTo({top:0,left:0,behavior:"auto"});
      $("viewSection").scrollTop = 0;

      const version = viewVersion;

      requestAnimationFrame(() => {
        if (version !== viewVersion || !currentView.startsWith("doz-")) return;
        window.scrollTo({top:0,left:0,behavior:"auto"});
        $("viewSection").scrollTop = 0;
        scheduleDozBoardFit();
      });
    }

    keyboard.update();
  }

  function fitDozBoard() {
    dozFitFrame = 0;

    if (currentView !== "doz-board") return;

    const area = $("dozBoardArea");
    const shell = $("dozBoardShell");

    if (!area || !shell) return;

    const size = Math.floor(Math.min(area.clientWidth,area.clientHeight));

    if (size <= 0 || shell.dataset.size === String(size)) return;

    shell.dataset.size = String(size);
    shell.style.setProperty("--doz-board-size",`${size}px`);

    const overlay = $("dozWinningLine");

    if (overlay && dozRound?.winning_line?.length) {
      delete overlay.dataset.roundId;
      drawDozWinningLine(dozRound);
    }
  }

  function scheduleDozBoardFit() {
    if (!dozFitFrame) {
      dozFitFrame = requestAnimationFrame(fitDozBoard);
    }
  }

  function observeDozBoard() {
    dozBoardObserver?.disconnect();
    dozBoardObserver = null;

    const area = $("dozBoardArea");
    if (!area) return;

    fitDozBoard();

    if (typeof ResizeObserver === "function") {
      dozBoardObserver = new ResizeObserver(scheduleDozBoardFit);
      dozBoardObserver.observe(area);
    }

    scheduleDozBoardFit();
  }

  /* ================= Appearance ================= */

  const THEME_KEY = `mio_theme_${TG_USER_ID}`;
  const DEFAULT_THEME = {
    bg:"#0d1016",card:"#202027",accent:"#4f8cff",layout:"normal"
  };

  function validHex(value,fallback) {
    return /^#[0-9a-f]{6}$/i.test(String(value || ""))
      ? value.toLowerCase() : fallback;
  }

  function readTheme() {
    try {
      const data = JSON.parse(localStorage.getItem(THEME_KEY) || "{}");
      return data && typeof data === "object" && !Array.isArray(data) ? data : {};
    } catch {
      return {};
    }
  }

  function writeTheme(data) {
    try { localStorage.setItem(THEME_KEY,JSON.stringify(data)); } catch {}
  }

  function rgb(hex) {
    return [1,3,5].map(start => parseInt(hex.slice(start,start+2),16));
  }

  function mixHex(base,ink,fraction) {
    const a = rgb(base);
    const b = rgb(ink);
    return "#" + a.map((value,index) =>
      Math.round(value+(b[index]-value)*fraction).toString(16).padStart(2,"0")
    ).join("");
  }

  function luminance(hex) {
    const values = rgb(hex).map(value => {
      value /= 255;
      return value <= .04045 ? value / 12.92 : ((value+.055)/1.055)**2.4;
    });
    return values[0]*.2126+values[1]*.7152+values[2]*.0722;
  }

  function contrast(a,b) {
    const x = luminance(a);
    const y = luminance(b);
    return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);
  }

  function inkFor(background) {
    return contrast(background,"#000000") > contrast(background,"#ffffff")
      ? "#000000" : "#ffffff";
  }

  function themePalette(raw = {}) {
    const bg = validHex(raw.bg,DEFAULT_THEME.bg);
    const card = validHex(raw.card,DEFAULT_THEME.card);
    const accent = validHex(raw.accent,DEFAULT_THEME.accent);
    const layout = ["normal","compact","list"].includes(raw.layout) ? raw.layout : "normal";
    const defaults = bg === DEFAULT_THEME.bg && card === DEFAULT_THEME.card &&
      accent === DEFAULT_THEME.accent;
    const bright = inkFor(bg) === "#000000";
    const text = defaults ? "#f5f5f7" : inkFor(bg);
    const cardText = inkFor(card);
    const action = bright ? "#141821" : accent;

    return {
      bg,card,accent,layout,bright,defaults,text,
      dim:defaults ? "#b6c8e8" : mixHex(bg,text,.78),
      cardText,
      cardDim:defaults ? "#b6c8e8" : mixHex(card,cardText,.78),
      action,
      actionInk:defaults ? "#ffffff" : inkFor(action),
      highlight:contrast(bg,accent) >= 4.5 ? accent : text,
      balanceInk:defaults ? accent : (contrast(card,accent) >= 4.5 ? accent : cardText),
      cardEnd:defaults ? bg : mixHex(card,bg,.12),
      wash:bright ? "0,0,0" : "255,255,255",
      nav:rgb(bg).join(",")
    };
  }

  function applyTheme(raw = readTheme()) {
    const p = themePalette(raw);
    const root = document.documentElement;
    const properties = {
      "--user-bg":p.bg,
      "--user-card":p.card,
      "--user-accent":p.accent,
      "--text":p.text,
      "--dim":p.dim,
      "--card-text":p.cardText,
      "--card-dim":p.cardDim,
      "--action-bg":p.action,
      "--action-ink":p.actionInk,
      "--highlight":p.highlight,
      "--balance-ink":p.balanceInk,
      "--card-end":p.cardEnd,
      "--wash":p.wash,
      "--nav-rgb":p.nav,
      "--border":`rgba(${p.wash},${p.bright ? ".18" : ".10"})`,
      "--danger":p.bright ? "#a20d2c" : "#ff8585",
      "--success":p.bright ? "#09633c" : "#93d8ba"
    };

    Object.entries(properties).forEach(([key,value]) => root.style.setProperty(key,value));
    root.style.colorScheme = p.bright ? "light" : "dark";
    document.body.dataset.bright = String(p.bright);
    document.body.classList.remove("theme-light");
    document.body.classList.toggle("layout-compact",p.layout === "compact");
    document.body.classList.toggle("layout-list",p.layout === "list");
    document.querySelector('meta[name="theme-color"]').setAttribute("content",p.bg);
  }

  function setBalance(value) {
    if (value == null || !Number.isFinite(Number(value))) return;
    const target = Number(value);
    state.balance = target;
    cancelAnimationFrame(balanceFrame);
    syncWithdrawHub();
    setText($("profileBalance"),`${fmt(target)} Mio`);

    if (currentView === "game") updateGameControls();

    if (reduceMotion.matches || displayedBalance === target) {
      displayedBalance = target;
      setText($("balanceValue"),fmt(target));
      return;
    }

    const from = displayedBalance;
    const started = performance.now();

    function tick(now) {
      const progress = reduceMotion.matches ? 1 : Math.min((now-started)/850,1);
      displayedBalance = from+(target-from)*(1-Math.pow(1-progress,4));
      setText($("balanceValue"),fmt(progress === 1 ? target : Math.round(displayedBalance)));
      if (progress < 1) balanceFrame = requestAnimationFrame(tick);
    }

    balanceFrame = requestAnimationFrame(tick);
  }

  /* ================= Stable pending cards ================= */

  const pendingNodes = new Map();

  function normalizeWithdrawal(value,previous) {
    const next = {...previous,...value};
    next.method = next.withdraw_type
      ? (next.withdraw_type === "card" ? "bank" : "id")
      : (next.method === "bank" ? "bank" : "id");

    if (Number.isFinite(Number(value.wait_seconds)) && value.wait_seconds !== null) {
      const estimate = performance.now()+Math.max(0,Number(value.wait_seconds))*1000;
      const oldDeadline = previous?.etaDeadline;
      next.etaDeadline = Number.isFinite(oldDeadline) && Math.abs(estimate-oldDeadline) < 1500
        ? oldDeadline : estimate;
    } else if (!Number.isFinite(next.etaDeadline)) {
      next.etaDeadline = null;
    }
    return next;
  }

  function pendingSeconds(item) {
    return Number.isFinite(item?.etaDeadline)
      ? Math.max(0,Math.ceil((item.etaDeadline-performance.now())/1000)) : null;
  }

  function pendingClockText(item) {
    if (item.processing) return "در حال پردازش واریز";
    const seconds = pendingSeconds(item);
    if (seconds === null) return item.wait_text || "در انتظار بروزرسانی زمان";
    return seconds > 0
      ? `حدود ${humanDuration(seconds)} تا نوبت پردازش`
      : "نوبت پردازش نزدیک است؛ در انتظار بروزرسانی";
  }

  function createPendingCard(key) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "pending-item";
    button.dataset.withdrawId = key;

    button.innerHTML = `
      <span class="pending-head">
        <strong data-part="method"></strong><b data-part="amount"></b>
      </span>
      <span class="pending-meta">
        <span data-part="status"></span><span data-part="position"></span>
      </span>
      <span class="pending-clock" data-part="clock"></span>

        برای دیدن جزئیات بزن؛ نیازی به ماندن در صفحهٔ صف نیست.
      </small>
    `;

    const parts = Object.fromEntries(
      [...button.querySelectorAll("[data-part]")].map(element => [element.dataset.part,element])
    );

    button.onclick = () => {
      const item = state.pending_withdrawals.find(value => String(value.withdraw_id) === key);
      if (!item) return;

      if (!activeWithdrawal || String(activeWithdrawal.withdraw_id) !== key) {
        activeWithdrawal = {...item,phase:"pending"};
      }

      lastWithdrawMethod = activeWithdrawal.method;
      viewActiveWithdrawal();
    };

    return {button,parts};
  }

  function renderWithdrawDashboard() {
    setText($("withdrawnTodayValue"),hasUserData ? fmt(state.withdrawn_today) : "—");

    const total = state.pending_withdrawals.reduce(
      (sum,item) => sum+(Number(item.amount)||0),0
    );

    setText($("pendingTotalValue"),hasUserData ? fmt(total) : "—");
    setText($("pendingCountText"),`${state.pending_withdrawals.length} درخواست در صف`);

    const list = $("pendingList");
    const keys = new Set(state.pending_withdrawals.map(item => String(item.withdraw_id)));

    for (const [key,node] of pendingNodes) {
      if (!keys.has(key)) {
        node.button.remove();
        pendingNodes.delete(key);
      }
    }

    state.pending_withdrawals.forEach((item,index) => {
      const key = String(item.withdraw_id);
      let node = pendingNodes.get(key);

      if (!node) {
        node = createPendingCard(key);
        pendingNodes.set(key,node);
      }

      const current = list.children[index];
      if (current !== node.button) list.insertBefore(node.button,current || null);

      setText(node.parts.method,item.method === "bank" ? "🏦 بانک میویی" : "📤 برداشت با آیدی");
      setText(node.parts.amount,`${fmt(item.amount)} میو`);
      setText(node.parts.status,item.processing ? "در حال برداشت" : "در صف برداشت");
      setText(node.parts.position,Number(item.position) > 0
        ? `نفر ${item.position} در صف` : "در حال بررسی");
      setText(node.parts.clock,pendingClockText(item));
    });

    $("homeReceiptBtn").hidden = !state.notifications.some(item => item.type === "success");
    syncWithdrawHub();

  function updatePendingClocks() {
    for (const item of state.pending_withdrawals) {
      const node = pendingNodes.get(String(item.withdraw_id));
      if (node) setText(node.parts.clock,pendingClockText(item));
    }
  }

  function upsertPendingWithdrawal(value) {
    if (!value.withdraw_id || finishedWithdrawals.has(String(value.withdraw_id))) return;
    const index = state.pending_withdrawals.findIndex(
      item => String(item.withdraw_id) === String(value.withdraw_id)
    );
    const previous = index >= 0 ? state.pending_withdrawals[index] : activeWithdrawal;
    const next = normalizeWithdrawal(value,previous);

    if (index >= 0) state.pending_withdrawals[index] = next;
    else state.pending_withdrawals.push(next);

    if (activeWithdrawal && String(activeWithdrawal.withdraw_id) === String(next.withdraw_id)) {
      Object.assign(activeWithdrawal,next,{phase:"pending"});
    }

    renderWithdrawDashboard();
  }

  function removePendingWithdrawal(id) {
    finishedWithdrawals.add(String(id));

    if (finishedWithdrawals.size > 100) {
      finishedWithdrawals.delete(finishedWithdrawals.values().next().value);
    }

    state.pending_withdrawals = state.pending_withdrawals.filter(
      item => String(item.withdraw_id) !== String(id)
    );

    renderWithdrawDashboard();
  }

  function viewActiveWithdrawal() {
    if (activeWithdrawal?.phase === "unknown") return viewWithdrawUnknown();

  async function startWithdrawal(method,value) {
    if (activeWithdrawal) return viewActiveWithdrawal();

    const job = {
      method,phase:"submitting",withdraw_id:null,
      amount:state.balance,withdraw_type:method === "bank" ? "card" : "id"
    };

    activeWithdrawal = job;
    lastWithdrawMethod = method;
    viewWithdrawWaiting();

    const result = await post(
      method === "bank" ? "/withdraw-bank" : "/withdraw",
      method === "bank" ? {card:value} : {target:value}
    );

    if (activeWithdrawal !== job) return;

    if (result.ok || result.error === "already_pending") {
      Object.assign(job,normalizeWithdrawal(result,job),{phase:"pending"});
      upsertPendingWithdrawal(job);
      if (currentView === "withdraw-waiting") {
        updateWaitingInfo(job);
        armBankAutoReturn();
      }
      pollWithdrawStatus();
      return;
    }

    if (["network","invalid_response","database_unavailable","server"].includes(result.error)) {
      job.phase = "unknown";
      if (isWithdrawalView()) viewWithdrawUnknown();
      else showToast("وضعیت برداشت مشخص نشد؛ دوباره بررسی کن.");
      return;
    }

    activeWithdrawal = null;
    if (isWithdrawalView()) viewWithdrawFailed(errorText(result.error));
    else showToast(errorText(result.error));
  }

  async function pollWithdrawStatus() {
    if (pollingWithdrawal || !activeWithdrawal) return;
    const job = activeWithdrawal;
    pollingWithdrawal = true;
    job.phase = "pending";

    try {
      while (activeWithdrawal === job) {
        await new Promise(resolve => setTimeout(resolve,3000));
        if (activeWithdrawal !== job) return;

        if (!job.withdraw_id) {
          const user = await api("/user");
          if (activeWithdrawal !== job) return;

          if (user.pending_withdrawal?.withdraw_id) {
            Object.assign(job,normalizeWithdrawal(user.pending_withdrawal,job),{phase:"pending"});
            upsertPendingWithdrawal(job);
            if (currentView === "withdraw-waiting") armBankAutoReturn();
          } else if (user.error && user.error !== "unauthorized") {
            continue;
          } else {
            job.phase = "unknown";
            if (isWithdrawalView()) viewWithdrawUnknown();
            if (user.error) showToast(errorText(user.error));
            return;
          }
        }

        const result = await api(
          "/withdraw-status?withdraw_id="+encodeURIComponent(job.withdraw_id)
        );

        if (activeWithdrawal !== job) return;

        if (result.status === "success" || result.status === "failed") {
          const success = result.status === "success";
          activeWithdrawal = null;
          removePendingWithdrawal(job.withdraw_id);
          clearBankTimers();

          if (isWithdrawalView()) {
            success ? viewWithdrawSuccess() : viewWithdrawFailed();
          } else {
            showToast(success
              ? `🎉 برداشت ${fmt(job.amount)} میو با موفقیت انجام شد.`
              : "برداشت ناموفق بود.");
          }

          await refreshData(false);
          return;
        }

        if (result.status === "pending") {
          Object.assign(job,normalizeWithdrawal(result,job),{phase:"pending"});
          upsertPendingWithdrawal(job);
          if (currentView === "withdraw-waiting") updateWaitingInfo(job);
        } else if (result.error === "unauthorized" || result.status === "none") {
          job.phase = "unknown";
          if (isWithdrawalView()) viewWithdrawUnknown();
          if (result.error) showToast(errorText(result.error));
          return;
        } else if (currentView === "withdraw-waiting") {
          setText($("queueWaitText"),"ارتباط موقتاً قطع شده؛ در حال بررسی دوباره…");
        }
      }
    } finally {
      pollingWithdrawal = false;
      if (activeWithdrawal && activeWithdrawal !== job && activeWithdrawal.phase === "pending") {
        pollWithdrawStatus();
      }
    }
  }

  /* ================= Casino state / recovery ================= */

  const GAME_PENDING_KEY = `mio_game_pending_${TG_USER_ID}`;
  let pendingGameMemory = "";

  function getPendingGame() {
    try { return localStorage.getItem(GAME_PENDING_KEY) || pendingGameMemory; }
    catch { return pendingGameMemory; }
  }

  function savePendingGame(id) {
    pendingGameMemory = id;
    try { localStorage.setItem(GAME_PENDING_KEY,id); } catch {}
  }

  function clearPendingGame(id) {
    if (pendingGameMemory === id) pendingGameMemory = "";
    try {
      if (localStorage.getItem(GAME_PENDING_KEY) === id) localStorage.removeItem(GAME_PENDING_KEY);
    } catch {}
  }

  function makeRequestId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    bytes[6] = (bytes[6]&15)|64;
    bytes[8] = (bytes[8]&63)|128;
    const hex = [...bytes].map(value => value.toString(16).padStart(2,"0"));
    return [hex.slice(0,4),hex.slice(4,6),hex.slice(6,8),hex.slice(8,10),hex.slice(10)]
      .map(part => part.join("")).join("-");
  }

  function acceptGameState(data) {
    gameState = {
      ...gameState,...data,
      deadline:performance.now()+Math.max(0,Number(data.remaining_seconds)||0)*1000
    };
    if (data.round && !data.last_round) gameState.last_round = data.round;
  }

  function remainingGameSeconds() {
    return gameState ? Math.max(0,Math.ceil((gameState.deadline-performance.now())/1000)) : 0;
  }

  function formatCountdown(seconds) {
    return [Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60]
      .map(value => String(value).padStart(2,"0")).join(":");
  }

  function gameBalanceCap() {
    const cap = Number(gameState?.balance_cap);
    return Number.isFinite(cap) && cap > 0 ? cap : DEFAULT_BALANCE_CAP;
  }

  function gameBalanceLimitReached() {
    return Number(state.balance) >= gameBalanceCap();
  }

  function canStartGame() {
    return Boolean(gameState?.enabled && !gameState.withdrawal_pending &&
      !gameBalanceLimitReached() && remainingGameSeconds() === 0);
  }

  function validGameSymbols(symbols) {
    return Array.isArray(symbols) && symbols.length === 3 &&
      symbols.every(symbol => SYMBOL_KEYS.includes(symbol));
  }

  function lastGameSymbols() {
    const symbols = gameState?.last_round?.symbols;
    return validGameSymbols(symbols) ? symbols : ["seven","grape","lemon"];
  }

  function symbolHTML(symbol) {
    const key = SYMBOL_KEYS.includes(symbol) ? symbol : "blank";
    return `<span class="slot-symbol symbol-${key}">${GAME_SYMBOLS[key]}</span>`;
  }

  function reelCell(symbol,height) {
    const size = Number.isFinite(height) && height > 0 ? ` style="height:${height}px"` : "";
    return `<span class="reel-cell"${size}>${symbolHTML(symbol)}</span>`;
  }

    if (!ensureUserData()) return;
    const version = showView("game","کازینو میویی");

    if (gameBusy && gameState) {
      renderGame();
      return;
    }

    paint(`<div class="spinner" aria-hidden="true"></div>
      <p class="muted-center" role="status">در حال دریافت وضعیت بازی…</p>`);

    const result = await api("/game/status");
    if (version !== viewVersion) return;

    if (!result.ok) {
      paint(`
        <p class="muted-center" id="gameLoadError"></p>

  /* ================= Reel / lever animation ================= */

  function startReelAnimation(pullLever = true) {
    const machine = $("slotMachine");
    const lever = $("leverArm");
    const started = performance.now();
    let disposed = false;
    let leverAnimation = null;

    const reels = [0,1,2].map(index => {
      const box = $("reel"+index);
      const track = $("reelTrack"+index);
      const initial = SYMBOL_KEYS.includes(track?.dataset.symbol)
        ? track.dataset.symbol : SYMBOL_KEYS[index];
      const first = SYMBOL_KEYS.indexOf(initial);
      const cycle = SYMBOL_KEYS.map((_,offset) => SYMBOL_KEYS[(first+offset)%SYMBOL_KEYS.length]);

      return {
        box,track,initial,cycle,height:box?.clientHeight || 104,
        duration:440+index*85,animation:null,settled:false
      };
    });

    const supportsAnimation = typeof reels[0]?.track?.animate === "function";
    machine?.classList.remove("winner");
    machine?.classList.add("is-spinning");

    if (!reduceMotion.matches && supportsAnimation) {
      reels.forEach(reel => {
        if (!reel.track) return;
        const sequence = [...reel.cycle,reel.cycle[0],reel.cycle[1]];
        reel.track.innerHTML = sequence.map(symbol => reelCell(symbol,reel.height)).join("");
        reel.box?.classList.add("rolling");

        reel.animation = reel.track.animate([
          {transform:"translate3d(0,0,0)"},
          {transform:`translate3d(0,${-reel.cycle.length*reel.height}px,0)`}
        ],{duration:reel.duration,iterations:Infinity,easing:"linear"});
      });

      if (pullLever && lever?.animate) {
        leverAnimation = lever.animate([
          {transform:"rotate(8deg) scaleY(1)",offset:0},
          {transform:"rotate(18deg) scaleY(.43)",offset:.4},
          {transform:"rotate(18deg) scaleY(.43)",offset:.56},
          {transform:"rotate(4deg) scaleY(1.02)",offset:.9},
          {transform:"rotate(8deg) scaleY(1)",offset:1}
        ],{duration:760,easing:"cubic-bezier(.4,0,.2,1)"});
      }
    }

    function staticSymbol(reel,symbol) {
      if (!reel.track) return;
      reel.animation?.cancel();
      reel.animation = null;
      reel.track.innerHTML = reelCell(symbol,reel.height);
      reel.track.style.transform = "";
      reel.track.dataset.symbol = symbol;
      reel.box?.classList.remove("rolling");
      reel.settled = true;
    }

    function stop() {
      if (disposed) return;
      disposed = true;
      leverAnimation?.cancel();

      reels.forEach(reel => {
        reel.animation?.cancel();
        reel.animation = null;
        if (!reel.settled) staticSymbol(reel,reel.initial);
        reel.box?.classList.remove("rolling");
      });

      machine?.classList.remove("is-spinning");
    }

    async function finishOne(reel,index,finalSymbol) {
      if (disposed || !reel.track?.isConnected) return;
      if (reduceMotion.matches || !supportsAnimation) {
        staticSymbol(reel,finalSymbol);
        return;
      }

      const currentTime = Number(reel.animation?.currentTime) || 0;
      const progress = ((currentTime%reel.duration)+reel.duration)%reel.duration/reel.duration;
      const offset = progress*reel.cycle.length*reel.height;
      const whole = Math.floor(offset/reel.height);
      const fractional = offset/reel.height-whole;
      const landingIndex = 12+index*3;
      const sequence = [];

      for (let row=0;row<landingIndex;row++) {
        sequence.push(reel.cycle[(whole+row)%reel.cycle.length]);
      }

      sequence.push(finalSymbol);
      sequence.push(reel.cycle[(whole+landingIndex+1)%reel.cycle.length]);
      reel.animation?.cancel();
      reel.track.innerHTML = sequence.map(symbol => reelCell(symbol,reel.height)).join("");

      reel.animation = reel.track.animate([
        {transform:`translate3d(0,${-fractional*reel.height}px,0)`},
        {transform:`translate3d(0,${-landingIndex*reel.height}px,0)`}
      ],{
        duration:1050+index*290,
        easing:"cubic-bezier(.12,.72,.15,1)",
        fill:"forwards"
      });

      try { await reel.animation.finished; } catch { return; }
      if (disposed || !reel.track.isConnected) return;
      staticSymbol(reel,finalSymbol);
      tinyHaptic();
    }

    async function finish(symbols) {
      if (disposed || !validGameSymbols(symbols)) return;
      if (!reduceMotion.matches && supportsAnimation) {
        const remaining = 1100-(performance.now()-started);
        if (remaining > 0) await new Promise(resolve => setTimeout(resolve,remaining));
      }
      if (disposed) return;

      await Promise.all(reels.map((reel,index) => finishOne(reel,index,symbols[index])));
      if (!disposed) machine?.classList.remove("is-spinning");
    }

    return {stop,finish};
  }

  async function playGame() {
    if (gameBusy) return;
    let id = getPendingGame();

    if (!id && gameBalanceLimitReached()) {
      updateGameControls();
      showToast(errorText("balance_limit_reached"));
      return;
    }
    if (!id && !canStartGame()) return;

    if (!id) {
      try { id = makeRequestId(); }
      catch {
        showToast("برای بازی، مینی‌اپ را داخل تلگرام باز کن.");
        return;
      }
      savePendingGame(id);
    }

    gameBusy = true;
    let completed = false;
    syncGamePresentation();
    updateGameControls();
    stopGameVisual();

    if (currentView === "game" && !document.hidden && !gameBalanceLimitReached()) {
      activeGameAnimation = startReelAnimation(true);
    }

    tinyHaptic();

    try {
      const result = await post("/game/play",{request_id:id});

      if (result.ok && result.round && validGameSymbols(result.round.symbols)) {
        acceptGameState(result);
        const animation = activeGameAnimation;

        if (animation && currentView === "game" && !document.hidden) {
          try { await animation.finish(result.round.symbols); }
          catch { animation.stop(); }
        }

        clearPendingGame(id);
        setBalance(result.balance);
        completed = true;
        const reward = Number(result.round.reward)||0;

        showToast(result.replayed
          ? `نتیجهٔ ثبت‌شده بازی: ${fmt(reward)} میو`
          : result.round.reward_capped
            ? `🎉 ${fmt(reward)} میو واریز شد؛ موجودیت به سقف ${fmt(gameBalanceCap())} رسید.`
            : reward > 0
              ? `🎉 ${fmt(reward)} میو به موجودیت اضافه شد!`
              : "این بار پوچ شد؛ دفعهٔ بعد دوباره امتحان کن 🍀");
        return;
      }

      if (["cooldown","withdrawal_pending","game_disabled","balance_limit_reached",
           "not_started","invalid_request_id"].includes(result.error)) {
        clearPendingGame(id);
      }

      if (typeof result.remaining_seconds === "number") {
        acceptGameState(result);
        setBalance(result.balance);
      }

      showToast(errorText(result.ok ? "invalid_response" : result.error));
    } finally {
      stopGameVisual();
      gameBusy = false;
      if (currentView === "game") {
        syncGamePresentation(completed);
        updateGameControls();
      }
    }
  }

  /* ================= Doz state / recovery ================= */

  function getPendingDoz() {
    try { return localStorage.getItem(DOZ_PENDING_KEY) || dozStartMemory; }
    catch { return dozStartMemory; }
  }

  function savePendingDoz(id) {
    dozStartMemory = id;
    try { localStorage.setItem(DOZ_PENDING_KEY,id); } catch {}
  }

  function clearPendingDoz() {
    dozStartMemory = "";
    try { localStorage.removeItem(DOZ_PENDING_KEY); } catch {}
  }

  function acceptDozState(result) {
    if (!result || !Number.isInteger(result.remaining_rounds)) return false;
    dozState = result;
    dozDeadline = performance.now()+Math.max(0,Number(result.remaining_seconds)||0)*1000;
    setBalance(result.balance);

    if (result.round?.id === getPendingDoz()) clearPendingDoz();
    return true;
  }

  function hasActiveDoz() {
    return Boolean(dozState?.round && dozState.round.phase !== "finished");
  }

  function dozSeconds() {
    return Math.max(0,Math.ceil((dozDeadline-performance.now())/1000));
  }

  function dozLobbyMessage() {
    if (hasActiveDoz()) return "بازی نیمه‌تمامت ذخیره شده؛ از همان‌جا ادامه بده.";
    if (!dozState.reward_configured) return "بازی دوز هنوز فعال نشده است.";
    if (dozState.withdrawal_pending) return "پس از پایان برداشت فعلی می‌توانی بازی کنی.";
    if (Number(dozState.balance) >= Number(dozState.balance_cap)) return "موجودیت به سقف رسیده؛ ابتدا برداشت کن.";
    if (dozState.remaining_rounds === 0) return "این سری تمام شد؛ پس از پایان تایمر پنج فرصت تازه داری.";
    return "برای شروع بازی روی دکمهٔ شروع بزن.";
  }

    if (!ensureUserData()) return;
    const version = showView(kind === "intro" ? "doz-intro" : "doz-board","بازی دوز");

      <div class="spinner" aria-hidden="true"></div>

    const result = await api("/doz/status");

    if (!result.ok || !acceptDozState(result)) {
      paint(`<section class="doz-root">
        <p class="muted-center" id="dozLoadError"></p>
        <button type="button" class="primary-btn" id="dozReload">تلاش دوباره</button>
        <button type="button" class="ghost-btn" id="dozLoadBack">بازگشت به بازی‌ها</button>
      </section>`);
      $("dozLoadError").textContent = errorText(result.error || "invalid_response");
      $("dozReload").onclick = () => loadDoz(kind);
      $("dozLoadBack").onclick = viewGamesHub;
      return;
    }

    dozUncertain = false;

    if (kind === "intro") return renderDozIntro();

    if (dozState.round?.phase === "finished" &&
        !dozCelebrated.has(dozState.round.id)) {
      renderDozArena(dozState.round);
      finishDozRound(dozState.round);
      return;
    }

    if (!hasActiveDoz() && dozState.remaining_rounds === 0) return viewDozIntro();

    renderDozArena(hasActiveDoz() ? dozState.round : null);
