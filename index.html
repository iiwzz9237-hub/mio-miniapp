          <path class="doz-stroke" d="M19 19L61 61" pathLength="1"></path>
          <path class="doz-stroke second" d="M61 19L19 61" pathLength="1"></path>
        </svg>`;
  }

  function setDozCell(index,mark) {
    const cell = $("dozCell"+index);
    if (!cell || !mark || cell.dataset.mark === mark) return;
    cell.dataset.mark = mark;
    cell.innerHTML = dozMark(mark);
    cell.setAttribute("aria-label",
      `ردیف ${Math.floor(index/3)+1}، ستون ${index%3+1}، `+
      (mark === "O" ? "دایرهٔ شما" : "ضربدر هوش مصنوعی"));
  }

  function drawDozWinningLine(round) {
    const overlay = $("dozWinningLine");
    const line = round?.winning_line;
    if (!overlay) return;

    if (!Array.isArray(line) || line.length !== 3) {
      overlay.replaceChildren();
      delete overlay.dataset.roundId;
      return;
    }

    if (overlay.dataset.roundId === round.id) return;

    const board = $("dozBoard").getBoundingClientRect();
    const first = $("dozCell"+line[0]).getBoundingClientRect();
    const last = $("dozCell"+line[2]).getBoundingClientRect();
    if (!board.width || !board.height) return;

    const x1 = (first.left+first.width/2-board.left)/board.width*100;
    const y1 = (first.top+first.height/2-board.top)/board.height*100;
    const x2 = (last.left+last.width/2-board.left)/board.width*100;
    const y2 = (last.top+last.height/2-board.top)/board.height*100;

    overlay.dataset.roundId = round.id;
    overlay.innerHTML = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" pathLength="1"></line>`;
  }

  function dozResultTitle(round) {
    return round.outcome === "human" ? "بردی! 🎉" : round.outcome === "ai" ? "باختی 😔" : "مساوی شد! 🤝";
  }

  function dozRewardNote(round) {
    if (round.reward_capped) {
      return `به‌دلیل سقف موجودی، ${fmt(round.reward)} میو از جایزهٔ ${fmt(round.nominal_reward)} میویی واریز شد.`;
    }
    if (round.reward > 0) return "جایزه به موجودی قابل برداشتت اضافه شد.";
    return round.outcome === "ai" ? "این دست جایزه‌ای نداشت." : "نتیجهٔ این دست ثبت شد.";
  }

  function renderDozArena(round) {
    dozRound = round;

    paint(`
      <section class="doz-root doz-arena" id="dozArena">
        <span class="doz-kicker">MIO • DUEL</span>
        <div class="doz-players">
          <div class="doz-player">
            <b aria-hidden="true">○</b><div><strong>شما</strong><small>همیشه دایره</small></div>
          </div>
          <div class="doz-player ai">
            <b aria-hidden="true">×</b><div><strong>هوش مصنوعی</strong><small>همیشه ضربدر</small></div>
          </div>
        </div>
        <div class="doz-status-slot">
          <div class="doz-turn" id="dozTurn" role="status" aria-live="polite"></div>
          <div class="doz-reward" id="dozRewardBox" hidden>
            <strong id="dozRewardAmount"></strong><p id="dozRewardNote"></p>
          </div>
        </div>
        <div class="doz-board-area" id="dozBoardArea">
          <div class="doz-board-shell" id="dozBoardShell">
            <div class="doz-board" id="dozBoard" role="group" aria-label="صفحهٔ دوز سه در سه">
              ${Array.from({length:9},(_,index) => `
                <button type="button" class="doz-cell" id="dozCell${index}"
                  aria-label="ردیف ${Math.floor(index/3)+1}، ستون ${index%3+1}، خالی" disabled></button>
              `).join("")}
            </div>
            <svg class="doz-win-overlay" id="dozWinningLine"
              viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          </div>
        </div>
        <div class="doz-quota">
          <span>فرصت‌های شروع باقی‌مانده</span><b id="dozQuota"></b>
        </div>
        <div class="doz-arena-actions">
          <div class="doz-primary-slot">
            <button type="button" class="primary-btn" id="dozStart">شروع</button>
            <button type="button" class="primary-btn" id="dozAgain" hidden>بازی دوباره</button>
          </div>
          <div class="doz-secondary-actions">
            <button type="button" class="ghost-btn" id="dozArenaRefresh">بروزرسانی و بازیابی بازی</button>
            <button type="button" class="ghost-btn" id="dozArenaBack">بازگشت به صفحهٔ دوز</button>
          </div>
        </div>
      </section>
    `);

    for (let index=0;index<9;index++) {
      $("dozCell"+index).onclick = () => playDozCell(index);
    }

    $("dozStart").onclick = () => {
      if (dozRound?.phase === "rps") openDozRps();
      else startDozRound();
    };

    $("dozAgain").onclick = () => {
      if (dozState.remaining_rounds > 0) renderDozArena(null);
      else viewDozIntro();
    };

    $("dozArenaRefresh").onclick = viewDozArena;
    $("dozArenaBack").onclick = viewDozIntro;

    if (round) {
      round.board.forEach((mark,index) => setDozCell(index,mark));
    }

    syncDozArena();
    observeDozBoard();

    if (round) drawDozWinningLine(round);
  }

  function syncDozArena() {
    if (currentView !== "doz-board" || !$("dozBoard")) return;
    const round = dozRound;
    const playing = round?.phase === "playing";
    const finished = round?.phase === "finished";
    const rps = round?.phase === "rps";
    const blocked = dozBusy || dozUncertain || dozCelebrating ||
      Boolean(dozState.withdrawal_pending);

    $("dozArena").classList.toggle("is-finished",Boolean(finished));
    setText($("dozQuota"),`${dozState.remaining_rounds} از ۵`);
    $("dozBoard").setAttribute("aria-busy",String(dozBusy));

    for (let index=0;index<9;index++) {
      $("dozCell"+index).disabled = blocked || !playing || Boolean(round?.board[index]);
    }

    $("dozStart").hidden = Boolean(playing || finished);
    $("dozStart").disabled = blocked || (!rps && !dozState.can_start);
    setText($("dozStart"),rps ? "ادامهٔ سنگ‌کاغذ‌قیچی" : "شروع");

    $("dozAgain").hidden = !finished;
    $("dozAgain").disabled = dozBusy || dozCelebrating || dozUncertain;
    setText($("dozAgain"),dozState.remaining_rounds > 0
      ? `بازی دوباره • ${dozState.remaining_rounds} فرصت`
      : "مشاهدهٔ زمان سری بعد");

    $("dozArenaRefresh").disabled = dozBusy || dozCelebrating;
    $("dozRewardBox").hidden = !finished;

    if ($("dozResultConfirm")) {
      $("dozResultConfirm").disabled = dozBusy;
    }

    if (dozUncertain) {
      setText($("dozTurn"),"وضعیت حرکت نیاز به بررسی دارد؛ بازیابی بازی را بزن.");
    } else if (finished) {
      setText($("dozTurn"),dozResultTitle(round));
      setText($("dozRewardAmount"),`${fmt(round.reward)} میو`);
      setText($("dozRewardNote"),dozRewardNote(round));
    } else if (dozBusy) {
      setText($("dozTurn"),"در حال بررسی حرکت…");
    } else if (dozState.withdrawal_pending) {
      setText($("dozTurn"),"بازی ذخیره شده؛ پس از پایان برداشت ادامه بده.");
    } else if (!round) {
      setText($("dozTurn"),dozState.can_start
        ? "روی دکمهٔ شروع بزن تا بازی شروع شود!" : dozLobbyMessage());
    } else if (rps) {
      setText($("dozTurn"),"شروع‌کننده را با سنگ‌کاغذ‌قیچی مشخص کن.");
    } else {
      setText($("dozTurn"),"نوبت شماست؛ یک خانه را انتخاب کن.");
    }

    syncDozRps();
  }

  async function runDozAction(action,payload,onSuccess) {
    if (dozBusy || dozUncertain) return;

    const version = viewVersion;
    dozBusy = true;
    syncDozArena();

    try {
      const result = await post("/doz/"+action,payload);

      if (version !== viewVersion) {
        if (currentView.startsWith("doz-")) dozUncertain = true;
        return;
      }

      const accepted = acceptDozState(result);

      if (!result.ok || !accepted) {
        const definiteStartError = [
          "doz_old_request","invalid_request_id","not_started",
          "balance_limit_reached","withdrawal_pending",
          "doz_reward_unconfigured","doz_cooldown"
        ].includes(result.error);

        if (action === "start" && definiteStartError) clearPendingDoz();

        dozUncertain = !definiteStartError;
        closeDozRps();
        showToast(errorText(result.error || "invalid_response"));
        return;
      }

      if (action === "start") clearPendingDoz();
      await onSuccess(result,version);
    } catch {
      if (version === viewVersion) {
        dozUncertain = true;
        closeDozRps();
        showToast("برای بررسی نتیجه، بازیابی بازی را بزن.");
      }
    } finally {
      dozBusy = false;
      if (currentView === "doz-board") {
        panel.querySelectorAll(".doz-cell.pending").forEach(cell => cell.classList.remove("pending"));
        syncDozArena();

        if ($("dozFinale")?.open) {
          $("dozResultConfirm")?.focus({preventScroll:true});
        }
      }
    }
  }

  async function startDozRound() {
    let id = getPendingDoz();

    if (!id) {
      try { id = makeRequestId(); }
      catch {
        showToast("مینی‌اپ را داخل تلگرام باز کن.");
        return;
      }
      savePendingDoz(id);
    }

    await runDozAction("start",{request_id:id},async result => {
      renderDozArena(result.round);
      if (result.round?.phase === "rps") openDozRps();
      else if (result.round?.phase === "finished") finishDozRound(result.round);
    });
  }

  /* ================= Rock / paper / scissors ================= */

  function closeDozRps() {
    if (dozRpsCountdownCancel) dozRpsCountdownCancel();

    const dialog = $("dozRpsDialog");
    if (!dialog) return;

    if (dialog.open) dialog.close();
    dialog.remove();
  }

  function waitDozRpsResult(dialog,version) {
    if (dozRpsCountdownCancel) dozRpsCountdownCancel();

    return new Promise(resolve => {
      let remaining = DOZ_RPS_RESULT_MS;
      let lastTime = performance.now();
      let wasVisible = !document.hidden;
      let settled = false;
      let timer = null;

      function finish(completed) {
        if (settled) return;
        settled = true;

        clearInterval(timer);
        document.removeEventListener("visibilitychange",onVisibility);

        if (dozRpsCountdownCancel === cancel) {
          dozRpsCountdownCancel = null;
        }

        resolve(completed);
      }

      function cancel() {
        finish(false);
      }

      function showRemaining() {
        const seconds = Math.max(0,Math.ceil(remaining/1000));
        setText($("dozRpsCountdown"),seconds.toLocaleString("fa-IR"));
      }

      function tick() {
        if (version !== viewVersion || !dialog.isConnected || !dialog.open) {
          finish(false);
          return;
        }

        const now = performance.now();
        const visible = !document.hidden;

        if (visible && wasVisible) {
          remaining = Math.max(0,remaining-(now-lastTime));
        }

        lastTime = now;
        wasVisible = visible;
        showRemaining();

        if (remaining <= 0 && visible) finish(true);
      }

      function onVisibility() {
        lastTime = performance.now();
        wasVisible = !document.hidden;
      }

      dozRpsCountdownCancel = cancel;
      showRemaining();

      document.addEventListener("visibilitychange",onVisibility);
      timer = setInterval(tick,100);
    });
  }

  function syncDozRps() {
    const dialog = $("dozRpsDialog");
    if (!dialog) return;

    const resultShown = dialog.dataset.result === "true";
    dialog.querySelectorAll("[data-rps]").forEach(button => {
      button.disabled = dozBusy || resultShown;
    });

    $("dozRpsConfirm").disabled = dozBusy || resultShown ||
      !dialog.dataset.choice || dozUncertain || Boolean(dozState.withdrawal_pending);
    $("dozRpsCancel").disabled = dozBusy || resultShown;
  }

  function openDozRps() {
    if (dozRound?.phase !== "rps") return;
    closeDozRps();

    const dialog = document.createElement("dialog");
    dialog.id = "dozRpsDialog";
    dialog.className = "doz-dialog";
    dialog.dir = "rtl";
    dialog.setAttribute("aria-labelledby","dozRpsTitle");

    dialog.innerHTML = `
      <h2 id="dozRpsTitle">سنگ، کاغذ، قیچی</h2>
      <p>هرکس برنده شود، دوز را شروع می‌کند. یکی را انتخاب کن و تأیید را بزن.</p>
      <div class="doz-rps-options" role="group" aria-label="انتخاب سنگ‌کاغذ‌قیچی">
        ${Object.entries(RPS).map(([key,value]) => `
          <button type="button" class="doz-rps-option" data-rps="${key}" aria-pressed="false">
            <span aria-hidden="true">${value.emoji}</span>${value.label}
          </button>
        `).join("")}
      </div>
      <div class="doz-rps-result" id="dozRpsResult" role="status" hidden></div>
      <div class="doz-rps-countdown" id="dozRpsCountdownBox" hidden>
        <span>ورود به بازی تا</span>
        <b id="dozRpsCountdown" role="timer" aria-live="off">۵</b>
        <span>ثانیه</span>
      </div>
      <button type="button" class="primary-btn" id="dozRpsConfirm" disabled>تأیید انتخاب</button>
      <button type="button" class="ghost-btn" id="dozRpsCancel">فعلاً برگرد</button>
    `;

    document.body.append(dialog);

    dialog.querySelectorAll("[data-rps]").forEach(button => {
      button.onclick = () => {
        if (dozBusy || dialog.dataset.result === "true") return;
        dialog.dataset.choice = button.dataset.rps;
        dialog.querySelectorAll("[data-rps]").forEach(item => {
          item.setAttribute("aria-pressed",String(item === button));
        });
        tinyHaptic();
        syncDozRps();
      };
    });

    $("dozRpsConfirm").onclick = async () => {
      const choice = dialog.dataset.choice;
      if (!RPS[choice]) return;

      await runDozAction("rps",{round_id:dozRound.id,choice},async (result,version) => {
        if (!dialog.isConnected) return;

        const round = result.round;
        const rps = round.rps;
        dialog.dataset.result = "true";
        syncDozRps();

        const headline = rps.winner === "human"
          ? "برنده شدی؛ تو شروع می‌کنی."
          : rps.winner === "ai"
            ? "هوش مصنوعی برنده شد و شروع می‌کند."
            : rps.starter === "O"
              ? "مساوی شد؛ قرعهٔ شروع به شما رسید."
              : "مساوی شد؛ قرعهٔ شروع به هوش مصنوعی رسید.";

        $("dozRpsResult").hidden = false;
        $("dozRpsResult").innerHTML = `
          شما: ${RPS[rps.human].emoji} ${RPS[rps.human].label}<br>
          هوش مصنوعی: ${RPS[rps.ai].emoji} ${RPS[rps.ai].label}<br>
          <strong>${headline}</strong>
        `;

        $("dozRpsCountdownBox").hidden = false;
        $("dozRpsConfirm").hidden = true;
        $("dozRpsCancel").hidden = true;

        requestAnimationFrame(() => {
          if (!dialog.isConnected) return;
          $("dozRpsResult")?.scrollIntoView({block:"nearest",behavior:"auto"});
        });

        const completed = await waitDozRpsResult(dialog,version);
        if (!completed || version !== viewVersion) return;

        closeDozRps();
        await animateDozRound(round,version);
      });
    };

    $("dozRpsCancel").onclick = () => {
      if (!dozBusy && dialog.dataset.result !== "true") closeDozRps();
    };

    dialog.addEventListener("cancel",event => {
      if (dozBusy || dialog.dataset.result === "true") event.preventDefault();
    });

    dialog.addEventListener("close",() => {
      if (dozRpsCountdownCancel) dozRpsCountdownCancel();
      dialog.remove();
    });

    dialog.showModal();
    syncDozRps();
  }

  async function playDozCell(index) {
    if (dozBusy || dozUncertain || dozCelebrating ||
        dozRound?.phase !== "playing" ||
        dozRound.board[index] !== null) return;

    $("dozCell"+index).classList.add("pending");

    await runDozAction("move",{
      round_id:dozRound.id,index,version:dozRound.version
    },async (result,version) => {
      await animateDozRound(result.round,version);
    });
  }

  async function animateDozRound(round,version) {
    for (const move of round.moves) {
      if (version !== viewVersion) return;
      const cell = $("dozCell"+move.index);
      if (!cell || cell.dataset.mark === move.player) continue;

      if (move.player === "X") {
        setText($("dozTurn"),"هوش مصنوعی در حال انتخاب است…");
        if (!reduceMotion.matches) await new Promise(resolve => setTimeout(resolve,550));
        if (version !== viewVersion) return;
      }

      setDozCell(move.index,move.player);
      cell.classList.remove("pending");
      tinyHaptic();
      if (!reduceMotion.matches) await new Promise(resolve => setTimeout(resolve,260));
    }

    if (version !== viewVersion) return;
    dozRound = round;
    drawDozWinningLine(round);
    if (round.phase === "finished") finishDozRound(round);
    syncDozArena();
  }

  function finishDozRound(round) {
    if (currentView !== "doz-board" || round?.phase !== "finished") return;

    if (dozCelebrated.has(round.id)) {
      syncDozArena();
      return;
    }

    if ($("dozFinale")?.dataset.roundId === round.id) return;

    closeDozFinale();
    dozCelebrating = true;

    const version = viewVersion;
    const finale = document.createElement("dialog");
    finale.className = "doz-finale";
    finale.id = "dozFinale";
    finale.dir = "rtl";
    finale.dataset.roundId = round.id;
    finale.setAttribute("aria-labelledby","dozFinaleTitle");
    finale.setAttribute("aria-describedby","dozFinaleNote");

    const emoji = round.outcome === "human" ? "🎉" : round.outcome === "ai" ? "😔" : "🤝";

    finale.innerHTML = `
      <div class="doz-finale-card">
        <span aria-hidden="true">${emoji}</span>
        <strong id="dozFinaleTitle">${dozResultTitle(round)}</strong>
        <small id="dozFinaleNote">${round.reward > 0
          ? `${fmt(round.reward)} میو به موجودیت اضافه شد.`
          : dozRewardNote(round)}</small>
        <button type="button" class="primary-btn" id="dozResultConfirm"
          ${dozBusy ? "disabled" : ""}>
          تأیید
        </button>
      </div>
    `;

    if (round.outcome === "human") {
      const colors = ["#9e8aff","#77e4df","#ffd680","#ff99bd","#a5bcff"];
      for (let index=0;index<42;index++) {
        const confetti = document.createElement("i");
        confetti.className = "doz-confetti";
        confetti.setAttribute("aria-hidden","true");
        confetti.style.setProperty("--left",`${Math.random()*100}%`);
        confetti.style.setProperty("--color",colors[index%colors.length]);
        confetti.style.setProperty("--duration",`${2.1+Math.random()*1.5}s`);
        confetti.style.setProperty("--delay",`${Math.random()*.65}s`);
        confetti.style.setProperty("--drift",`${Math.random()*180-90}px`);
        finale.append(confetti);
      }
    }

    finale.addEventListener("cancel",event => {
      event.preventDefault();
    });

    document.body.append(finale);

    $("dozResultConfirm").onclick = () => {
      if (dozBusy || version !== viewVersion) return;

      dozCelebrated.add(round.id);

      if (dozCelebrated.size > 100) {
        dozCelebrated.delete(dozCelebrated.values().next().value);
      }

      tinyHaptic();
      closeDozFinale();

      if (dozState.remaining_rounds === 0) {
        viewDozIntro();
      } else {
        syncDozArena();
        $("dozAgain")?.focus({preventScroll:true});
      }
    };

    finale.showModal();

    if (!dozBusy) {
      $("dozResultConfirm").focus({preventScroll:true});
    }

    syncDozArena();

    dozResultTimer = setTimeout(() => {
      finale.querySelectorAll(".doz-confetti").forEach(item => item.remove());
      dozResultTimer = null;
    },4000);
  }

  /* ================= User data / refresh ================= */

  function applyUserData(user) {
    if (!user || user.ok === false || user.balance == null ||
        !Number.isFinite(Number(user.balance))) return false;

    hasUserData = true;
    state.not_started = Boolean(user.not_started);
    state.daily_enabled = Boolean(user.daily_enabled);
    state.withdrawn_today = Number(user.withdrawn_today)||0;
    state.notifications = Array.isArray(user.notifications)
      ? user.notifications.filter(item => item && typeof item === "object") : [];

    const previous = new Map(
      state.pending_withdrawals.map(item => [String(item.withdraw_id),item])
    );

    const pending = Array.isArray(user.pending_withdrawals)
      ? user.pending_withdrawals
      : user.pending_withdrawal ? [user.pending_withdrawal] : [];

    state.pending_withdrawals = pending
      .filter(item => item?.withdraw_id && !finishedWithdrawals.has(String(item.withdraw_id)))
      .map(item => normalizeWithdrawal(item,previous.get(String(item.withdraw_id))));

    if (activeWithdrawal) {
      const match = state.pending_withdrawals.find(
        item => String(item.withdraw_id) === String(activeWithdrawal.withdraw_id)
      );
      if (match) Object.assign(activeWithdrawal,match);
    } else if (state.pending_withdrawals.length) {
      activeWithdrawal = {...state.pending_withdrawals[0],phase:"pending"};
      lastWithdrawMethod = activeWithdrawal.method;
    }

    setBalance(user.balance);
    renderWithdrawDashboard();

    if ($("notifOverlay").classList.contains("show")) {
      renderNotifications();
      setSeen(notificationKey(state.notifications[0]));
    }

    updateBellDot();

    if (activeWithdrawal?.phase === "pending" && !pollingWithdrawal) {
      pollWithdrawStatus();
    }

    return true;
  }

  async function refreshData(showError = true) {
    const requestVersion = ++userRequestVersion;
    refreshBtn.classList.add("spinning");
    refreshBtn.disabled = true;
    refreshBtn.setAttribute("aria-busy","true");

    try {
      const user = await api("/user");
      if (requestVersion !== userRequestVersion) return;

      if (!applyUserData(user)) {
        if (showError) showToast(errorText(user.error));
        return;
      }

      if (currentView === "daily") viewDaily();
      else if (currentView === "profile") viewProfile();
      else if (currentView === "game" && !gameBusy) await viewGame();
      else if (currentView === "doz-intro" && !dozBusy) await viewDozIntro();
      else if (currentView === "doz-board" && !dozBusy &&
               !dozCelebrating && !$("dozRpsDialog")) await viewDozArena();
    } finally {
      if (requestVersion === userRequestVersion) {
        refreshBtn.classList.remove("spinning");
        refreshBtn.disabled = false;
        refreshBtn.setAttribute("aria-busy","false");
      }
    }
  }

  /* ================= Wiring ================= */

  $("backArrow").onclick = () => {
    if (currentView === "doz-board") viewDozIntro();
    else if (currentView === "doz-intro" || currentView === "game") viewGamesHub();
    else showHome();
  };

  $("bellBtn").onclick = openNotifications;
  $("closeNotifBtn").onclick = closeNotifications;

  $("notifOverlay").onclick = event => {
    if (event.target === $("notifOverlay")) closeNotifications();
  };

  $("notifSheet").addEventListener("keydown",event => {
    if (event.key === "Escape") {
      event.preventDefault();
      closeNotifications();
    }
    if (event.key === "Tab") {
      event.preventDefault();
      $("closeNotifBtn").focus();
    }
  });

  $("btnInvite").onclick = viewInvite;
  $("btnWithdraw").onclick = viewWithdrawForm;
  $("btnBankWithdraw").onclick = viewBankWithdrawCardInput;
  $("btnDaily").onclick = viewDaily;
  $("btnGame").onclick = viewGamesHub;
  $("homeReceiptBtn").onclick = requestReceipt;

  [
    ["navHome",showHome],
    ["navTheme",viewThemeSettings],
    ["navWithdraw",viewWithdrawHub],
    ["navGame",viewGamesHub],
    ["navProfile",viewProfile]
  ].forEach(([id,view]) => {
    $(id).onclick = () => {
      tinyHaptic();
      view();
    };
  });

  refreshBtn.onclick = () => refreshData(true);

  document.addEventListener("click",event => {
    if (!(event.target instanceof Element)) return;
    const button = event.target.closest(".menu-btn,.primary-btn,.copy-btn,.withdraw-method");
    if (!button || button.disabled || reduceMotion.matches) return;

    const rect = button.getBoundingClientRect();
    const size = Math.hypot(rect.width,rect.height)*2;
    const x = event.detail ? event.clientX-rect.left : rect.width/2;
    const y = event.detail ? event.clientY-rect.top : rect.height/2;
    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.setAttribute("aria-hidden","true");

    Object.assign(ripple.style,{
      width:`${size}px`,height:`${size}px`,
      left:`${x-size/2}px`,top:`${y-size/2}px`
    });

    button.append(ripple);
    setTimeout(() => ripple.remove(),650);
  },true);

  document.addEventListener("visibilitychange",() => {
    $("notifOverlay").classList.toggle("meteors-paused",document.hidden);
    document.querySelector(".doz-lobby")?.classList.toggle("meteors-paused",document.hidden);

    if (document.hidden) {
      stopGameVisual();
      return;
    }

    keyboard.update();
    updateDozViewport();
    updatePendingClocks();

    if (currentView === "game") {
      updateGameControls();
      if (gameBusy && !activeGameAnimation && $("reelTrack0") && !gameBalanceLimitReached()) {
        activeGameAnimation = startReelAnimation(false);
      } else if (!gameBusy) {
        syncGamePresentation();
      }
    }

    if (hasUserData && !gameBusy && !dozBusy) refreshData(false);
  });

  function onMotionPreferenceChange() {
    if (reduceMotion.matches) {
      stopGameVisual();
      if (!gameBusy) syncGamePresentation();
    }
  }

  if (reduceMotion.addEventListener) {
    reduceMotion.addEventListener("change",onMotionPreferenceChange);
  } else {
    reduceMotion.addListener(onMotionPreferenceChange);
  }

  window.addEventListener("resize",() => {
    if (currentView !== "doz-board" || !dozRound?.winning_line?.length) return;
    const overlay = $("dozWinningLine");
    if (!overlay) return;
    delete overlay.dataset.roundId;
    drawDozWinningLine(dozRound);
  },{passive:true});

  setInterval(() => {
    if (!document.hidden && currentView === "home") updatePendingClocks();
  },1000);

  applyTheme();

  /* ================= Init ================= */

  async function init() {
    const version = ++userRequestVersion;
    const started = performance.now();
    const userPromise = api("/user");
    let timeoutId;

    const timeout = new Promise(resolve => {
      timeoutId = setTimeout(() => resolve(null),4000);
    });

    const first = await Promise.race([userPromise,timeout]);
    clearTimeout(timeoutId);

    const remaining = 650-(performance.now()-started);
    if (remaining > 0) await new Promise(resolve => setTimeout(resolve,remaining));

    $("skeletonSection").style.display = "none";
    if (currentView === "home") showHome();
    if (version !== userRequestVersion) return;

    if (first) {
      if (!applyUserData(first)) {
        $("balanceValue").textContent = "—";
        showToast(errorText(first.error));
      }
    } else {
      userPromise.then(user => {
        if (version !== userRequestVersion) return;
        if (!applyUserData(user)) {
          $("balanceValue").textContent = "—";
          showToast(errorText(user.error));
        }
      });
    }
  }

  init();
})();
</script>

</body>
  </html>
