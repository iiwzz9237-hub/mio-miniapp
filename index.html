<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mio Point</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#140a30;
    --bg-mid:#37196c;
    --bg-bottom:#6a2f96;
    --card:rgba(255,255,255,0.07);
    --card-border:rgba(255,255,255,0.10);
    --card-strong:rgba(255,255,255,0.12);
    --gold:#f6c94a;
    --text:#f3eefc;
    --text-dim:#c9bfe0;
    --danger:#ff6b6b;
    --success:#5fd98a;
    --radius-lg:26px;
    --radius-md:18px;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    padding:0;
  }
  html{
    background:var(--bg-mid);
  }
  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--bg-mid);
    color:var(--text);
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    overscroll-behavior:none;
    position:relative;
  }
  /* پس‌زمینه به‌صورت ثابت نسبت به viewport، مستقل از تغییر ارتفاع صفحه
     هنگام باز شدن کیبورد — از ایجاد خط/نوار رنگی هنگام تغییر اندازه جلوگیری می‌کند */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 48%,var(--bg-bottom) 100%);
    z-index:-1;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:18px 18px 40px;
    min-height:100%;
  }

  /* ===== Top bar ===== */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 2px 10px;
  }
  .bell-btn{
    position:relative;
    width:42px;
    height:42px;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    cursor:pointer;
  }
  .bell-dot{
    position:absolute;
    top:7px;
    left:9px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 2px var(--bg-mid);
    display:none;
  }
  .bell-dot.show{display:block;}
  .topbar-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .refresh-btn{
    width:42px;
    height:42px;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    color:var(--text);
    transition:transform .4s ease;
  }
  .refresh-btn.spinning{
    animation:spin 0.8s linear;
  }
  .brand{
    font-size:15px;
    color:var(--text-dim);
    letter-spacing:.3px;
  }

  h1.title{
    text-align:center;
    font-size:34px;
    font-weight:800;
    margin:18px 0 22px;
    letter-spacing:.5px;
  }

  /* ===== Balance card ===== */
  .balance-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius-lg);
    padding:30px 20px 34px;
    text-align:center;
    margin-bottom:20px;
  }
  .balance-label{
    font-size:15px;
    color:var(--text-dim);
    margin-bottom:14px;
  }
  .balance-value{
    font-size:44px;
    font-weight:800;
    color:var(--gold);
    line-height:1.2;
    direction:ltr;
    display:inline-block;
  }
  .balance-unit{
    font-size:22px;
    font-weight:700;
    color:var(--gold);
    margin-inline-start:6px;
  }

  /* ===== Menu grid ===== */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:20px;
  }
  .menu-btn{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius-md);
    padding:20px 10px;
    text-align:center;
    font-size:16px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    transition:background .15s ease, transform .08s ease;
  }
  .menu-btn:active{
    transform:scale(0.97);
    background:var(--card-strong);
  }
  .menu-btn .emoji{
    font-size:20px;
    margin-inline-start:6px;
  }

  /* ===== Info / content panel ===== */
  .panel{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius-lg);
    padding:26px 20px;
    min-height:140px;
  }
  .panel h2{
    margin:0 0 12px;
    font-size:19px;
    font-weight:700;
  }
  .panel p{
    margin:0 0 10px;
    color:var(--text-dim);
    font-size:15px;
    line-height:1.9;
  }
  .panel .muted-center{
    text-align:center;
    color:var(--text-dim);
    font-size:15px;
    line-height:1.9;
    padding:10px 0 4px;
  }
  .panel .muted-center b{color:var(--text);}

  .link-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,0.22);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:12px 14px;
    margin:14px 0 18px;
  }
  .link-box span{
    flex:1;
    direction:ltr;
    text-align:left;
    font-size:13px;
    color:var(--text);
    overflow-x:auto;
    white-space:nowrap;
  }
  .copy-btn{
    background:var(--gold);
    color:#241154;
    border:none;
    border-radius:10px;
    padding:9px 14px;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  .copy-btn.copied{background:var(--success);color:#0d2b17;}

  input.id-input{
    width:100%;
    background:rgba(0,0,0,0.22);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 16px;
    font-family:inherit;
    font-size:16px;
    color:var(--text);
    direction:ltr;
    text-align:left;
    margin:12px 0 6px;
  }
  input.id-input::placeholder{color:rgba(255,255,255,0.35);}
  .field-error{
    color:var(--danger);
    font-size:13px;
    min-height:18px;
    margin-bottom:6px;
  }

  .primary-btn{
    width:100%;
    background:var(--gold);
    color:#241154;
    border:none;
    border-radius:14px;
    padding:15px;
    font-family:inherit;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
  }
  .primary-btn:active{transform:scale(0.985);}
  .primary-btn:disabled{opacity:.5;}
  .ghost-btn{
    width:100%;
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:13px;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
  }

  .spinner{
    width:34px;height:34px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,0.15);
    border-top-color:var(--gold);
    margin:8px auto 16px;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .result-icon{
    font-size:40px;
    text-align:center;
    margin-bottom:8px;
  }

  .toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(0,0,0,0.2);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:14px 16px;
    margin:16px 0 4px;
  }
  .toggle-row .status-text{font-weight:700;font-size:15px;}
  .toggle-row .status-text.on{color:var(--success);}
  .toggle-row .status-text.off{color:var(--text-dim);}

  .back-link{
    display:block;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    margin-top:16px;
    cursor:pointer;
  }

  .title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:18px 0 22px;
    position:relative;
  }
  .title-row h1.title{margin:0;}
  .back-arrow{
    position:absolute;
    right:0;
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--card);
    border:1px solid var(--card-border);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    color:var(--text);
  }

  /* ===== Notifications sheet ===== */
  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(8,4,20,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:50;
    padding-top:calc(env(safe-area-inset-top,0px) + 70px);
  }
  .sheet-overlay.show{display:flex;}
  .sheet{
    width:min(420px,92vw);
    background:#241154;
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:16px;
    max-height:70vh;
    overflow-y:auto;
  }
  .sheet h3{
    margin:2px 6px 12px;
    font-size:16px;
  }
  .notif-item{
    background:rgba(255,255,255,0.06);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:8px;
    font-size:14px;
    line-height:1.8;
  }
  .notif-item.success{border-inline-start:3px solid var(--success);}
  .notif-item.fail{border-inline-start:3px solid var(--danger);}
  .notif-item .t{font-size:11px;color:var(--text-dim);margin-top:4px;direction:ltr;text-align:right;}
  .notif-empty{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    padding:20px 0;
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <button class="bell-btn" id="bellBtn" aria-label="اعلان‌ها">
      🔔
      <span class="bell-dot" id="bellDot"></span>
    </button>
    <span class="brand">🐾 Mio Point</span>
    <button class="refresh-btn" id="refreshBtn" aria-label="بروزرسانی">🔄</button>
  </div>

  <div class="title-row">
    <span class="back-arrow" id="backArrow">←</span>
    <h1 class="title" id="pageTitle">Mio Point</h1>
  </div>

  <div id="homeSection">
    <div class="balance-card">
      <div class="balance-label">💎 موجودی شما</div>
      <div>
        <span class="balance-value" id="balanceValue">…</span>
        <span class="balance-unit">میو</span>
      </div>
    </div>

    <div class="grid">
      <div class="menu-btn" id="btnInvite">لینک دعوت <span class="emoji">👥</span></div>
      <div class="menu-btn" id="btnWithdraw">برداشت <span class="emoji">📤</span></div>
      <div class="menu-btn" id="btnDaily" style="grid-column:1 / span 2;">میو روزانه <span class="emoji">🎁</span></div>
    </div>

    <div class="panel">
      <p class="muted-center">🐾 <b>خوش آمدید</b></p>
      <p class="muted-center">از منوی بالا انتخاب کنید</p>
    </div>
  </div>

  <div id="viewSection" style="display:none;">
    <div class="panel" id="panel">
      <!-- محتوای هر صفحه با جاوااسکریپت اینجا قرار می‌گیرد -->
    </div>
  </div>

</div>

<div class="sheet-overlay" id="notifOverlay">
  <div class="sheet">
    <h3>🔔 اعلان‌ها</h3>
    <div id="notifList"></div>
  </div>
</div>

<script>
/* =========================================================
   MIO POINT — Mini App Frontend
   -----------------------------------------------------------
   این فایل فرانت‌اند مستقل است و از طریق MioAPI (پایین همین فایل)
   با بک‌اندی که روی Render اجرا می‌شود صحبت می‌کند.

   قبل از دیپلوی نهایی:
   1) مقدار API_BASE را به آدرس واقعی بک‌اند روی Render تغییر بده.
   2) اندپوینت‌های زیر باید در بک‌اند پیاده‌سازی شوند:
        GET  /api/user            -> { balance, daily_enabled, notifications:[...] }
        GET  /api/invite-link     -> { link }
        POST /api/withdraw        -> { ok, error? }              body:{ target }
        GET  /api/withdraw-status -> { status: pending|success|failed }
        POST /api/receipt         -> { ok }
        POST /api/daily/enable    -> { ok, balance }
   احراز هویت کاربر با initData تلگرام (Telegram.WebApp.initData)
   در هدر Authorization به بک‌اند فرستاده می‌شود؛ بک‌اند باید آن را
   با BOT_TOKEN اعتبارسنجی کند.
   ========================================================= */

const API_BASE = "https://mio-backend-1-sus9.onrender.com/api";

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function authHeaders(){
  return {
    "Content-Type": "application/json",
    "Authorization": "tma " + (tg?.initData || "")
  };
}

const MioAPI = {
  async getUser(){
    try{
      const res = await fetch(`${API_BASE}/user`, { headers: authHeaders() });
      if(!res.ok) throw new Error("bad response");
      return await res.json();
    }catch(e){
      console.error("getUser failed:", e);
      return { balance: 0, daily_enabled: false, notifications: [] };
    }
  },
  async getInviteLink(){
    try{
      const res = await fetch(`${API_BASE}/invite-link`, { headers: authHeaders() });
      const data = await res.json();
      return data.link || "";
    }catch(e){
      console.error("getInviteLink failed:", e);
      return "";
    }
  },
  async requestWithdraw(target){
    try{
      const res = await fetch(`${API_BASE}/withdraw`, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ target })
      });
      return await res.json();
    }catch(e){
      console.error("requestWithdraw failed:", e);
      return { ok:false, error:"network" };
    }
  },
  async getWithdrawStatus(){
    try{
      const res = await fetch(`${API_BASE}/withdraw-status`, { headers: authHeaders() });
      return await res.json();
    }catch(e){
      console.error("getWithdrawStatus failed:", e);
      return { status: "failed" };
    }
  },
  async requestReceipt(){
    try{
      const res = await fetch(`${API_BASE}/receipt`, { method:"POST", headers: authHeaders() });
      return await res.json();
    }catch(e){
      console.error("requestReceipt failed:", e);
      return { ok:false };
    }
  },
  async enableDaily(){
    try{
      const res = await fetch(`${API_BASE}/daily/enable`, { method:"POST", headers: authHeaders() });
      return await res.json();
    }catch(e){
      console.error("enableDaily failed:", e);
      return { ok:false };
    }
  }
};

/* ===================== state ===================== */

let state = {
  balance: 0,
  daily_enabled: false,
  notifications: []
};

const panel = document.getElementById("panel");
const balanceValueEl = document.getElementById("balanceValue");

function fmt(n){
  return Number(n || 0).toLocaleString("en-US");
}

function setBalance(v){
  state.balance = v;
  balanceValueEl.textContent = fmt(v);
}

/* ===================== notifications ===================== */

const notifOverlay = document.getElementById("notifOverlay");
const notifList = document.getElementById("notifList");
const bellDot = document.getElementById("bellDot");

function renderNotifications(){
  if(!state.notifications.length){
    notifList.innerHTML = `<div class="notif-empty">هنوز اعلانی نداری</div>`;
    return;
  }
  notifList.innerHTML = state.notifications.map(n => `
    <div class="notif-item ${n.type === 'fail' ? 'fail' : 'success'}">
      ${n.text}
      <div class="t">${n.time || ""}</div>
    </div>
  `).join("");
}

function updateBellDot(){
  if(state.notifications.length){
    bellDot.classList.add("show");
  }else{
    bellDot.classList.remove("show");
  }
}

document.getElementById("bellBtn").onclick = () => {
  notifOverlay.classList.add("show");
  bellDot.classList.remove("show");
};
notifOverlay.onclick = (e) => {
  if(e.target === notifOverlay) notifOverlay.classList.remove("show");
};

/* ===================== navigation ===================== */

const homeSection = document.getElementById("homeSection");
const viewSection = document.getElementById("viewSection");
const pageTitle = document.getElementById("pageTitle");
const backArrow = document.getElementById("backArrow");

function showHome(){
  homeSection.style.display = "block";
  viewSection.style.display = "none";
  pageTitle.textContent = "Mio Point";
  backArrow.style.display = "none";
}

function showView(title){
  homeSection.style.display = "none";
  viewSection.style.display = "block";
  pageTitle.textContent = title;
  backArrow.style.display = "flex";
}

backArrow.onclick = showHome;
const viewWelcome = showHome;

/* ===================== views ===================== */

async function viewInvite(){
  showView("👥 لینک دعوت");
  panel.innerHTML = `
    <p>اگر این لینک را برای دوستتان بفرستید و او با همین لینک ربات را استارت کند، مستقیم ۴۰۰,۰۰۰ میو به حساب شما واریز خواهد شد.</p>
    <div class="link-box">
      <span id="inviteLinkText">در حال دریافت لینک…</span>
      <button class="copy-btn" id="copyBtn">کپی</button>
    </div>
  `;

  const link = await MioAPI.getInviteLink();
  const linkEl = document.getElementById("inviteLinkText");
  linkEl.textContent = link || "خطا در دریافت لینک";

  document.getElementById("copyBtn").onclick = async () => {
    try{
      await navigator.clipboard.writeText(link);
      const btn = document.getElementById("copyBtn");
      btn.textContent = "کپی شد ✓";
      btn.classList.add("copied");
      setTimeout(()=>{ btn.textContent="کپی"; btn.classList.remove("copied"); }, 1800);
    }catch(e){
      console.error("copy failed", e);
    }
  };
}

function viewWithdrawForm(){
  showView("📤 برداشت");
  panel.innerHTML = `
    <p>دوست عزیز، شما در حالت برداشت هستید.</p>
    <p>موجودی قابل برداشت شما: <b style="color:var(--gold)">${fmt(state.balance)} میو</b></p>
    <p>لطفاً آیدی تلگرام خود را در فیلد زیر وارد کنید و سپس روی دکمه تایید بزنید.</p>
    <input class="id-input" id="withdrawIdInput" placeholder="@username" />
    <div class="field-error" id="withdrawError"></div>
    <button class="primary-btn" id="withdrawConfirmBtn">✅ تایید</button>
  `;

  document.getElementById("withdrawConfirmBtn").onclick = async () => {
    const input = document.getElementById("withdrawIdInput");
    const errEl = document.getElementById("withdrawError");
    const target = input.value.trim();

    if(!target.startsWith("@") || target.length < 2){
      errEl.textContent = "❌ آیدی باید با @ شروع شود.";
      return;
    }
    if(state.balance <= 0){
      errEl.textContent = "❌ موجودی شما صفر است.";
      return;
    }

    errEl.textContent = "";
    viewWithdrawWaiting();

    const res = await MioAPI.requestWithdraw(target);

    if(!res.ok){
      viewWithdrawFailed();
      return;
    }

    pollWithdrawStatus();
  };
}

function viewWithdrawWaiting(){
  showView("📤 برداشت");
  panel.innerHTML = `
    <div class="spinner"></div>
    <p class="muted-center">⏳ لطفاً منتظر بمانید…</p>
    <p class="muted-center">درخواست برداشت شما در حال پردازش است.</p>
  `;
}

async function pollWithdrawStatus(){
  const maxTries = 40; // ~ 2 دقیقه با فاصله ۳ ثانیه
  for(let i=0;i<maxTries;i++){
    await new Promise(r => setTimeout(r, 3000));
    const res = await MioAPI.getWithdrawStatus();
    if(res.status === "success"){
      setBalance(0);
      viewWithdrawSuccess();
      return;
    }
    if(res.status === "failed"){
      viewWithdrawFailed();
      return;
    }
  }
  viewWithdrawFailed();
}

function viewWithdrawSuccess(){
  showView("📤 برداشت");
  panel.innerHTML = `
    <div class="result-icon">🎉</div>
    <p class="muted-center"><b>میوهای شما با موفقیت واریز شد</b></p>
    <p class="muted-center">آیا مایل به دریافت رسید هستید؟</p>
    <button class="primary-btn" id="receiptYesBtn">✅ تایید، رسید می‌خواهم</button>
    <button class="ghost-btn" id="receiptNoBtn">فعلاً نه</button>
  `;

  document.getElementById("receiptYesBtn").onclick = async () => {
    panel.innerHTML = `
      <div class="spinner"></div>
      <p class="muted-center">در حال ثبت درخواست…</p>
    `;
    await MioAPI.requestReceipt();
    panel.innerHTML = `
      <div class="result-icon">📨</div>
      <p class="muted-center"><b>درخواست رسید ثبت شد.</b></p>
      <p class="muted-center">به اکانت زیر پیام بده:</p>
      <div class="link-box">
        <span dir="ltr" style="text-align:center;flex:1;">@Pott5y6jg</span>
      </div>
      <p class="muted-center">و بنویس:</p>
      <p class="muted-center"><b style="color:var(--gold)">رسیدم رو بده ❤️</b></p>
      <p class="muted-center">🤖 رسید به صورت خودکار برات ارسال می‌شود.</p>
    `;
  };

  document.getElementById("receiptNoBtn").onclick = viewWelcome;
}

function viewWithdrawFailed(){
  showView("📤 برداشت");
  panel.innerHTML = `
    <div class="result-icon">❌</div>
    <p class="muted-center"><b>برداشت ناموفق بود</b></p>
    <p class="muted-center">لطفاً دوباره تلاش کنید.</p>
    <button class="primary-btn" id="retryBtn">تلاش دوباره</button>
  `;
  document.getElementById("retryBtn").onclick = viewWithdrawForm;
}

function viewDaily(){
  showView("🎁 میو روزانه");

  if(state.daily_enabled){
    panel.innerHTML = `
      <div class="toggle-row">
        <span class="status-text on">روشن است ✅</span>
      </div>
      <p>هر روز منتظر واریز ۳۴۰,۰۰۰ میو باشید.</p>
    `;
    return;
  }

  panel.innerHTML = `
    <p>با روشن کردن این قابلیت، هر روز ۳۴۰,۰۰۰ میو دریافت می‌کنید.</p>
    <button class="primary-btn" id="enableDailyBtn">✅ فعال کن</button>
  `;

  document.getElementById("enableDailyBtn").onclick = async () => {
    const res = await MioAPI.enableDaily();
    if(res.ok){
      state.daily_enabled = true;
      if(typeof res.balance === "number") setBalance(res.balance);
      viewDaily();
    }
  };
}

/* ===================== wiring ===================== */

document.getElementById("btnInvite").onclick = viewInvite;
document.getElementById("btnWithdraw").onclick = viewWithdrawForm;
document.getElementById("btnDaily").onclick = viewDaily;

/* ===================== refresh ===================== */

const refreshBtn = document.getElementById("refreshBtn");

async function refreshData(){
  refreshBtn.classList.add("spinning");
  try{
    const user = await MioAPI.getUser();
    setBalance(user.balance);
    state.daily_enabled = !!user.daily_enabled;
    state.notifications = user.notifications || [];
    renderNotifications();
    updateBellDot();

    // اگه کاربر تو صفحه‌ی میو روزانه یا برداشت هست، محتوای همون صفحه هم بروز بشه
    if(pageTitle.textContent === "🎁 میو روزانه"){
      viewDaily();
    }else if(pageTitle.textContent === "📤 برداشت" && !document.getElementById("withdrawIdInput")){
      // در حالت فرم برداشت که هنوز نتیجه‌ای نگرفته، دست نمی‌زنیم
    }
  }finally{
    setTimeout(() => refreshBtn.classList.remove("spinning"), 800);
  }
}

refreshBtn.onclick = refreshData;

/* ===================== init ===================== */

async function init(){
  viewWelcome();
  const user = await MioAPI.getUser();
  setBalance(user.balance);
  state.daily_enabled = !!user.daily_enabled;
  state.notifications = user.notifications || [];
  renderNotifications();
  updateBellDot();
}

init();
</script>
