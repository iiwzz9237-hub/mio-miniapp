<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1016">
<title>Mio Point</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0d1016;
    --card: rgba(255,255,255,.045);
    --card-border: rgba(255,255,255,.085);
    --card-strong: rgba(255,255,255,.10);
    --gold: #f4cf77;
    --text: #f5f5f7;
    --text-dim: #9da5b5;
    --danger: #ff8585;
    --success: #93d8ba;
    --radius-lg: 28px;
    --radius-md: 22px;
    --ease-out: cubic-bezier(.22,1,.36,1);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--bg);
    color-scheme: dark;
  }

  body {
    min-height: 100vh;
    margin: 0;
    padding:
      env(safe-area-inset-top, 0px)
      0
      env(safe-area-inset-bottom, 0px);
    font-family: "Vazirmatn", sans-serif;
    color: var(--text);
    background: var(--bg);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(
        ellipse at 90% 0%,
        rgba(244,207,119,.09),
        transparent 48%
      ),
      radial-gradient(
        ellipse at 0% 65%,
        rgba(109,137,202,.055),
        transparent 50%
      ),
      linear-gradient(165deg, #10131b, #0b0e14 65%, #11151d);
  }

  button,
  input {
    font-family: inherit;
  }

  button {
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  button:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 20px 44px;
    animation: app-in .65s var(--ease-out) backwards;
  }

  /* ===== نوار بالا ===== */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0 12px;
  }

  .brand {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.9;
    color: #d4d8e1;
    overflow-wrap: anywhere;
  }

  .icon-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid var(--card-border);
    border-radius: 15px;
    background: rgba(255,255,255,.035);
    color: #d8dce5;
    transition:
      transform .2s var(--ease-out),
      background .2s ease,
      border-color .2s ease;
  }

  .icon {
    display: block;
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* چرخش فقط روی آیکون؛ خود دکمه ثابت می‌ماند */
  .refresh-btn .icon {
    transform-origin: 50% 50%;
    transform-box: view-box;
  }

  .refresh-btn.spinning .icon {
    animation: spin .85s linear infinite;
  }

  .bell-dot {
    position: absolute;
    top: 8px;
    left: 9px;
    display: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 3px #14171e;
  }

  .bell-dot.show {
    display: block;
    animation: dot-in .4s var(--ease-out) backwards;
  }

  /* ===== عنوان ===== */

  .title-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    margin: 24px 0 28px;
  }

  h1.title {
    margin: 0;
    text-align: center;
    font-size: clamp(24px, 7vw, 34px);
    font-weight: 800;
    letter-spacing: -.8px;
  }

  .back-arrow {
    position: absolute;
    right: 0;
    display: none;
  }

  .view-active .title-row {
    padding-inline: 49px;
  }

  .view-active h1.title {
    font-size: clamp(19px, 5.8vw, 28px);
    line-height: 1.6;
  }

  /* ===== کارت موجودی ===== */

  .balance-card {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 32px 20px 36px;
    margin-bottom: 22px;
    text-align: center;
    border: 1px solid rgba(244,207,119,.22);
    border-radius: var(--radius-lg);
    background:
      radial-gradient(
        ellipse at 50% 0%,
        rgba(244,207,119,.13),
        transparent 75%
      ),
      linear-gradient(135deg, #202027, #14171f);
    box-shadow:
      0 18px 44px rgba(0,0,0,.20),
      inset 0 1px 0 rgba(255,255,255,.05);
    animation: rise .7s .04s var(--ease-out) backwards;
  }

  .balance-card::before {
    content: "";
    position: absolute;
    inset: 0 18% auto;
    height: 1px;
    opacity: .8;
    pointer-events: none;
    background: linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
  }

  .balance-card::after {
    content: "";
    position: absolute;
    z-index: -1;
    left: -95px;
    bottom: -105px;
    width: 170px;
    height: 170px;
    border: 1px solid rgba(244,207,119,.065);
    border-radius: 50%;
    box-shadow:
      0 0 0 22px rgba(244,207,119,.025),
      0 0 0 44px rgba(244,207,119,.018);
    pointer-events: none;
  }

  .balance-label {
    margin-bottom: 18px;
    font-size: 13px;
    color: #c4bba7;
  }

  .balance-value {
    display: inline-block;
    max-width: 100%;
    direction: ltr;
    font-size: clamp(30px, 9vw, 46px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
    letter-spacing: -1.5px;
    color: #f6d58a;
    overflow-wrap: anywhere;
    text-shadow: 0 3px 24px rgba(244,207,119,.10);
  }

  .balance-unit {
    margin-inline-start: 6px;
    font-size: 17px;
    font-weight: 700;
    color: #d4b46e;
  }

  /* ===== منوی اصلی ===== */

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }

  .menu-btn {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 13px;
    min-width: 0;
    min-height: 132px;
    padding: 22px 10px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-md);
    background: linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.7;
    transition:
      transform .25s var(--ease-out),
      border-color .25s ease,
      background .25s ease,
      box-shadow .25s ease;
    animation: rise .65s var(--enter-delay) var(--ease-out) backwards;
  }

  .menu-btn:nth-child(1) { --enter-delay: .10s; }
  .menu-btn:nth-child(2) { --enter-delay: .16s; }
  .menu-btn:nth-child(3) { --enter-delay: .22s; }
  .menu-btn:nth-child(4) { --enter-delay: .28s; }

  .menu-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 16px;
    background: rgba(244,207,119,.09);
    color: var(--gold);
    transition: transform .3s var(--ease-out);
  }

  #btnInvite .menu-icon {
    background: rgba(141,174,246,.10);
    color: #9ebbf6;
  }

  #btnBankWithdraw .menu-icon {
    background: rgba(136,213,181,.10);
    color: #93d8ba;
  }

  #btnDaily .menu-icon {
    background: rgba(192,156,238,.10);
    color: #c8abef;
  }

  /* ===== پنل‌ها ===== */

  .panel {
    min-height: 140px;
    padding: 25px 21px;
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    background: linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.02)
    );
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
  }

  #homeSection > .panel {
    animation: rise .65s .34s var(--ease-out) backwards;
  }

  .panel h2 {
    margin: 0 0 12px;
    font-size: 19px;
    font-weight: 700;
  }

  .panel p {
    margin: 0 0 10px;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 2;
  }

  .panel .muted-center {
    padding: 10px 0 4px;
    text-align: center;
  }

  .panel .muted-center b {
    color: #e9ecf2;
  }

  .gold-text {
    color: var(--gold) !important;
  }

  .link-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 18px;
    padding: 12px;
    border: 1px solid var(--card-border);
    border-radius: 17px;
    background: rgba(0,0,0,.17);
  }

  .link-box > span {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    white-space: nowrap;
    font-size: 13px;
  }

  .field-label {
    display: block;
    margin-top: 14px;
    color: #d5d9e2;
    font-size: 13px;
  }

  input.id-input {
    width: 100%;
    margin: 10px 0 6px;
    padding: 16px;
    border: 1px solid var(--card-border);
    border-radius: 17px;
    background: rgba(0,0,0,.18);
    color: var(--text);
    direction: ltr;
    text-align: left;
    font-size: 16px;
    transition:
      border-color .2s ease,
      background .2s ease,
      box-shadow .2s ease;
  }

  input.id-input::placeholder {
    color: rgba(255,255,255,.30);
  }

  input.id-input:focus {
    outline: none;
    border-color: rgba(244,207,119,.55);
    background: rgba(244,207,119,.025);
    box-shadow: 0 0 0 4px rgba(244,207,119,.07);
  }

  .field-error {
    min-height: 20px;
    margin-bottom: 6px;
    color: var(--danger);
    font-size: 12px;
    line-height: 1.8;
  }

  /* ===== دکمه‌ها ===== */

  .primary-btn,
  .ghost-btn,
  .copy-btn {
    position: relative;
    overflow: hidden;
    border: none;
    font-weight: 700;
    transition:
      transform .2s var(--ease-out),
      opacity .2s ease,
      background .2s ease,
      box-shadow .2s ease;
  }

  .primary-btn {
    width: 100%;
    margin-top: 10px;
    padding: 16px;
    border-radius: 17px;
    background: linear-gradient(115deg, #f6d98f, #e8bd5e);
    color: #252014;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(232,189,94,.10);
  }

  .ghost-btn {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    border: 1px solid var(--card-border);
    border-radius: 17px;
    background: rgba(255,255,255,.02);
    color: var(--text-dim);
    font-size: 14px;
  }

  .copy-btn {
    flex-shrink: 0;
    padding: 9px 14px;
    border-radius: 11px;
    background: linear-gradient(115deg, #f6d98f, #e8bd5e);
    color: #252014;
    font-size: 12px;
    white-space: nowrap;
  }

  .copy-btn.copied {
    background: #92d7ad;
    color: #143322;
  }

  /*
   * دکمهٔ تأیید RGB
   * زمینهٔ رنگی متحرک است؛ نوشته روی یک لایهٔ تیرهٔ ثابت قرار دارد.
   */
  .primary-btn.rgb-btn {
    isolation: isolate;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 64px;
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,.18);
    background: linear-gradient(
      110deg,
      #ff356f 0%,
      #a855f7 22%,
      #4f6cff 44%,
      #06b6d4 65%,
      #22c55e 82%,
      #ff356f 100%
    );
    background-size: 350% 350%;
    color: #fff;
    box-shadow:
      0 8px 25px rgba(109,80,230,.20),
      inset 0 1px 0 rgba(255,255,255,.20);
    animation: rgb-flow 7s ease-in-out infinite;
  }

  .rgb-btn .btn-label {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 112px;
    padding: 7px 20px;
    border: 1px solid rgba(255,255,255,.20);
    border-radius: 11px;
    background: #111625;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    line-height: 1.6;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    box-shadow: 0 3px 10px rgba(0,0,0,.15);
    pointer-events: none;
  }

  .btn-label .icon {
    width: 18px;
    height: 18px;
    stroke-width: 2.2;
  }

  .menu-btn:active,
  .primary-btn:active,
  .ghost-btn:active,
  .copy-btn:active,
  .icon-btn:active {
    transform: scale(.965);
  }

  /* ===== وضعیت‌ها ===== */

  .spinner {
    width: 38px;
    height: 38px;
    margin: 8px auto 16px;
    border: 2px solid rgba(244,207,119,.12);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }

  .result-icon {
    margin: 4px 0 18px;
    text-align: center;
    font-size: 42px;
    animation: result-in .6s var(--ease-out) backwards;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 0 12px;
    padding: 14px 16px;
    border: 1px solid var(--card-border);
    border-radius: 17px;
    background: rgba(0,0,0,.17);
  }

  .status-text {
    color: var(--success);
    font-size: 15px;
    font-weight: 700;
  }

  /* ===== اسکلتون ===== */

  .skel {
    border-radius: var(--radius-lg);
    background: linear-gradient(
      100deg,
      rgba(255,255,255,.035) 30%,
      rgba(255,255,255,.085) 50%,
      rgba(255,255,255,.035) 70%
    );
    background-size: 220% 100%;
    animation: shimmer 1.8s ease-in-out infinite;
  }

  .skel-card {
    height: 176px;
    margin-bottom: 22px;
  }

  .skel-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }

  .skel-btn {
    height: 132px;
    border-radius: var(--radius-md);
  }

  .skel-panel {
    height: 140px;
  }

  /* ===== اعلان‌ها ===== */

  .sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 76px)
      16px
      calc(env(safe-area-inset-bottom, 0px) + 20px);
    background: rgba(3,6,11,.66);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .25s ease, visibility .25s;
  }

  .sheet-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .sheet {
    width: min(420px, 100%);
    max-height: 70vh;
    max-height: 70dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 18px;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 26px;
    background: linear-gradient(145deg, #20242d, #141820);
    box-shadow: 0 30px 90px rgba(0,0,0,.4);
    transform: translateY(-14px) scale(.975);
    transition: transform .35s var(--ease-out);
  }

  .sheet-overlay.show .sheet {
    transform: translateY(0) scale(1);
  }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  .sheet h3 {
    margin: 0;
    font-size: 16px;
  }

  .close-btn {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
    border-radius: 11px;
  }

  .close-btn .icon {
    width: 18px;
    height: 18px;
  }

  .notif-item {
    margin-bottom: 8px;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,.045);
    border-radius: 15px;
    background: rgba(255,255,255,.035);
    font-size: 14px;
    line-height: 1.9;
    overflow-wrap: anywhere;
    animation: rise .4s var(--ease-out) backwards;
  }

  .notif-item.success {
    border-inline-start: 3px solid var(--success);
  }

  .notif-item.fail {
    border-inline-start: 3px solid var(--danger);
  }

  .notif-item .t {
    margin-top: 5px;
    direction: ltr;
    text-align: right;
    color: var(--text-dim);
    font-size: 11px;
  }

  .notif-empty {
    padding: 24px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* ===== پیام کوتاه ===== */

  .toast {
    position: fixed;
    z-index: 100;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    left: 50%;
    width: max-content;
    max-width: calc(100vw - 40px);
    padding: 12px 18px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 15px;
    background: #242a35;
    color: #f5f5f7;
    box-shadow: 0 12px 36px rgba(0,0,0,.3);
    text-align: center;
    font-size: 13px;
    line-height: 1.9;
    opacity: 0;
    visibility: hidden;
    transform: translate(-50%, 14px);
    pointer-events: none;
    transition:
      opacity .25s ease,
      transform .3s var(--ease-out),
      visibility .25s;
  }

  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  /* ===== افکت لمس و حرکت صفحه ===== */

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
    pointer-events: none;
    animation: ripple-out .6s var(--ease-out) forwards;
  }

  .anim-in-right {
    animation: forward-in .4s var(--ease-out) backwards;
  }

  .anim-in-left {
    animation: back-in .4s var(--ease-out) backwards;
  }

  .anim-pop {
    animation: panel-in .35s var(--ease-out) backwards;
  }

  @media (hover: hover) and (pointer: fine) {
    .menu-btn:hover {
      transform: translateY(-4px);
      border-color: rgba(244,207,119,.23);
      box-shadow: 0 12px 28px rgba(0,0,0,.16);
    }

    .menu-btn:hover .menu-icon {
      transform: translateY(-2px) rotate(-5deg);
    }

    .primary-btn:hover,
    .copy-btn:hover {
      transform: translateY(-2px);
    }

    .rgb-btn:hover {
      box-shadow:
        0 10px 30px rgba(109,80,230,.30),
        inset 0 1px 0 rgba(255,255,255,.20);
    }

    .ghost-btn:hover,
    .icon-btn:hover {
      background: rgba(255,255,255,.08);
    }
  }

  @media (max-width: 360px) {
    .app {
      padding-inline: 14px;
    }

    .topbar {
      gap: 8px;
    }

    .brand {
      font-size: 11px;
    }

    .menu-btn {
      padding-inline: 7px;
      font-size: 13px;
    }

    .panel {
      padding-inline: 16px;
    }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes shimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }

  @keyframes rgb-flow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes app-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes forward-in {
    from { opacity: 0; transform: translateX(14px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes back-in {
    from { opacity: 0; transform: translateX(-14px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes panel-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes result-in {
    from { opacity: 0; transform: scale(.8) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes dot-in {
    from { opacity: 0; transform: scale(.4); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes ripple-out {
    from { opacity: .16; transform: scale(0); }
    to { opacity: 0; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

<script>
"use strict";

/* ===================== Telegram ===================== */

const API_BASE = "https://mio-backend-1-sus9.onrender.com/api";
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const TG_USER_ID = tg?.initDataUnsafe?.user?.id || "guest";
const TG_FIRST_NAME = tg?.initDataUnsafe?.user?.first_name || "";

const greeting = TG_FIRST_NAME
  ? `خوش آمدید ${TG_FIRST_NAME} عزیز`
  : "خوش آمدید عزیز";

document.getElementById("topWelcome").textContent = greeting;
document.getElementById("welcomeText").textContent = greeting;

/*
  بک‌اند باید Telegram initData را اعتبارسنجی کند.
  نمایش نام در فرانت‌اند جایگزین احراز هویت نیست.
*/

function authHeaders() {
  return {
    "Content-Type": "application/json",
    "Authorization": "tma " + (tg?.initData || "")
  };
}

/* ===================== API ===================== */

async function apiRequest(path, options = {}) {
  try {
    const response = await fetch(`${API_BASE}${path}`, {
      ...options,
      headers: authHeaders()
    });

    const data = await response.json();

    if (!data || typeof data !== "object") {
      return { ok: false, error: "invalid_response" };
    }

    if (!response.ok) {
      return {
        ok: false,
        error: data.error || "server"
      };
    }

    return data;
  } catch (error) {
    console.error("API request failed:", path, error);
    return { ok: false, error: "network" };
  }
}

const MioAPI = {
  async getUser() {
    const data = await apiRequest("/user");
    return data.ok === false ? null : data;
  },

  async getInviteLink() {
    const data = await apiRequest("/invite-link");
    return typeof data.link === "string" ? data.link : "";
  },

  requestWithdraw(target) {
    return apiRequest("/withdraw", {
      method: "POST",
      body: JSON.stringify({ target })
    });
  },

  requestBankWithdraw(card) {
    return apiRequest("/withdraw-bank", {
      method: "POST",
      body: JSON.stringify({ card })
    });
  },

  async getWithdrawStatus() {
    const data = await apiRequest("/withdraw-status");

    if (data.ok === false) {
      return { status: "unknown" };
    }

    return data;
  },

  requestReceipt() {
    return apiRequest("/receipt", {
      method: "POST"
    });
  },

  enableDaily() {
    return apiRequest("/daily/enable", {
      method: "POST"
    });
  }
};

/* ===================== State / DOM ===================== */

const state = {
  balance: 0,
  daily_enabled: false,
  notifications: []
};

const app = document.getElementById("app");
const panel = document.getElementById("panel");
const homeSection = document.getElementById("homeSection");
const viewSection = document.getElementById("viewSection");
const pageTitle = document.getElementById("pageTitle");
const backArrow = document.getElementById("backArrow");
const balanceValueEl = document.getElementById("balanceValue");
const refreshBtn = document.getElementById("refreshBtn");
const skeletonSection = document.getElementById("skeletonSection");

const reduceMotion = window.matchMedia(
  "(prefers-reduced-motion: reduce)"
);

let hasUserData = false;
let currentView = "home";
let viewVersion = 0;
let userRequestVersion = 0;
let lastWithdrawMethod = "id";

let activeWithdrawal = null;
let pollingWithdrawal = false;

/* ===================== Helpers ===================== */

function fmt(value) {
  return Number(value || 0).toLocaleString("en-US");
}

function toEnglishDigits(value) {
  return value
    .replace(/[۰-۹]/g, digit => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)))
    .replace(/[٠-٩]/g, digit => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)));
}

let toastTimer;

function showToast(message) {
  const toast = document.getElementById("toast");

  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add("show");

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 3200);
}

async function copyText(text, button) {
  if (!text) return;

  try {
    await navigator.clipboard.writeText(text);

    if (!button.isConnected) return;

    const originalText = button.textContent;
    button.textContent = "کپی شد ✓";
    button.classList.add("copied");

    setTimeout(() => {
      if (!button.isConnected) return;
      button.textContent = originalText;
      button.classList.remove("copied");
    }, 1800);
  } catch (error) {
    console.error("Clipboard failed:", error);
    showToast("کپی انجام نشد؛ متن را دستی کپی کنید.");
  }
}

function rgbConfirmLabel(text = "تأیید") {
  return `
    <span class="btn-label">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m5 12 4 4L19 6"/>
      </svg>
      <span>${text}</span>
    </span>
  `;
}

function ensureUserData() {
  if (hasUserData) return true;

  showToast("اطلاعات حساب هنوز دریافت نشده؛ دکمهٔ بروزرسانی را بزنید.");
  return false;
}

/* ===================== Animated balance ===================== */

let balanceFrame = 0;
let displayedBalance = 0;

function setBalance(value) {
  const target = Number(value);

  if (!Number.isFinite(target)) return;

  state.balance = target;
  cancelAnimationFrame(balanceFrame);

  if (reduceMotion.matches || displayedBalance === target) {
    displayedBalance = target;
    balanceValueEl.textContent = fmt(target);
    return;
  }

  const from = displayedBalance;
  const startedAt = performance.now();
  const duration = 850;

  function tick(now) {
    if (reduceMotion.matches) {
      displayedBalance = target;
      balanceValueEl.textContent = fmt(target);
      return;
    }

    const progress = Math.min((now - startedAt) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 4);

    displayedBalance = from + (target - from) * eased;

    balanceValueEl.textContent = fmt(
      progress === 1 ? target : Math.round(displayedBalance)
    );

    if (progress < 1) {
      balanceFrame = requestAnimationFrame(tick);
    }
  }

  balanceFrame = requestAnimationFrame(tick);
}

/* ===================== Navigation ===================== */

function playEnter(element, className) {
  element.classList.remove("anim-in-right", "anim-in-left");
  void element.offsetWidth;
  element.classList.add(className);
}

function paint(html) {
  panel.classList.remove("anim-pop");
  panel.innerHTML = html;
  void panel.offsetWidth;
  panel.classList.add("anim-pop");
}

function showHome() {
  currentView = "home";
  viewVersion++;

  homeSection.style.display = "block";
  viewSection.style.display = "none";
  pageTitle.textContent = "Mio Point";
  backArrow.style.display = "none";

  app.classList.remove("view-active");
  playEnter(homeSection, "anim-in-left");
}

function showView(name, title) {
  currentView = name;
  viewVersion++;

  homeSection.style.display = "none";
  viewSection.style.display = "block";
  pageTitle.textContent = title;
  backArrow.style.display = "flex";

  app.classList.add("view-active");
  playEnter(viewSection, "anim-in-right");

  return viewVersion;
}

backArrow.onclick = showHome;

/* ===================== Notifications ===================== */

const notifOverlay = document.getElementById("notifOverlay");
const notifSheet = document.getElementById("notifSheet");
const notifList = document.getElementById("notifList");
const bellBtn = document.getElementById("bellBtn");
const bellDot = document.getElementById("bellDot");
const closeNotifBtn = document.getElementById("closeNotifBtn");

const LAST_SEEN_KEY = `mio_last_seen_notif_${TG_USER_ID}`;

let lastSeenMemory = "";
let previousFocus = null;
let previousOverflow = "";

function getLastSeenTime() {
  try {
    return localStorage.getItem(LAST_SEEN_KEY) || lastSeenMemory;
  } catch {
    return lastSeenMemory;
  }
}

function setLastSeenTime(value) {
  lastSeenMemory = String(value || "");

  try {
    localStorage.setItem(LAST_SEEN_KEY, lastSeenMemory);
  } catch {
    // در صورت نبود دسترسی، مقدار در حافظه نگه داشته می‌شود.
  }
}

function renderNotifications() {
  notifList.replaceChildren();

  if (!state.notifications.length) {
    const empty = document.createElement("div");
    empty.className = "notif-empty";
    empty.textContent = "هنوز اعلانی نداری";
    notifList.appendChild(empty);
    return;
  }

  const fragment = document.createDocumentFragment();

  state.notifications.forEach((notification, index) => {
    const item = document.createElement("div");
    item.className = "notif-item " +
      (notification.type === "fail" ? "fail" : "success");

    item.style.animationDelay = `${Math.min(index, 6) * 45}ms`;

    const text = document.createElement("div");
    text.textContent = String(notification.text || "");

    const time = document.createElement("div");
    time.className = "t";
    time.textContent = String(notification.time || "");

    item.append(text, time);
    fragment.appendChild(item);
  });

  notifList.appendChild(fragment);
}

function updateBellDot() {
  const newestTime = String(state.notifications[0]?.time || "");

  bellDot.classList.toggle(
    "show",
    Boolean(newestTime && newestTime !== getLastSeenTime())
  );
}

function openNotifications() {
  if (notifOverlay.classList.contains("show")) return;

  previousFocus = document.activeElement;
  previousOverflow = document.body.style.overflow;

  renderNotifications();

  notifOverlay.inert = false;
  notifOverlay.setAttribute("aria-hidden", "false");
  notifOverlay.classList.add("show");
  bellBtn.setAttribute("aria-expanded", "true");

  document.body.style.overflow = "hidden";
  closeNotifBtn.focus({ preventScroll: true });
  app.inert = true;

  if (state.notifications.length) {
    setLastSeenTime(state.notifications[0].time);
  }

  updateBellDot();
}

function closeNotifications() {
  if (!notifOverlay.classList.contains("show")) return;

  app.inert = false;
  document.body.style.overflow = previousOverflow;
  bellBtn.setAttribute("aria-expanded", "false");

  if (previousFocus?.isConnected) {
    previousFocus.focus({ preventScroll: true });
  }

  notifOverlay.classList.remove("show");
  notifOverlay.setAttribute("aria-hidden", "true");
  notifOverlay.inert = true;
}

bellBtn.onclick = openNotifications;
closeNotifBtn.onclick = closeNotifications;

notifOverlay.onclick = event => {
  if (event.target === notifOverlay) closeNotifications();
};

notifSheet.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    event.preventDefault();
    closeNotifications();
    return;
  }

  if (event.key !== "Tab") return;

  const focusable = [...notifSheet.querySelectorAll(
    'button:not(:disabled), a[href], input:not(:disabled), ' +
    '[tabindex]:not([tabindex="-1"])'
  )].filter(element => element.getClientRects().length);

  const first = focusable[0];
  const last = focusable[focusable.length - 1];

  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

/* ===================== Invite ===================== */

async function viewInvite() {
  const version = showView("invite", "👥 لینک دعوت");

  paint(`
    <p>
      اگر این لینک را برای دوستتان بفرستید و او با همین لینک
      ربات را استارت کند، مستقیم
      <b class="gold-text">۴۰۰,۰۰۰ میو</b>
      به حساب شما واریز خواهد شد.
    </p>

    <div class="link-box">
      <span id="inviteLinkText">در حال دریافت لینک…</span>
      <button type="button" class="copy-btn" id="copyBtn" disabled>
        کپی
      </button>
    </div>
  `);

  const link = await MioAPI.getInviteLink();

  if (version !== viewVersion) return;

  const linkElement = document.getElementById("inviteLinkText");
  const copyButton = document.getElementById("copyBtn");

  linkElement.textContent = link || "خطا در دریافت لینک";
  copyButton.disabled = !link;
  copyButton.onclick = () => copyText(link, copyButton);
}

/* ===================== Withdraw / ID ===================== */

function viewWithdrawForm() {
  if (activeWithdrawal) {
    viewActiveWithdrawal();
    return;
  }

  if (!ensureUserData()) return;

  lastWithdrawMethod = "id";
  showView("withdraw-form", "📤 برداشت با آیدی");

  paint(`
    <p>دوست عزیز، شما در حالت برداشت هستید.</p>

    <p>
      موجودی قابل برداشت شما:
      <b class="gold-text">${fmt(state.balance)} میو</b>
    </p>

    <p>آیدی تلگرام خود را وارد کنید و سپس تأیید را بزنید.</p>

    <form id="withdrawForm" novalidate>
      <label class="field-label" for="withdrawIdInput">
        آیدی تلگرام
      </label>

      <input
        class="id-input"
        id="withdrawIdInput"
        placeholder="@username"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-describedby="withdrawError"
      >

      <div
        class="field-error"
        id="withdrawError"
        role="alert"
      ></div>

      <button
        type="submit"
        class="primary-btn rgb-btn"
        id="withdrawConfirmBtn"
      >
        ${rgbConfirmLabel()}
      </button>
    </form>
  `);

  document.getElementById("withdrawForm").onsubmit = event => {
    event.preventDefault();

    const input = document.getElementById("withdrawIdInput");
    const error = document.getElementById("withdrawError");
    const target = input.value.trim();

    if (!target.startsWith("@") || target.length < 2) {
      error.textContent = "❌ آیدی باید با @ شروع شود.";
      input.focus();
      return;
    }

    if (state.balance <= 0) {
      error.textContent = "❌ موجودی شما صفر است.";
      return;
    }

    startWithdrawal("id", target);
  };
}

/* ===================== Withdraw / Bank ===================== */

function viewBankWithdrawConfirm() {
  if (activeWithdrawal) {
    viewActiveWithdrawal();
    return;
  }

  if (!ensureUserData()) return;

  lastWithdrawMethod = "bank";
  showView("bank-confirm", "🏦 بانک میویی");

  paint(`
    <p>
      شما می‌توانید
      <b class="gold-text">${fmt(state.balance)} میو</b>
      از موجودی خود را با بانک میویی برداشت کنید.
    </p>

    <p>برای ادامه روی تأیید بزنید.</p>

    <button
      type="button"
      class="primary-btn rgb-btn"
      id="bankConfirmBtn"
    >
      ${rgbConfirmLabel()}
    </button>

    <button type="button" class="ghost-btn" id="bankCancelBtn">
      لغو
    </button>
  `);

  document.getElementById("bankConfirmBtn").onclick =
    viewBankWithdrawCardInput;

  document.getElementById("bankCancelBtn").onclick = showHome;
}

function viewBankWithdrawCardInput() {
  if (activeWithdrawal) {
    viewActiveWithdrawal();
    return;
  }

  if (!ensureUserData()) return;

  lastWithdrawMethod = "bank";
  showView("bank-form", "🏦 بانک میویی");

  paint(`
    <p>شماره کارت میویی خود را وارد کنید:</p>

    <form id="bankCardForm" novalidate>
      <label class="field-label" for="bankCardInput">
        شماره کارت میویی
      </label>

      <input
        class="id-input"
        id="bankCardInput"
        placeholder="مثلاً 232491826963"
        inputmode="numeric"
        autocomplete="off"
        aria-describedby="bankCardError"
      >

      <div
        class="field-error"
        id="bankCardError"
        role="alert"
      ></div>

      <button
        type="submit"
        class="primary-btn rgb-btn"
        id="bankCardConfirmBtn"
      >
        ${rgbConfirmLabel()}
      </button>

      <button type="button" class="ghost-btn" id="bankCardBackBtn">
        برگشت
      </button>
    </form>
  `);

  document.getElementById("bankCardBackBtn").onclick =
    viewBankWithdrawConfirm;

  document.getElementById("bankCardForm").onsubmit = event => {
    event.preventDefault();

    const input = document.getElementById("bankCardInput");
    const error = document.getElementById("bankCardError");
    const card = toEnglishDigits(input.value.trim());

    if (!/^[0-9]{10,20}$/.test(card)) {
      error.textContent =
        "❌ شماره کارت میویی باید بین ۱۰ تا ۲۰ رقم باشد.";
      input.focus();
      return;
    }

    if (state.balance <= 0) {
      error.textContent = "❌ موجودی شما صفر است.";
      return;
    }

    startWithdrawal("bank", card);
  };
}

/* ===================== Withdraw process ===================== */

function isWithdrawalView() {
  return currentView === "withdraw-waiting" ||
         currentView === "withdraw-unknown";
}

function viewWithdrawWaiting() {
  showView("withdraw-waiting", "📤 برداشت");

  paint(`
    <div class="spinner" aria-hidden="true"></div>
    <p class="muted-center" role="status">⏳ لطفاً منتظر بمانید…</p>
    <p class="muted-center" id="queuePositionText"></p>
    <p class="muted-center" id="queueWaitText"></p>
  `);

  if (activeWithdrawal) {
    updateWaitingInfo(
      activeWithdrawal.position,
      activeWithdrawal.wait_text
    );
  }
}

function updateWaitingInfo(position, waitText) {
  const positionElement = document.getElementById("queuePositionText");
  const waitElement = document.getElementById("queueWaitText");

  if (positionElement) {
    positionElement.textContent = position
      ? `👤 شما نفر ${position} در صف هستید`
      : "";
  }

  if (waitElement) {
    waitElement.textContent = waitText ? `⏱ ${waitText}` : "";
  }
}

function viewActiveWithdrawal() {
  if (activeWithdrawal?.phase === "unknown") {
    viewWithdrawUnknown();
  } else {
    viewWithdrawWaiting();
  }
}

async function startWithdrawal(method, value) {
  if (activeWithdrawal) {
    viewActiveWithdrawal();
    return;
  }

  lastWithdrawMethod = method;

  const job = {
    method,
    phase: "submitting",
    position: null,
    wait_text: ""
  };

  activeWithdrawal = job;
  viewWithdrawWaiting();

  const result = method === "bank"
    ? await MioAPI.requestBankWithdraw(value)
    : await MioAPI.requestWithdraw(value);

  if (activeWithdrawal !== job) return;

  if (!result.ok) {
    if (
      result.error === "network" ||
      result.error === "invalid_response"
    ) {
      job.phase = "unknown";

      if (isWithdrawalView()) {
        viewWithdrawUnknown();
      } else {
        showToast("وضعیت برداشت مشخص نشد؛ دوباره وضعیت را بررسی کنید.");
      }

      return;
    }

    activeWithdrawal = null;

    if (isWithdrawalView()) {
      viewWithdrawFailed();
    } else {
      showToast("درخواست برداشت ناموفق بود.");
    }

    return;
  }

  job.phase = "pending";
  job.position = result.position;
  job.wait_text = result.wait_text;

  if (currentView === "withdraw-waiting") {
    updateWaitingInfo(job.position, job.wait_text);
  }

  pollWithdrawStatus();
}

async function pollWithdrawStatus() {
  if (pollingWithdrawal || !activeWithdrawal) return;

  const job = activeWithdrawal;
  pollingWithdrawal = true;
  job.phase = "pending";

  try {
    for (let attempt = 0; attempt < 40; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 3000));

      if (activeWithdrawal !== job) return;

      const result = await MioAPI.getWithdrawStatus();

      if (activeWithdrawal !== job) return;

      if (result.status === "success") {
        activeWithdrawal = null;

        if (isWithdrawalView()) {
          viewWithdrawSuccess();
        } else {
          showToast("🎉 برداشت شما با موفقیت انجام شد.");
        }

        // موجودی واقعی را دوباره از بک‌اند دریافت می‌کنیم.
        refreshData(false);
        return;
      }

      if (result.status === "failed") {
        activeWithdrawal = null;

        if (isWithdrawalView()) {
          viewWithdrawFailed();
        } else {
          showToast("برداشت ناموفق بود.");
        }

        return;
      }

      if (result.status === "pending") {
        job.position = result.position;
        job.wait_text = result.wait_text;

        if (currentView === "withdraw-waiting") {
          updateWaitingInfo(job.position, job.wait_text);
        }
      }
    }

    job.phase = "unknown";

    if (isWithdrawalView()) {
      viewWithdrawUnknown();
    } else {
      showToast("نتیجهٔ برداشت هنوز مشخص نشده است.");
    }
  } finally {
    pollingWithdrawal = false;
  }
}

function viewWithdrawUnknown() {
  showView("withdraw-unknown", "📤 وضعیت برداشت");

  paint(`
    <div class="result-icon">⏳</div>

    <p class="muted-center">
      <b>نتیجهٔ برداشت هنوز مشخص نشده است.</b>
    </p>

    <p class="muted-center">
      برای دریافت آخرین وضعیت، بررسی دوباره را بزنید.
    </p>

    <button type="button" class="primary-btn" id="checkWithdrawBtn">
      بررسی دوباره
    </button>

    <button type="button" class="ghost-btn" id="withdrawHomeBtn">
      بازگشت به خانه
    </button>
  `);

  document.getElementById("checkWithdrawBtn").onclick = () => {
    viewWithdrawWaiting();
    pollWithdrawStatus();
  };

  document.getElementById("withdrawHomeBtn").onclick = showHome;
}

function viewWithdrawFailed() {
  showView("withdraw-failed", "📤 برداشت");

  paint(`
    <div class="result-icon">❌</div>

    <p class="muted-center"><b>برداشت ناموفق بود</b></p>
    <p class="muted-center">لطفاً دوباره تلاش کنید.</p>

    <button type="button" class="primary-btn" id="retryBtn">
      تلاش دوباره
    </button>
  `);

  document.getElementById("retryBtn").onclick = () => {
    if (lastWithdrawMethod === "bank") {
      viewBankWithdrawCardInput();
    } else {
      viewWithdrawForm();
    }
  };
}

function viewWithdrawSuccess() {
  showView("withdraw-success", "📤 برداشت");

  paint(`
    <div class="result-icon">🎉</div>

    <p class="muted-center">
      <b>میوهای شما با موفقیت واریز شد</b>
    </p>

    <p class="muted-center">آیا مایل به دریافت رسید هستید؟</p>

    <button type="button" class="primary-btn" id="receiptYesBtn">
      تأیید، رسید می‌خواهم
    </button>

    <button type="button" class="ghost-btn" id="receiptNoBtn">
      فعلاً نه
    </button>
  `);

  document.getElementById("receiptYesBtn").onclick = requestReceipt;
  document.getElementById("receiptNoBtn").onclick = showHome;
}

/* ===================== Receipt ===================== */

async function requestReceipt() {
  const version = showView("receipt-loading", "📨 رسید");

  paint(`
    <div class="spinner" aria-hidden="true"></div>
    <p class="muted-center" role="status">در حال ثبت درخواست…</p>
  `);

  const result = await MioAPI.requestReceipt();

  if (version !== viewVersion) {
    showToast(
      result.ok
        ? "درخواست رسید ثبت شد."
        : "ثبت درخواست رسید انجام نشد."
    );
    return;
  }

  if (!result.ok) {
    paint(`
      <div class="result-icon">📨</div>

      <p class="muted-center">
        ثبت درخواست رسید انجام نشد. دوباره تلاش کنید.
      </p>

      <button type="button" class="primary-btn" id="receiptRetryBtn">
        تلاش دوباره
      </button>
    `);

    document.getElementById("receiptRetryBtn").onclick = requestReceipt;
    return;
  }

  showView("receipt", "📨 رسید");

  paint(`
    <div class="result-icon">📨</div>

    <p class="muted-center"><b>درخواست رسید ثبت شد.</b></p>
    <p class="muted-center">به اکانت زیر پیام بده:</p>

    <div class="link-box">
      <span style="text-align:center;">@Pott5y6jg</span>
      <button type="button" class="copy-btn" id="copyAccountBtn">
        کپی
      </button>
    </div>

    <p class="muted-center">و بنویس:</p>

    <p class="muted-center">
      <b class="gold-text">رسیدم رو بده ❤️</b>
    </p>

    <p class="muted-center">
      🤖 رسید به صورت خودکار برات ارسال می‌شود.
    </p>
  `);

  const button = document.getElementById("copyAccountBtn");
  button.onclick = () => copyText("@Pott5y6jg", button);
}

/* ===================== Daily ===================== */

let enablingDaily = false;

function viewDaily() {
  if (!ensureUserData()) return;

  showView("daily", "🎁 میو روزانه");

  if (state.daily_enabled) {
    paint(`
      <div class="toggle-row">
        <span class="status-text">روشن است ✅</span>
      </div>

      <p>هر روز منتظر واریز ۳۴۰,۰۰۰ میو باشید.</p>
    `);

    return;
  }

  paint(`
    <p>
      با روشن کردن این قابلیت، هر روز
      <b class="gold-text">۳۴۰,۰۰۰ میو</b>
      دریافت می‌کنید.
    </p>

    <button
      type="button"
      class="primary-btn"
      id="enableDailyBtn"
      ${enablingDaily ? "disabled" : ""}
    >
      ${enablingDaily ? "در حال فعال‌سازی…" : "✅ فعال کن"}
    </button>
  `);

  document.getElementById("enableDailyBtn").onclick = async () => {
    if (enablingDaily) return;

    enablingDaily = true;

    const button = document.getElementById("enableDailyBtn");
    button.disabled = true;
    button.textContent = "در حال فعال‌سازی…";

    const result = await MioAPI.enableDaily();
    enablingDaily = false;

    if (result.ok) {
      state.daily_enabled = true;

      if (typeof result.balance === "number") {
        setBalance(result.balance);
      }
    } else {
      showToast("فعال‌سازی انجام نشد؛ دوباره تلاش کنید.");
    }

    if (currentView === "daily") {
      viewDaily();
    }
  };
}

/* ===================== User data / Refresh ===================== */

function applyUserData(user) {
  if (!user || !Number.isFinite(Number(user.balance))) return false;

  hasUserData = true;
  setBalance(user.balance);
  state.daily_enabled = Boolean(user.daily_enabled);

  state.notifications = Array.isArray(user.notifications)
    ? user.notifications.filter(
        notification => notification && typeof notification === "object"
      )
    : [];

  renderNotifications();

  if (notifOverlay.classList.contains("show")) {
    setLastSeenTime(state.notifications[0]?.time);
  }

  updateBellDot();
  return true;
}

async function refreshData(showError = true) {
  const requestVersion = ++userRequestVersion;

  refreshBtn.classList.add("spinning");
  refreshBtn.disabled = true;
  refreshBtn.setAttribute("aria-busy", "true");

  try {
    const user = await MioAPI.getUser();

    if (requestVersion !== userRequestVersion) return;

    if (!applyUserData(user)) {
      if (showError) {
        showToast("دریافت اطلاعات انجام نشد؛ دوباره تلاش کنید.");
      }

      return;
    }

    if (currentView === "daily") {
      viewDaily();
    }
  } finally {
    if (requestVersion === userRequestVersion) {
      refreshBtn.classList.remove("spinning");
      refreshBtn.disabled = false;
      refreshBtn.setAttribute("aria-busy", "false");
    }
  }
}

/* ===================== Touch ripple ===================== */

document.addEventListener("click", event => {
  if (!(event.target instanceof Element)) return;

  const button = event.target.closest(
    ".menu-btn, .primary-btn, .copy-btn"
  );

  if (!button || button.disabled || reduceMotion.matches) return;

  const rect = button.getBoundingClientRect();
  const size = Math.hypot(rect.width, rect.height) * 2;

  const x = event.detail === 0
    ? rect.width / 2
    : event.clientX - rect.left;

  const y = event.detail === 0
    ? rect.height / 2
    : event.clientY - rect.top;

  const ripple = document.createElement("span");
  ripple.className = "ripple";
  ripple.setAttribute("aria-hidden", "true");

  Object.assign(ripple.style, {
    width: `${size}px`,
    height: `${size}px`,
    left: `${x - size / 2}px`,
    top: `${y - size / 2}px`
  });

  button.appendChild(ripple);
  setTimeout(() => ripple.remove(), 650);
}, true);

/* ===================== Wiring ===================== */

document.getElementById("btnInvite").onclick = viewInvite;
document.getElementById("btnWithdraw").onclick = viewWithdrawForm;
document.getElementById("btnBankWithdraw").onclick =
  viewBankWithdrawCardInput;
document.getElementById("btnDaily").onclick = viewDaily;

refreshBtn.onclick = () => refreshData(true);

/* ===================== Init ===================== */

async function init() {
  const requestVersion = ++userRequestVersion;
  const userPromise = MioAPI.getUser();

  let timeoutId;

  const timeoutPromise = new Promise(resolve => {
    timeoutId = setTimeout(() => resolve(null), 4000);
  });

  const firstResult = await Promise.race([
    userPromise,
    timeoutPromise
  ]);

  clearTimeout(timeoutId);

  skeletonSection.style.display = "none";
  showHome();

  if (requestVersion !== userRequestVersion) return;

  if (firstResult) {
    if (!applyUserData(firstResult)) {
      balanceValueEl.textContent = "—";
      showToast("اطلاعات حساب دریافت نشد؛ بروزرسانی را بزنید.");
    }

    return;
  }

  userPromise.then(user => {
    if (requestVersion !== userRequestVersion) return;

    if (!applyUserData(user)) {
      balanceValueEl.textContent = "—";
      showToast("اطلاعات حساب دریافت نشد؛ بروزرسانی را بزنید.");
    }
  });
}

init();
</script>
