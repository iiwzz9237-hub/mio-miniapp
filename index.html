<style>
  /* ===== Mio Point / Visual upgrade ===== */
  :root {
    --bg-mid: #0d1016;
    --card: rgba(255,255,255,.045);
    --card-border: rgba(255,255,255,.085);
    --card-strong: rgba(255,255,255,.10);
    --gold: #f4cf77;
    --text: #f5f5f7;
    --text-dim: #9da5b5;
    --radius-lg: 28px;
    --radius-md: 22px;
    --ease-out: cubic-bezier(.22,1,.36,1);
  }

  html {
    background: #0d1016;
    color-scheme: dark;
  }

  body {
    background: #0d1016;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 90% 0%, rgba(244,207,119,.09), transparent 48%),
      radial-gradient(ellipse at 0% 65%, rgba(109,137,202,.055), transparent 50%),
      linear-gradient(165deg, #10131b, #0b0e14 65%, #11151d);
  }

  button, input {
    font-family: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  button:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 480px;
    padding: 20px 20px 44px;
    animation: mio-app-in .65s var(--ease-out) backwards;
  }

  .topbar {
    padding: 4px 0 12px;
  }

  .brand {
    font-size: 13px;
    font-weight: 700;
    color: #c4c9d3;
    letter-spacing: .6px;
  }

  .bell-btn,
  .refresh-btn,
  .back-arrow {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 15px;
    background: rgba(255,255,255,.035);
    border: 1px solid var(--card-border);
    color: #d8dce5;
  }

  .bell-dot {
    top: 8px;
    left: 9px;
    width: 7px;
    height: 7px;
    background: #f4cf77;
    box-shadow: 0 0 0 3px #14171e;
  }

  .bell-dot.show {
    animation: mio-dot-in .4s var(--ease-out) backwards;
  }

  .title-row {
    margin: 24px 0 28px;
    min-height: 46px;
  }

  .title-row h1.title {
    font-size: clamp(24px, 7vw, 34px);
    font-weight: 800;
    letter-spacing: -.8px;
  }

  /* فضای لازم برای دکمهٔ برگشت در صفحه‌های داخلی */
  .view-active .title-row {
    padding-inline: 48px;
  }

  .view-active .title-row h1.title {
    font-size: clamp(20px, 5.8vw, 28px);
  }

  .back-arrow {
    font-size: 23px;
  }

  .balance-card {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 32px 20px 36px;
    margin-bottom: 22px;
    border: 1px solid rgba(244,207,119,.22);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(244,207,119,.13), transparent 75%),
      linear-gradient(135deg, #202027, #14171f);
    box-shadow:
      0 18px 44px rgba(0,0,0,.20),
      inset 0 1px 0 rgba(255,255,255,.05);
    animation: mio-rise .7s .04s var(--ease-out) backwards;
  }

  .balance-card::before {
    content: "";
    position: absolute;
    inset: 0 18% auto;
    height: 1px;
    background: linear-gradient(90deg, transparent, #f4cf77, transparent);
    opacity: .8;
    pointer-events: none;
  }

  .balance-card::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    border: 1px solid rgba(244,207,119,.065);
    border-radius: 50%;
    left: -95px;
    bottom: -105px;
    box-shadow:
      0 0 0 22px rgba(244,207,119,.025),
      0 0 0 44px rgba(244,207,119,.018);
    pointer-events: none;
    z-index: -1;
  }

  .balance-label {
    color: #c4bba7;
    font-size: 13px;
    margin-bottom: 18px;
  }

  .balance-value {
    max-width: 100%;
    overflow-wrap: anywhere;
    font-size: clamp(30px, 9vw, 46px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1.5px;
    color: #f6d58a;
    text-shadow: 0 3px 24px rgba(244,207,119,.10);
  }

  .balance-unit {
    font-size: 17px;
    color: #d4b46e;
  }

  .grid {
    gap: 12px;
    margin-bottom: 22px;
  }

  .menu-btn {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 13px;
    min-width: 0;
    min-height: 132px;
    padding: 22px 10px;
    line-height: 1.7;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    background: linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.025));
    border: 1px solid var(--card-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    transition:
      transform .25s var(--ease-out),
      border-color .25s ease,
      background .25s ease,
      box-shadow .25s ease;
  }

  .menu-btn .emoji {
    order: -1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    margin: 0;
    border-radius: 16px;
    background: rgba(244,207,119,.09);
    color: #f4cf77;
    transition: transform .3s var(--ease-out);
  }

  #btnInvite .emoji {
    background: rgba(141,174,246,.10);
    color: #9ebbf6;
  }

  #btnBankWithdraw .emoji {
    background: rgba(136,213,181,.10);
    color: #93d8ba;
  }

  #btnDaily .emoji {
    background: rgba(192,156,238,.10);
    color: #c8abef;
  }

  .grid .menu-btn:nth-child(1) { --enter-delay: .10s; }
  .grid .menu-btn:nth-child(2) { --enter-delay: .16s; }
  .grid .menu-btn:nth-child(3) { --enter-delay: .22s; }
  .grid .menu-btn:nth-child(4) { --enter-delay: .28s; }

  .grid .menu-btn:nth-child(n) {
    animation: mio-rise .65s var(--enter-delay) var(--ease-out) backwards;
  }

  .panel {
    padding: 25px 21px;
    background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
  }

  #homeSection > .panel {
    animation: mio-rise .65s .34s var(--ease-out) backwards;
  }

  .panel p {
    font-size: 14px;
    line-height: 2;
  }

  .panel .muted-center {
    font-size: 14px;
  }

  .panel .muted-center b {
    color: #e9ecf2;
  }

  .link-box,
  .toggle-row {
    border-radius: 17px;
    background: rgba(0,0,0,.17);
  }

  .link-box span {
    min-width: 0;
  }

  input.id-input {
    border-radius: 17px;
    background: rgba(0,0,0,.18);
    padding: 16px;
    transition:
      border-color .2s ease,
      background .2s ease,
      box-shadow .2s ease;
  }

  input.id-input:focus {
    outline: none;
    border-color: rgba(244,207,119,.55);
    background: rgba(244,207,119,.025);
    box-shadow: 0 0 0 4px rgba(244,207,119,.07);
  }

  .primary-btn,
  .copy-btn {
    position: relative;
    overflow: hidden;
    color: #252014;
    background: linear-gradient(115deg, #f6d98f, #e8bd5e);
    box-shadow: 0 6px 18px rgba(232,189,94,.10);
  }

  .primary-btn {
    padding: 16px;
    border-radius: 17px;
    font-size: 15px;
  }

  .ghost-btn {
    border-radius: 17px;
    background: rgba(255,255,255,.02);
  }

  .copy-btn.copied {
    background: #92d7ad;
    color: #143322;
  }

  .primary-btn,
  .ghost-btn,
  .copy-btn,
  .refresh-btn,
  .bell-btn,
  .back-arrow {
    transition:
      transform .2s var(--ease-out),
      background .2s ease,
      border-color .2s ease,
      opacity .2s ease;
  }

  .menu-btn:active,
  .primary-btn:active,
  .ghost-btn:active,
  .copy-btn:active,
  .refresh-btn:active,
  .bell-btn:active,
  .back-arrow:active {
    transform: scale(.965);
  }

  button:disabled {
    cursor: not-allowed;
  }

  .spinner {
    width: 38px;
    height: 38px;
    border-width: 2px;
    border-color: rgba(244,207,119,.12);
    border-top-color: var(--gold);
  }

  .refresh-btn.spinning {
    animation: none;
  }

  .refresh-btn.spinning svg {
    animation: spin .85s linear infinite;
  }

  .result-icon {
    margin: 4px 0 18px;
    animation: mio-result .6s var(--ease-out) backwards;
  }

  .skel {
    background: linear-gradient(
      100deg,
      rgba(255,255,255,.035) 30%,
      rgba(255,255,255,.085) 50%,
      rgba(255,255,255,.035) 70%
    );
    background-size: 220% 100%;
    animation-duration: 1.8s;
  }

  .skel-card { height: 176px; }
  .skel-btn { height: 132px; }
  .skel-grid { gap: 12px; }

  /* اعلان‌ها: انیمیشن هنگام بازشدن و بسته‌شدن */
  .sheet-overlay {
    display: flex;
    padding:
      calc(env(safe-area-inset-top, 0px) + 76px)
      16px
      calc(env(safe-area-inset-bottom, 0px) + 20px);
    background: rgba(3,6,11,.66);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .25s ease, visibility .25s;
  }

  .sheet-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .sheet {
    width: min(420px, 100%);
    max-height: 70vh;
    max-height: 70dvh;
    padding: 18px;
    border-radius: 26px;
    background: linear-gradient(145deg, #20242d, #141820);
    border-color: rgba(255,255,255,.11);
    box-shadow: 0 30px 90px rgba(0,0,0,.4);
    overscroll-behavior: contain;
    animation: none;
    transform: translateY(-14px) scale(.975);
    transition: transform .35s var(--ease-out);
  }

  .sheet-overlay.show .sheet {
    transform: translateY(0) scale(1);
  }

  .sheet h3 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .mio-close {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--card-border);
    border-radius: 11px;
    color: var(--text-dim);
    background: rgba(255,255,255,.04);
    cursor: pointer;
    font-size: 24px;
  }

  .notif-item {
    border: 1px solid rgba(255,255,255,.045);
    background: rgba(255,255,255,.035);
    animation: mio-rise .4s var(--ease-out) backwards;
  }

  .anim-in-right {
    animation: mio-forward .4s var(--ease-out) backwards;
  }

  .anim-in-left {
    animation: mio-back .4s var(--ease-out) backwards;
  }

  .anim-pop {
    animation: mio-panel .35s var(--ease-out) backwards;
  }

  .mio-icon {
    display: block;
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .mio-ripple {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
    pointer-events: none;
    animation: mio-ripple .6s var(--ease-out) forwards;
  }

  @media (hover: hover) and (pointer: fine) {
    .menu-btn:hover {
      transform: translateY(-4px);
      border-color: rgba(244,207,119,.23);
      box-shadow: 0 12px 28px rgba(0,0,0,.16);
    }

    .menu-btn:hover .emoji {
      transform: translateY(-2px) rotate(-5deg);
    }

    .primary-btn:hover,
    .copy-btn:hover {
      transform: translateY(-2px);
    }

    .ghost-btn:hover,
    .bell-btn:hover,
    .refresh-btn:hover {
      background: rgba(255,255,255,.08);
    }
  }

  @media (max-width: 360px) {
    .app { padding-inline: 14px; }
    .menu-btn { font-size: 13px; padding-inline: 7px; }
    .panel { padding-inline: 16px; }
  }

  @keyframes mio-app-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes mio-rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes mio-forward {
    from { opacity: 0; transform: translateX(14px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes mio-back {
    from { opacity: 0; transform: translateX(-14px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes mio-panel {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes mio-result {
    from { opacity: 0; transform: scale(.8) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes mio-dot-in {
    from { opacity: 0; transform: scale(.4); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes mio-ripple {
    from { opacity: .14; transform: scale(0); }
    to { opacity: 0; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<script>
(() => {
  "use strict";

  const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  const app = document.querySelector(".app");

  /* آیکون‌های سبک و یکدست، بدون کتابخانهٔ خارجی */
  const paths = {
    withdraw:
      '<path d="M12 16V3m-5 5 5-5 5 5"/>' +
      '<path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',

    invite:
      '<circle cx="9" cy="8" r="3"/>' +
      '<path d="M3 21v-2a6 6 0 0 1 12 0v2M16 4a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-4-5.66"/>',

    bank:
      '<path d="m3 9 9-6 9 6H3Zm2 3v6m7-6v6m7-6v6M3 21h18"/>',

    gift:
      '<rect x="3" y="8" width="18" height="4" rx="1"/>' +
      '<path d="M5 12v9h14v-9M12 8v13"/>' +
      '<path d="M12 8H7.5A2.5 2.5 0 1 1 10 5.5L12 8Zm0 0h4.5A2.5 2.5 0 1 0 14 5.5L12 8Z"/>',

    bell:
      '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',

    refresh:
      '<path d="M20 7v5h-5M4 17v-5h5"/>' +
      '<path d="M6.1 6a8 8 0 0 1 13.3 3M4.6 15A8 8 0 0 0 17.9 18"/>'
  };

  function icon(name) {
    return `<svg class="mio-icon" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.65"
      stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true">${paths[name]}</svg>`;
  }

  const menuIcons = {
    btnWithdraw: "withdraw",
    btnInvite: "invite",
    btnBankWithdraw: "bank",
    btnDaily: "gift"
  };

  Object.entries(menuIcons).forEach(([id, name]) => {
    const holder = document.querySelector(`#${id} .emoji`);
    if (holder) {
      holder.innerHTML = icon(name);
      holder.setAttribute("aria-hidden", "true");
    }
  });

  const bell = document.getElementById("bellBtn");
  const dot = document.getElementById("bellDot");

  bell.innerHTML = icon("bell");
  bell.appendChild(dot);

  document.getElementById("refreshBtn").innerHTML = icon("refresh");

  /* تبدیل کنترل‌ها به دکمهٔ واقعی با حفظ رویدادهای موجود */
  document.querySelectorAll(".menu-btn, .back-arrow").forEach(old => {
    if (old.tagName === "BUTTON") return;

    const button = document.createElement("button");

    for (const attribute of old.attributes) {
      button.setAttribute(attribute.name, attribute.value);
    }

    button.type = "button";
    button.innerHTML = old.innerHTML;
    button.onclick = old.onclick;

    if (button.classList.contains("back-arrow")) {
      button.setAttribute("aria-label", "بازگشت به خانه");
    }

    old.replaceWith(button);
  });

  /*
   * کد اصلی یک ارجاع به backArrow نگه داشته است.
   * نمایش دکمهٔ جدید را با وضعیت صفحه هماهنگ می‌کنیم.
   */
  const home = document.getElementById("homeSection");
  const back = document.getElementById("backArrow");
  const view = document.getElementById("viewSection");

  function syncNavigation() {
    const isView = view.style.display !== "none";
    back.style.display = isView ? "flex" : "none";
    app.classList.toggle("view-active", isView);
  }

  new MutationObserver(syncNavigation).observe(view, {
    attributes: true,
    attributeFilter: ["style"]
  });

  syncNavigation();

  /* تغییر تدریجی عدد موجودی */
  const originalSetBalance = setBalance;
  const balanceElement = document.getElementById("balanceValue");

  let balanceFrame = 0;
  let displayedBalance = Number(state.balance) || 0;

  setBalance = function(value) {
    cancelAnimationFrame(balanceFrame);

    originalSetBalance(value);

    const target = Number(value);

    if (!Number.isFinite(target)) return;

    const from = displayedBalance;

    if (reduceMotion.matches || from === target) {
      displayedBalance = target;
      return;
    }

    const start = performance.now();
    const duration = 850;

    balanceElement.textContent = fmt(Math.round(from));

    function tick(now) {
      if (reduceMotion.matches) {
        displayedBalance = target;
        balanceElement.textContent = fmt(target);
        return;
      }

      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 4);

      displayedBalance = from + (target - from) * eased;

      balanceElement.textContent = fmt(
        progress === 1 ? target : Math.round(displayedBalance)
      );

      if (progress < 1) {
        balanceFrame = requestAnimationFrame(tick);
      }
    }

    balanceFrame = requestAnimationFrame(tick);
  };

  /* افکت لمس برای دکمه‌های ثابت و دکمه‌های ساخته‌شده با JS */
  document.addEventListener("click", event => {
    const button = event.target.closest(
      ".menu-btn, .primary-btn, .copy-btn"
    );

    if (!button || button.disabled || reduceMotion.matches) return;

    const rect = button.getBoundingClientRect();
    const size = Math.hypot(rect.width, rect.height) * 2;

    const x = event.detail === 0
      ? rect.width / 2
      : event.clientX - rect.left;

    const y = event.detail === 0
      ? rect.height / 2
      : event.clientY - rect.top;

    const ripple = document.createElement("span");
    ripple.className = "mio-ripple";
    ripple.setAttribute("aria-hidden", "true");

    Object.assign(ripple.style, {
      width: `${size}px`,
      height: `${size}px`,
      left: `${x - size / 2}px`,
      top: `${y - size / 2}px`
    });

    button.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
  });

  /* مدیریت پنجرهٔ اعلان‌ها و فوکوس کیبورد */
  const overlay = document.getElementById("notifOverlay");
  const sheet = overlay.querySelector(".sheet");
  const heading = sheet.querySelector("h3");

  heading.id = "mioNotificationTitle";
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.setAttribute("aria-labelledby", heading.id);

  const closeButton = document.createElement("button");
  closeButton.type = "button";
  closeButton.className = "mio-close";
  closeButton.textContent = "×";
  closeButton.setAttribute("aria-label", "بستن اعلان‌ها");

  closeButton.onclick = () => overlay.classList.remove("show");
  heading.appendChild(closeButton);

  bell.setAttribute("aria-haspopup", "dialog");
  bell.setAttribute("aria-controls", "notifOverlay");

  let wasOpen = false;
  let previousFocus = null;
  let previousOverflow = "";
  let previousInert = false;

  function syncSheet() {
    const isOpen = overlay.classList.contains("show");

    overlay.setAttribute("aria-hidden", String(!isOpen));
    overlay.inert = !isOpen;
    bell.setAttribute("aria-expanded", String(isOpen));

    if (isOpen === wasOpen) return;
    wasOpen = isOpen;

    if (isOpen) {
      previousFocus = document.activeElement;
      previousOverflow = document.body.style.overflow;
      previousInert = app.inert;

      document.body.style.overflow = "hidden";
      closeButton.focus({ preventScroll: true });
      app.inert = true;
    } else {
      app.inert = previousInert;
      document.body.style.overflow = previousOverflow;

      if (previousFocus?.isConnected) {
        previousFocus.focus({ preventScroll: true });
      }
    }
  }

  new MutationObserver(syncSheet).observe(overlay, {
    attributes: true,
    attributeFilter: ["class"]
  });

  syncSheet();

  sheet.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      event.preventDefault();
      overlay.classList.remove("show");
      return;
    }

    if (event.key !== "Tab") return;

    const focusable = [...sheet.querySelectorAll(
      'button:not(:disabled), a[href], input:not(:disabled), ' +
      'select:not(:disabled), textarea:not(:disabled), ' +
      '[tabindex]:not([tabindex="-1"])'
    )].filter(element => element.getClientRects().length);

    const first = focusable[0];
    const last = focusable[focusable.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });
})();
</script>
